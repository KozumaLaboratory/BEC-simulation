# Pre-commit hooks for SpinorBEC.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run on all files (one-off):
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: "^runs/.*\\.yaml$"   # YAML configs may be invalid mid-edit
      - id: check-added-large-files
        args: ["--maxkb=2048"]         # block accidental .jld2 / PNG dumps
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks

  # JuliaFormatter — local hook (no published pre-commit repo). Mirrors
  # the .github/workflows/ci.yml `format` job: same scope (src/, test/),
  # same .JuliaFormatter.toml. Rewrites files in place; pre-commit then
  # aborts so you can re-stage the formatted diff.
  - repo: local
    hooks:
      - id: julia-format
        name: JuliaFormatter
        entry: julia -e 'using JuliaFormatter; exit(format(ARGS) ? 0 : 1)'
        language: system
        files: '^(src|test)/.*\.jl$'
        pass_filenames: true
