# Eu151 ground state, continuing from a previously saved psi
#
# Loads psi from a JLD2 file (looks for keys "psi", "psi_uniform", "psi_fl")
# and uses it as the ITP initial condition. Useful for refining a converged
# state with different parameters or longer evolution.

experiment:
  name: "Eu151 continue from saved psi"
  type: ground_state

  system:
    atom: Eu151
    grid:
      n_points: [64, 64, 64]
      box_size: [12.0, 12.0, 12.0]
    interactions:
      N_atoms: 50000
      omega_ref: 691.15
      c1_ratio: 0.0
      c_lhy: 1135.0
    ddi:
      enabled: true

  ground_state:
    dt: 0.0001
    n_steps: 10000
    tol: 1.0e-7
    initial_state: ferromagnetic_min   # ignored because psi_init_path is set
    psi_init_path: "output/eu151_test_ddi_continue.jld2"
    target_magnetization: -6.0
    backend: cuda
    zeeman:
      p: 0.0
      q: 0.0
    potential:
      type: harmonic
      omega: [1.0, 1.0, 1.1818]

