<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Progress</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: #0a0e1a;
            color: #e8edf5;
            padding: 1rem;
        }

        .header {
            background: #131720;
            border: 2px solid #00d9ff;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #00d9ff;
            font-size: 1.5rem;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #39ff14;
        }

        .pulse {
            width: 12px;
            height: 12px;
            background: #39ff14;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #39ff14; }
            50% { opacity: 0.3; box-shadow: 0 0 20px #39ff14; }
        }

        .output-container {
            background: #131720;
            border: 1px solid #2a3447;
            padding: 1.5rem;
            height: calc(100vh - 140px);
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .output-line {
            margin-bottom: 0.25rem;
        }

        .output-line.itp {
            color: #00d9ff;
        }

        .output-line.phase {
            color: #ffb347;
            font-weight: 600;
        }

        .output-line.warning {
            color: #ff4757;
        }

        .output-line.progress {
            color: #39ff14;
        }

        .controls {
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
        }

        button {
            background: #131720;
            border: 1px solid #00d9ff;
            color: #00d9ff;
            padding: 0.5rem 1rem;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #00d9ff;
            color: #0a0e1a;
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.5);
        }

        .update-info {
            font-size: 0.8rem;
            color: #8b95a8;
            text-align: right;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0e1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a3447;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3d4a62;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖥️ Simulation Console Output</h1>
        <div class="live-indicator">
            <div class="pulse"></div>
            <span>LIVE</span>
        </div>
    </div>

    <div class="controls">
        <button onclick="toggleAutoScroll()">Auto-scroll: <span id="scrollStatus">ON</span></button>
        <button onclick="clearOutput()">Clear</button>
        <button onclick="fetchNow()">Refresh Now</button>
        <div style="flex: 1;"></div>
        <div class="update-info" id="updateInfo">Updating...</div>
    </div>

    <div class="output-container" id="output"></div>

    <script>
        let autoScroll = true;
        let lastSize = 0;
        let outputLines = [];
        const updateInterval = 2000; // 2 seconds

        async function fetchOutput() {
            try {
                // Try to read the task output file
                const response = await fetch('/tmp/claude-1002/-home-anko-workspace-lab-BEC-simulation/tasks/baf5095.output');

                if (!response.ok) {
                    // Fallback: try to get it via a simple text file served by the http server
                    throw new Error('Direct file access failed');
                }

                const text = await response.text();
                updateOutput(text);
            } catch (error) {
                // Show error message
                document.getElementById('updateInfo').textContent =
                    'Cannot access output file directly. Please use: tail -f /tmp/claude-1002/-home-anko-workspace-lab-BEC-simulation/tasks/baf5095.output';
            }
        }

        async function fetchOutputViaProxy() {
            try {
                const response = await fetch('simulation_output.txt?t=' + Date.now());
                const text = await response.text();
                updateOutput(text);
            } catch (error) {
                document.getElementById('updateInfo').textContent =
                    'Waiting for data... (' + new Date().toLocaleTimeString() + ')';
            }
        }

        function updateOutput(text) {
            const lines = text.split('\n');
            const outputDiv = document.getElementById('output');

            // Only update if there's new content
            if (lines.length > outputLines.length) {
                outputDiv.innerHTML = '';

                lines.forEach(line => {
                    const div = document.createElement('div');
                    div.className = 'output-line';

                    // Colorize based on content
                    if (line.includes('ITP')) {
                        div.className += ' itp';
                    } else if (line.includes('Phase') || line.includes('phase')) {
                        div.className += ' phase';
                    } else if (line.includes('Warning') || line.includes('⚠️')) {
                        div.className += ' warning';
                    } else if (line.includes('step') || line.includes('%')) {
                        div.className += ' progress';
                    }

                    div.textContent = line;
                    outputDiv.appendChild(div);
                });

                outputLines = lines;

                if (autoScroll) {
                    outputDiv.scrollTop = outputDiv.scrollHeight;
                }

                document.getElementById('updateInfo').textContent =
                    'Last update: ' + new Date().toLocaleTimeString() + ' | Lines: ' + lines.length;
            }
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            document.getElementById('scrollStatus').textContent = autoScroll ? 'ON' : 'OFF';
        }

        function clearOutput() {
            document.getElementById('output').innerHTML = '';
            outputLines = [];
        }

        function fetchNow() {
            fetchOutputViaProxy();
        }

        // Note: Browser security prevents direct file access
        // We need to serve the output file via HTTP

        // Check if we can access via served file
        fetchOutputViaProxy();
        setInterval(fetchOutputViaProxy, updateInterval);

        // Instructions
        setTimeout(() => {
            if (outputLines.length === 0) {
                const outputDiv = document.getElementById('output');
                outputDiv.innerHTML = `
<div style="color: #ffb347; padding: 2rem; text-align: center;">
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

To view real-time simulation output, run this in another terminal:

    tail -f /tmp/claude-1002/-home-anko-workspace-lab-BEC-simulation/tasks/baf5095.output

Or create a symlink to serve the file:

    ln -s /tmp/claude-1002/-home-anko-workspace-lab-BEC-simulation/tasks/baf5095.output \\
          /home/anko/workspace/lab/BEC-simulation/examples/simulation_output.txt

Then refresh this page.

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
</div>`;
            }
        }, 3000);
    </script>
</body>
</html>
