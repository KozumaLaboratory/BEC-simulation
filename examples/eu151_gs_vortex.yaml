# Eu151 vortex ground state: ITP from thermally perturbed polar state.
#
# Starts from the m=0 polar state with thermal fluctuations (T/T_c=0.1,
# η≈1.58%) layered on top, then runs ITP with full DDI + LHY. If DDI
# is strong enough to break symmetry, populations spread to |m|≥1 and
# the ground state develops a magnetic vortex texture.

experiment:
  name: "Eu151 vortex GS (perturbed polar)"
  type: ground_state

  system:
    atom: Eu151
    grid:
      n_points: [32, 32, 32]
      box_size: [12.0, 12.0, 12.0]
    interactions:
      N_atoms: 50000
      omega_ref: 691.15
      c1_ratio: 0.0
      c_lhy: 1135.0
    ddi:
      enabled: true

  ground_state:
    dt: 0.0005
    n_steps: 5000
    tol: 1.0e-8
    initial_state: polar
    temperature_ratio: 0.1        # T/T_c
    noise_seed: 42
    zeeman:
      p: 0.0
      q: 0.0
    potential:
      type: harmonic
      omega: [1.0, 1.0, 1.1818]
    backend: cuda
