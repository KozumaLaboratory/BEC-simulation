# ================================================================
# Eu151 quasi-2D phase diagram
# ================================================================
#
# Reference:
#   Matsui et al., Science 391, 384-388 (2026)
#
# Physics:
#   Ground-state phase diagram of F=6 Eu151 BEC as a function of
#   spin interaction strength c₁/c₀. Uses z-integrated DDI kernel
#   (quasi-2D approximation) for pancake trap geometry.
#
#   Key phases:
#     c₁ < 0:  ferromagnetic (all atoms in m=+6)
#     c₁ = 0:  DDI-dominated (spin texture, EdH instability)
#     c₁ > 0:  antiferromagnetic / nematic ordering
#
# Units: dimensionless (ℏ = m = ω_ref = 1), ω_ref = 2π × 110 Hz
#   See eu151_edh.yaml for full conversion formulae.
# ================================================================

experiment:
  version: 3
  name: "Eu151 phase diagram (quasi-2D)"
  type: phase_scan

  system:
    atom: Eu151
    grid:
      n_points: [64, 64]
      box_size: [12.0, 12.0]
    interactions:
      c_total: 4689.0
      c1_ratio: 0.0
    ddi:
      enabled: true
      c_dd: 7647.0
      quasi_2d: true
      l_z: 0.847  # a_ho_z / a_ho_perp = 1/sqrt(130/110)

  ground_state:
    dt: 0.005
    n_steps: 5000
    tol: 1.0e-8
    initial_state: polar
    zeeman:
      p: 0.39
      q: 0.0
    potential:
      type: harmonic
      omega: [1.0, 1.0]

  scan:
    type: parameter
    axes:
      - parameter: c1_ratio
        values:
          from: -0.01389   # ~ -1/(2F²), strongly ferromagnetic
          to: 0.02778      # 1/36, Buchachenko AFM estimate
          n_points: 15
    continuation:
      enabled: true
      n_steps: 1000
      energy_jump_threshold: 0.1
    per_point_overrides:
      - parameter: c1_ratio
        range: { from: -0.002, to: 0.002 }
        n_steps: 8000
        tol: 1.0e-10

  observables:
    always: [norm, magnetization]
    on_save: [energy]
    final_only: [phase_classification, structure_factor]
