// Color palette: diverging red (m>0) -> gray (m=0) -> blue (m<0)
// Use distinct hues so 13 lines are distinguishable
function mColor(m) {
  if (m > 0) {
    // warm: reds/oranges, intensity scales with |m|
    const hues = {6:'rgb(220,40,40)', 5:'rgb(235,100,35)', 4:'rgb(240,150,30)',
                  3:'rgb(245,190,50)', 2:'rgb(230,210,90)', 1:'rgb(200,200,130)'};
    return hues[m];
  } else if (m < 0) {
    const hues = {1:'rgb(140,190,210)', 2:'rgb(100,180,230)', 3:'rgb(60,160,240)',
                  4:'rgb(40,130,230)', 5:'rgb(35,95,210)', 6:'rgb(40,50,180)'};
    return hues[-m];
  }
  return 'rgb(160,160,160)';
}
