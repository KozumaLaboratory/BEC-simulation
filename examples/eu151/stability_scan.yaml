# Eu151 stability analysis: c1_ratio sweep with post-GS perturbation.
# For each point: find ground state, then perturb-and-evolve to measure
# growth rate and dominant unstable k-mode (roton/EdH instability).

experiment:
  version: 3
  name: "Eu151 stability scan"
  type: phase_scan

  system:
    atom: Eu151
    grid:
      n_points: 32
      box_size: 8.0
    interactions:
      c_total: 4689.0
      c1_ratio: 0.0
    ddi:
      enabled: false

  ground_state:
    dt: 0.005
    n_steps: 3000
    tol: 1.0e-8
    initial_state: polar
    zeeman:
      p: 0.0
      q: 0.0
    potential:
      type: harmonic
      omega: [1.0]

  scan:
    type: parameter
    axes:
      - parameter: c1_ratio
        values:
          from: -0.01389
          to: 0.02778
          n_points: 8
    continuation:
      enabled: true
      n_steps: 1000
      energy_jump_threshold: 0.1

  stability:
    enabled: true
    perturbation: 1.0e-4
    n_steps: 300
    sample_every: 10

  observables:
    always: [norm, magnetization]
    on_save: [energy]
    final_only: [phase_classification, structure_factor]
    spatial_sampling: 0.1

  output:
    dir: results/eu151_stability_scan
    csv: true
    save_psi: false
