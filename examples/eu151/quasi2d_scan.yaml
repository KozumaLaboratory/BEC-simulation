# Eu151 quasi-2D DDI scan.
# Uses z-integrated DDI kernel for ~100x speedup over full 3D.
# Suitable for pancake trap geometries (omega_z >> omega_perp).

experiment:
  version: 3
  name: "Eu151 quasi-2D DDI scan"
  type: phase_scan

  system:
    atom: Eu151
    grid:
      n_points: [64, 64]
      box_size: [12.0, 12.0]
    interactions:
      c_total: 4689.0
      c1_ratio: 0.0
    ddi:
      enabled: true
      c_dd: 7647.0
      quasi_2d: true
      l_z: 0.847          # 1/sqrt(130/110) = a_ho_z / a_ho_perp

  ground_state:
    dt: 0.005
    n_steps: 5000
    tol: 1.0e-8
    initial_state: polar
    zeeman:
      p: 0.39
      q: 0.0
    potential:
      type: harmonic
      omega: [1.0, 1.0]

  scan:
    type: parameter
    axes:
      - parameter: c1_ratio
        values:
          from: -0.01389
          to: 0.02778
          n_points: 10
    continuation:
      enabled: true
      n_steps: 1000
      energy_jump_threshold: 0.1
    per_point_overrides:
      - parameter: c1_ratio
        range: { from: -0.002, to: 0.002 }
        n_steps: 8000
        tol: 1.0e-10

  observables:
    always: [norm, magnetization]
    on_save: [energy]
    final_only: [phase_classification, structure_factor]
    spatial_sampling: 0.05

  output:
    dir: results/eu151_quasi2d_scan
    csv: true
    save_psi: false
