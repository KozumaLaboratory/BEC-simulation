# Eu151 2D phase diagram: c1_ratio x quadratic Zeeman q.
# Uses continuation from neighboring points for efficiency.

experiment:
  version: 3
  name: "Eu151 2D c1_ratio x q"
  type: phase_scan

  system:
    atom: Eu151
    grid:
      n_points: 32
      box_size: 8.0
    interactions:
      c_total: 4689.0
      c1_ratio: 0.0
    ddi:
      enabled: false

  ground_state:
    dt: 0.005
    n_steps: 5000
    tol: 1.0e-8
    initial_state: polar
    zeeman:
      p: 0.39
      q: 0.0
    potential:
      type: harmonic
      omega: [1.0]

  scan:
    type: parameter
    axes:
      - parameter: c1_ratio
        values:
          from: -0.01389
          to: 0.02778
          n_points: 9
      - parameter: zeeman_q
        values:
          from: -0.5
          to: 2.0
          n_points: 9
    continuation:
      enabled: true
      n_steps: 1500
      energy_jump_threshold: 0.1
    per_point_overrides:
      - parameter: c1_ratio
        range: { from: -0.002, to: 0.002 }
        n_steps: 8000
        tol: 1.0e-10

  observables:
    always: [norm, magnetization]
    on_save: [energy]
    final_only: [phase_classification]
    spatial_sampling: 0.1

  output:
    dir: results/eu151_phase_scan_2d
    csv: true
    save_psi: false
