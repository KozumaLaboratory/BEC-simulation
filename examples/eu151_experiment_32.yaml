# ================================================================
# Eu151 Experimental Scenario: m=-6 → m=-5 (32³ Quick Test)
# ================================================================
# Direct reproduction of Matsui et al. Science 2026
#
# Protocol:
#   1. ITP: m=-6 fully polarized at strong negative field (p=-100)
#   2. Quench: field → 0 over ~0.1 ω⁻¹
#   3. Observe: DDI-driven spin relaxation, single vortex formation
#
# Expected observables:
#   - P(m=-6) decreases, P(m=-5) increases
#   - Ring structure in |ψ_{m=-5}|² (vortex)
#   - L_z increases (negative, opposite to ΔS_z)
#   - Clean, deterministic (no random noise)
#
# Grid: 32³ (dx ≈ 0.375 a_ho) - vortex core NOT fully resolved
#       Use for quick validation only
# ================================================================

experiment:
  name: "Eu151 m=-6→m=-5 Experiment (32³ test)"
  type: dynamics

  system:
    atom: Eu151
    grid:
      n_points: [32, 32, 32]
      box_size: [12.0, 12.0, 12.0]
    interactions:
      c_total: 4689.0
      c1_ratio: 0.0  # DDI-only
      c_lhy: 1135.0  # Lima-Pelster with ε_dd=0.544
    ddi:
      enabled: true
      c_dd: 7647.0

  ground_state:
    dt: 0.001
    n_steps: 3000
    tol: 1.0e-8
    initial_state: ferromagnetic_min  # NEW: m=-F=-6
    zeeman:
      p: -100.0  # Strong negative field
      q: 0.0
    potential:
      type: harmonic
      omega: [1.0, 1.0, 1.182]
    enable_ddi: true

  sequence:
    # Fast quench to zero field
    - name: quench
      duration: 0.1
      dt: 0.0005
      save_every: 20
      zeeman:
        p:
          from: -100.0
          to: 0.0
        q: 0.0
      potential:
        type: harmonic
        omega: [1.0, 1.0, 1.182]

    # Spin relaxation dynamics
    - name: relaxation
      duration: 5.0
      dt: 0.001
      save_every: 50
      integrator:
        method: yoshida
      zeeman:
        p: 0.0
        q: 0.0
      potential:
        type: harmonic
        omega: [1.0, 1.0, 1.182]

  observables:
    always: [norm, magnetization]
    on_save: [energy, populations, energy_decomposition]
    spatial_sampling: 1.0  # Save all spatial data

  output:
    dir: "output/eu151_experiment_32"
    csv: true
    save_psi: true  # Save full wavefunction for vortex visualization
