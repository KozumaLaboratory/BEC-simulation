# ================================================================
# Eu151 Experimental Scenario: m=-6 → m=-5 (128³ High Resolution)
# ================================================================
# Full resolution for vortex core and ring structure
#
# Grid: 128³ (dx ≈ 0.156 a_ho < ξ ≈ 0.17 a_ho)
#       Vortex core RESOLVED
#       WARNING: ~4-8 hours on CPU, ~30-60 min on GPU
# ================================================================

experiment:
  name: "Eu151 m=-6→m=-5 Experiment (128³ full resolution)"
  type: dynamics

  system:
    atom: Eu151
    grid:
      n_points: [128, 128, 128]
      box_size: [20.0, 20.0, 20.0]
    interactions:
      c_total: 4689.0
      c1_ratio: 0.0
      c_lhy: 1135.0
    ddi:
      enabled: true
      c_dd: 7647.0

  ground_state:
    dt: 0.0005
    n_steps: 10000
    tol: 1.0e-10
    initial_state: ferromagnetic_min  # m=-6
    zeeman:
      p: -100.0
      q: 0.0
    potential:
      type: harmonic
      omega: [1.0, 1.0, 1.182]
    enable_ddi: true

  sequence:
    # Quench
    - name: quench
      duration: 0.2
      dt: 0.0002
      save_every: 100
      zeeman:
        p:
          from: -100.0
          to: 0.0
        q: 0.0
      potential:
        type: harmonic
        omega: [1.0, 1.0, 1.182]

    # Spin relaxation - observe vortex formation
    - name: relaxation
      duration: 10.0
      dt: 0.0005
      save_every: 200
      integrator:
        method: adaptive
        tol: 1.0e-6
        dt_min: 1.0e-4
        dt_max: 0.002
      zeeman:
        p: 0.0
        q: 0.0
      potential:
        type: harmonic
        omega: [1.0, 1.0, 1.182]

  observables:
    always: [norm, magnetization]
    on_save: [energy, populations, energy_decomposition]
    spatial_sampling: 0.25  # Save 25% of data (still ~100MB)

  output:
    dir: "output/eu151_experiment_128"
    csv: true
    save_psi: true
    checkpoint:
      enabled: true
      interval: 2000
