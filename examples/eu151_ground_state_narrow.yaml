experiment:
  name: "Eu151 ground state (narrower range, c1_ratio=0.001, quasi-2D)"
  type: ground_state

  system:
    atom: Eu151
    grid:
      n_points: [144, 144] # Increased resolution for larger BEC
      box_size: [72, 72]   # Adjusted to fit the larger BEC
    interactions:
      c0: 1.0
      c1: 0.001
    ddi:
      enabled: true
      c_dd: 7647.0
      quasi_2d: true
      l_z: 0.847

  ground_state:
    dt: 0.001 # Keep dt small for stability
    n_steps: 2000 # Increased steps for larger grid and better convergence
    tol: 1.0e-6
    initial_state: polar # Use polar for stable initialization
    potential:
      type: harmonic
      omega: [0.2, 0.2] # Weaker trap for a significantly larger BEC
    zeeman:
      p: 0.0
      q: 0.0

  observables:
    final_only: [psi, energy]
