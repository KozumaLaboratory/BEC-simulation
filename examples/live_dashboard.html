<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Simulation Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e1a;
            --panel: #131720;
            --border: #2a3447;
            --text: #e8edf5;
            --text-dim: #8b95a8;
            --cyan: #00d9ff;
            --green: #39ff14;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 1rem;
        }

        .header {
            background: var(--panel);
            border: 2px solid var(--cyan);
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: var(--cyan);
            font-size: 1.8rem;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        .status {
            display: flex;
            gap: 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .status-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .status-value {
            font-size: 1.2rem;
            color: var(--cyan);
            font-weight: 600;
        }

        .live-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            margin-right: 0.5rem;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .populations {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .section-title {
            font-size: 1rem;
            color: var(--cyan);
            margin-bottom: 1rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .pop-bars {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
            height: 100px;
        }

        .pop-bar {
            flex: 1;
            background: linear-gradient(to top, var(--cyan), transparent);
            position: relative;
            transition: height 0.5s ease;
            border: 1px solid var(--border);
        }

        .pop-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            text-align: center;
            margin-top: 0.25rem;
            color: var(--text-dim);
        }

        .density-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }

        .density-card {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 0.75rem;
        }

        .component-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--cyan);
        }

        .density-canvas {
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            border: 1px solid var(--border);
        }

        .update-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: center;
            margin-top: 1rem;
        }

        .error {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid #ff4757;
            padding: 1rem;
            color: #ff4757;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span class="live-indicator"></span>Live Simulation Monitor</h1>
        <div class="status">
            <div class="status-item">
                <div class="status-label">Step</div>
                <div class="status-value" id="step">--</div>
            </div>
            <div class="status-item">
                <div class="status-label">Time (ω⁻¹)</div>
                <div class="status-value" id="time">--</div>
            </div>
        </div>
    </div>

    <div class="populations">
        <div class="section-title">Spin Populations</div>
        <div class="pop-bars" id="popBars"></div>
    </div>

    <div class="populations">
        <div class="section-title">Density Distribution (z-center slice)</div>
        <div class="density-grid" id="densityGrid"></div>
    </div>

    <div class="update-time" id="updateTime">Waiting for data...</div>

    <script>
        let updateInterval = 3000; // 3 seconds
        let F = 6;

        async function fetchData() {
            try {
                const response = await fetch('live_monitor_data.json?t=' + Date.now());
                const data = await response.json();
                updateDashboard(data);
            } catch (error) {
                document.getElementById('updateTime').innerHTML =
                    '<div class="error">Waiting for simulation data...</div>';
            }
        }

        function updateDashboard(data) {
            // Update status
            document.getElementById('step').textContent = data.step;
            document.getElementById('time').textContent = data.time.toFixed(3);

            // Update populations
            const popBars = document.getElementById('popBars');
            popBars.innerHTML = '';

            const maxPop = Math.max(...data.populations);
            data.populations.forEach((pop, i) => {
                const m = F - i;
                const height = (pop / maxPop) * 100;
                const color = getColorForM(m, F);

                const barContainer = document.createElement('div');
                barContainer.style.flex = '1';
                barContainer.style.display = 'flex';
                barContainer.style.flexDirection = 'column';
                barContainer.style.alignItems = 'center';

                const bar = document.createElement('div');
                bar.className = 'pop-bar';
                bar.style.height = height + '%';
                bar.style.background = `linear-gradient(to top, ${color}, transparent)`;

                const label = document.createElement('div');
                label.className = 'pop-label';
                label.textContent = `m=${m >= 0 ? '+' : ''}${m}`;

                barContainer.appendChild(bar);
                barContainer.appendChild(label);
                popBars.appendChild(barContainer);
            });

            // Update density maps
            const densityGrid = document.getElementById('densityGrid');
            densityGrid.innerHTML = '';

            const [nx, ny] = data.grid_size;
            data.density_slices.forEach((density, i) => {
                const m = F - i;

                const card = document.createElement('div');
                card.className = 'density-card';

                const label = document.createElement('div');
                label.className = 'component-label';
                label.textContent = `m = ${m >= 0 ? '+' : ''}${m}`;

                const canvas = document.createElement('canvas');
                canvas.className = 'density-canvas';
                canvas.width = nx;
                canvas.height = ny;

                drawDensity(canvas, density, nx, ny);

                card.appendChild(label);
                card.appendChild(canvas);
                densityGrid.appendChild(card);
            });

            // Update timestamp
            const timestamp = new Date(data.timestamp);
            document.getElementById('updateTime').textContent =
                `Last update: ${timestamp.toLocaleTimeString()} | Checkpoint: ${data.checkpoint_file}`;
        }

        function getColorForM(m, F) {
            const t = (m + F) / (2 * F);
            if (t < 0.5) {
                const s = t * 2;
                return `rgb(0, ${Math.round(s * 255)}, 255)`;
            } else {
                const s = (t - 0.5) * 2;
                return `rgb(${Math.round(s * 255)}, ${Math.round((1-s) * 255)}, 0)`;
            }
        }

        function drawDensity(canvas, density, nx, ny) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(nx, ny);

            const maxDensity = Math.max(...density.flat());

            for (let i = 0; i < nx; i++) {
                for (let j = 0; j < ny; j++) {
                    const val = density[i][j];
                    const normalized = Math.min(val / maxDensity, 1.0);
                    const color = valueToColor(normalized);
                    const idx = (j * nx + i) * 4;

                    imageData.data[idx] = color[0];
                    imageData.data[idx + 1] = color[1];
                    imageData.data[idx + 2] = color[2];
                    imageData.data[idx + 3] = 255;
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function valueToColor(val) {
            if (val < 0.25) {
                const t = val / 0.25;
                return [0, 0, Math.round(51 + t * 204)];
            } else if (val < 0.5) {
                const t = (val - 0.25) / 0.25;
                return [0, Math.round(t * 255), 255];
            } else if (val < 0.75) {
                const t = (val - 0.5) / 0.25;
                return [Math.round(t * 255), 255, Math.round(255 - t * 255)];
            } else {
                const t = (val - 0.75) / 0.25;
                return [255, Math.round(255 - t * 255), 0];
            }
        }

        // Start monitoring
        fetchData();
        setInterval(fetchData, updateInterval);
    </script>
</body>
</html>
