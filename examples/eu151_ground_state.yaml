experiment:
  version: 3
  name: "Eu151 ground state (c1_ratio=0.001, quasi-2D)"
  type: ground_state

  system:
    atom: Eu151
    grid:
      n_points: [64, 64]
      box_size: [32, 32]
    interactions:
      c0: 1.0
      c1: 0.001
      ddi:
        enabled: true
        c_dd: 7647.0
        quasi_2d: true
        l_z: 0.847
  ground_state:
    dt: 0.01
    n_steps: 1000
    tol: 1.0e-6
    initial_state: uniform
    potential:
      type: harmonic
      omega: [1.0, 1.0]
    zeeman:
      p: 0.0
      q: 0.0

  observables:
    final_only: [psi, energy]
