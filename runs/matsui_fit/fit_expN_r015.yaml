# ============================================================================
# 撤回済み — この arm の前提は誤りです。記録として残しています。
#
# 実験のショット平均 N = 38161 でフィット（3 本）
#
# 理由:
# #   論文は「approximately 5e4 atoms, with a negligible thermal component」と明記。
#   38161 はショットごとの計数値で、しかも撮像経路の損失を含む。
#
# 経緯: https://github.com/KozumaLaboratory/BEC-simulation/issues/299
# 一次情報: docs/validation/matsui_experiment_parameters.md
# ============================================================================

# N = 38161 (the EXPERIMENT's own per-shot mean), c1_ratio = 0.15 — arm 2 of 3.
#
# Every fit so far ran N = 3.5e4, which is THEIR SIMULATION's shipped Ntot. For
# a fit to the EXPERIMENT that is the wrong number: the experiment's Fig. 4B
# shots count 38161 +- 6757 atoms (mean over 227 shots, and unlike the theory
# sheets — constant 49999.9 — the experimental totals really vary, so they are
# counts and not a normalisation).
#
# The 5e4 in the published sheets is a PLOTTING normalisation, not an atom
# number, and it cancels anyway: every comparison in this campaign is on the
# FRACTION N_{m=-6}/total.
#
# From our own measured N-dependence (+0.0248 nT/1000 in the centre,
# +0.0715 nT/1000 in the width), moving 35000 -> 38161 is predicted to make BOTH
# observables WORSE: centre 1.55 -> 1.68 sigma, width 3.33 -> 4.13 sigma. This
# run is to confirm that by measurement rather than by a two-point interpolation
# — the c1_ratio extrapolation earlier in this session was wrong for exactly
# that reason.
#
# N_atoms is patched in all THREE places it can enter (defaults.interactions,
# the ground_state block, and the dynamics block); c1_ratio in both of its two.

metadata:
  suite: matsui_fig4b
  ladder_level: 12
  reference: Matsui_2025_EdH_Zenodo_17303925
  claim_type: C
  target: fit_expN_r015
  grid_n: 32

defaults:
  kind: spinor
  backend: gpu
  interactions: {N_atoms: 38161, omega_ref: 691.1504}

scan:
  zip:
    pipeline.1.B.Bz.to: {from: -1.3e-4, to: 9.0e-5, step: 5.0e-6}   # Gauss; -13 … +9 nT, 0.5 nT step (45 pts)

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [16.0, 16.0, 16.0]}   # dx = 0.5 a_ho; R_TF ≈ 5.1 a_ho
      potential: {type: harmonic, omega: [1.0, 1.0, 1.181818]}
      interactions:
        N_atoms: 38161                       # their shipped Ntot
        omega_ref: 691.1504
        c1_ratio: 0.15   # EXP-N ARM 2/3
      ddi:
        enabled: true
        secular: true            # spin frozen at m=-6 during their ITP (calcDD_3D_pol)
        padded: true
        pad_factor: 2
      lhy: {kind: none}          # their model has no beyond-mean-field term
      B:
        Bz: "0.0104 Gauss"       # 10.4 mG = 1.04 µT, their Bfield_ini
        theta: 0.0
        phi: 0.0
        q: 0.00909116            # 2π·1 Hz / ω_ref — their ZeemanQ = 1.0 Hz
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 4000
      tol: 1.0e-10

  - dynamics:
      duration: 3.4558           # 5 ms × 691.1504
      dt: 0.001                  # their time_step, in the same 1/ω_ref units
      B:
        Bz: {from: 0.0104, to: -2.0e-4, duration: 0.1037}  # 150 µs ≈ 3τ linear stand-in for their exp(-t/50 µs)
        theta: 0.0
        phi: 0.0
        q: 0.00909116
      ddi:
        enabled: true
        secular: false           # full MDDI: the off-diagonal INT1 is what drives EdH
        padded: true
        pad_factor: 2
      interactions:
        N_atoms: 38161                       # explicit, so defaults cannot inject 5e4
        omega_ref: 691.1504
        c1_ratio: 0.15   # EXP-N ARM 2/3
      lhy: {kind: none}
      # NO loss block — their Fig. 2/4 theory curves are loss-free.
      seed_amplitude: 0.0        # their noise_amp is declared and never used; the
                                 # m=-6 → -5 transfer is DRIVEN by DDI, not seeded
      save:
        every: 108               # divides 3456 exactly, so the last sample IS the end
                                 # of the hold — point_001's saved psi cannot be trusted
        psi: false
        precision: f64

  - analyze:
      - energy_decomposition: {}
