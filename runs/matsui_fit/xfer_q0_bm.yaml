# 転送レート — q = 0 の交絡除去 (xfer_q0_bm, B = 1.92 nT, 下側)
#
# 交絡: q は転送レートだけでなく**共鳴位置**を動かす。q/h = 1 Hz は m=-6 -> -5 の
# 間隔を 42.3 Hz のうち 11 Hz 動かす = 共鳴位置 0.68 nT ぶん
# （runs/matsui_fig4b/fig4b_scan_n35k_n32.yaml）。B = 2.6 nT 固定で q を変えた
# xfer_q_zero / xfer_q_high は、レートと離調を同時に動かしている。
# 「q が敏感」は確立したが「転送が速すぎるのは q が違うから」はまだ言えない。
#
# この 2 本は符号を決めずに両側を挟む: q = 0 で B = 1.92 / 3.28 nT。
#
# 実効磁場は **scan の override** `pipeline.1.B.Bz.to` で決まる。pipeline 内の
# インライン `to:` は上書きされて効かない — そちらだけ書き換えると 2.6 nT のまま
# 走る（実際に一度やった）。両方を一致させてある。
#
# 既に測った 4 本（tasks 50-53、m=-6 の rms、基準 0.0926）:
#   r = 1/72 : 0.1408 (+0.048 悪化)   r = 1/9 : 0.1292 (+0.037 悪化)
#     => c1_ratio は両方向で悪化。1/36 は m=-6 について局所最適
#   q = 0    : 0.0726 (-0.020 改善、ただし離調と交絡)
#   q = 10Hz : 0.3105 (+0.218)、転送は基準の 1.4-1.8 倍速い
#
# 判定（起動前に記録）: 2 点のうち良い方の m=-6 rms が
#   0.073 付近（B 固定の q=0 と同等）  => 改善はレートの効果
#   0.093 付近（基準と同等）           => 改善は離調の効果で、q は答えではない
#   0.05 未満                          => q = 0 が正しく、残差の主要因

defaults:
  kind: spinor
  backend: gpu
  interactions: {N_atoms: 35000, omega_ref: 691.1504}

scan:
  zip:
    pipeline.1.B.Bz.to: {from: 1.9200e-05, to: 1.9200e-05, step: 5.0e-6}   # Gauss; 単一点

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [16.0, 16.0, 16.0]}   # dx = 0.5 a_ho; R_TF ≈ 5.1 a_ho
      potential: {type: harmonic, omega: [1.0, 1.0, 1.181818]}
      interactions:
        N_atoms: 35000                       # their shipped Ntot
        omega_ref: 691.1504
        c1_ratio: 0.027777777777777776
      ddi:
        enabled: true
        secular: true            # spin frozen at m=-6 during their ITP (calcDD_3D_pol)
        padded: true
        pad_factor: 2
      lhy: {kind: none}          # their model has no beyond-mean-field term
      B:
        Bz: "0.0104 Gauss"       # 10.4 mG = 1.04 µT, their Bfield_ini
        theta: 0.0
        phi: 0.0
        q: 0.0                   # 彼らの ZeemanQ = 1.0 Hz を物理値 (~0) に置換
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 4000
      tol: 1.0e-10

  - dynamics:
      duration: 27.646016        # 40 ms x 691.1504
      dt: 0.001                  # their time_step, in the same 1/ω_ref units
      B:
        Bz: {from: 0.0104, to: 1.9200e-05, duration: 0.1037}  # 150 µs ≈ 3τ linear stand-in for their exp(-t/50 µs)
        theta: 0.0
        phi: 0.0
        q: 0.0
      ddi:
        enabled: true
        secular: false           # full MDDI: the off-diagonal INT1 is what drives EdH
        padded: true
        pad_factor: 2
      interactions:
        N_atoms: 35000                       # explicit, so defaults cannot inject 5e4
        omega_ref: 691.1504
        c1_ratio: 0.027777777777777776
      lhy: {kind: none}
      # NO loss block — their Fig. 2/4 theory curves are loss-free.
      seed_amplitude: 0.0        # their noise_amp is declared and never used; the
                                 # m=-6 → -5 transfer is DRIVEN by DDI, not seeded
      save:
        every: 100
                                 # of the hold — point_001's saved psi cannot be trusted
        psi: false
        precision: f32

  - analyze:
      - energy_decomposition: {}
