# Fig. 2C の時系列を彼らの条件で再現する — N = 3.5e4, B = 2.6 nT, 40 ms
#
# 既存の 40 ms run は c1 走査の副産物で N = 5e4 / B = +2.5 nT だった。論文 Fig. 2C
# は 2.6 nT・40 ms で、彼らのシミュレーションは実効 N = 3.5e4（同梱コードの Ntot）。
# コード対コードの比較にはこの条件が要る。
#
# 判定（起動前に記録）: Fig. 4B では N = 3.5e4 で彼らの曲線を per-field rms 1.1 %
# で再現した。Fig. 2C でも同程度（各成分の rms < 0.02）なら、我々の再現は時系列
# 全体で確立し、実験との差を我々の側から論じられる。rms が 0.05 を超えるなら
# 条件が揃っていないか、時系列には Fig. 4B に無い依存性がある。
#
# 参考（N = 5e4 / +2.5 nT で測った既存 run のコード対コード差、40 ms 平均）:
#   m=-6 rms 0.109, m=-5 0.065, m=-4 0.107, m=-3 0.049, m=-2 0.107
#
# 著者の主張（本文）は「m <= -5 は実験と合う、m >= -4 は loss-free なので合わない」。
# 実測すると彼らのシミュレーション vs 実験は m=-5 rms 0.053 / m=-3 0.043 に対し
# m=-4 0.129 / m=-2 0.158 で、主張と整合する。ただし m=-6 は rms 0.263 で最悪、
# シミュレーションが 0.24 も転送しすぎており、Fig. 4B の残差と同じ向き。
#
# psi は保存しない（成分個体数の時系列のみ必要）。every=100 で 276 点。

defaults:
  kind: spinor
  backend: gpu
  interactions: {N_atoms: 35000, omega_ref: 691.1504}

scan:
  zip:
    pipeline.1.B.Bz.to: {from: 2.6e-5, to: 2.6e-5, step: 5.0e-6}   # Gauss; -13 … +9 nT, 0.5 nT step (45 pts)

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [16.0, 16.0, 16.0]}   # dx = 0.5 a_ho; R_TF ≈ 5.1 a_ho
      potential: {type: harmonic, omega: [1.0, 1.0, 1.181818]}
      interactions:
        N_atoms: 35000                       # their shipped Ntot
        omega_ref: 691.1504
        c1_ratio: 0.027777777777777776
      ddi:
        enabled: true
        secular: true            # spin frozen at m=-6 during their ITP (calcDD_3D_pol)
        padded: true
        pad_factor: 2
      lhy: {kind: none}          # their model has no beyond-mean-field term
      B:
        Bz: "0.0104 Gauss"       # 10.4 mG = 1.04 µT, their Bfield_ini
        theta: 0.0
        phi: 0.0
        q: 0.00909116            # 2π·1 Hz / ω_ref — their ZeemanQ = 1.0 Hz
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 4000
      tol: 1.0e-10

  - dynamics:
      duration: 27.646016        # 40 ms x 691.1504
      dt: 0.001                  # their time_step, in the same 1/ω_ref units
      B:
        Bz: {from: 0.0104, to: -2.0e-4, duration: 0.1037}  # 150 µs ≈ 3τ linear stand-in for their exp(-t/50 µs)
        theta: 0.0
        phi: 0.0
        q: 0.00909116
      ddi:
        enabled: true
        secular: false           # full MDDI: the off-diagonal INT1 is what drives EdH
        padded: true
        pad_factor: 2
      interactions:
        N_atoms: 35000                       # explicit, so defaults cannot inject 5e4
        omega_ref: 691.1504
        c1_ratio: 0.027777777777777776
      lhy: {kind: none}
      # NO loss block — their Fig. 2/4 theory curves are loss-free.
      seed_amplitude: 0.0        # their noise_amp is declared and never used; the
                                 # m=-6 → -5 transfer is DRIVEN by DDI, not seeded
      save:
        every: 100
                                 # of the hold — point_001's saved psi cannot be trusted
        psi: false
        precision: f32

  - analyze:
      - energy_decomposition: {}
