# ============================================================================
# 撤回済み — この arm の前提は誤りです。記録として残しています。
#
# c1_ratio を dip に対して走査（9 本）
#
# 理由:
# #   c1_ratio が唯一の自由パラメータだと考えていた。論文 Appendix E は c0 = 2*pi*hbar^2*a12/M,
#   c1 = (1/18)*pi*hbar^2*a12/M すなわち 1/36 を空間プロファイルから決めたと述べている。
#   さらに測定の結果、c1 は dip をほとんど動かさない（0 -> 0.30 で中心 0.18 nT）。
#   判別に使えるのはリング本数であり、dip ではない。
#
# 経緯: https://github.com/KozumaLaboratory/BEC-simulation/issues/299
# 一次情報: docs/validation/matsui_experiment_parameters.md
# ============================================================================

# c1_ratio = -0.013888888888888888 — arm 1 of 5, FIT-TO-EXPERIMENT scan.
#
# For 151Eu the seven a_S (S = 0, 2, ... 12) are unknown; only
# c0 + 36 c1 = 4pi (a_s/a_ho) N is fixed. `interaction_params_from_constraint`
# holds that sum for any r = c1/c0, so **r is the one genuinely free parameter**
# in this model. It is singular at r = -1/36 = -0.02778 (c0 -> infinity), so the
# negative arm stays well clear.
#
# The campaign's earlier c1_ratio probe returned a null and was RETRACTED: it
# measured the GROUND-STATE energy, and a polarised m=-F state feels only the
# fixed sum. The dynamics is NOT degenerate — spin mixing is driven by c1
# itself — so this axis has never been measured on the dip.
#
# WHY. Against the experiment (bootstrap over its 8 concatenated scans, matched
# window [-12, +9]):
#
#                     centre [nT]        width [nT]
#   ours N=3.5e4      -2.5100            12.7400
#   Matsui sim        -2.5495            12.7524
#   EXPERIMENT        -3.440 +- 0.599    11.801 +- 0.282
#
# The CENTRE is not a fittable target — the experiment fixes it only to
# +-0.6 nT and both simulations already sit inside 1.6 sigma. The WIDTH is:
# both codes are 3.3 sigma too WIDE by the same 0.94 nT, so it is the model,
# not either implementation.
#
# This scan asks whether r moves the width, and whether width and centre move
# TOGETHER. Together => one parameter cannot satisfy two constraints and the
# residual is not r. Independently => r is measurable from the width and the
# centre becomes a prediction.
#
# c1_ratio is set in BOTH the ground_state and dynamics blocks. The first
# version of these configs patched only the commented one, which would have run
# a ground state at one r under dynamics at another — the same defect that
# voided the N_atoms scan earlier in this campaign.
#
# N is held at 3.5e4 across all five arms: one axis at a time. The experiment's
# own per-shot mean is 38161 +- 6757, a separate handle carrying the campaign's
# unresolved 8-45% counting systematic.

metadata:
  suite: matsui_fig4b
  ladder_level: 12
  reference: Matsui_2025_EdH_Zenodo_17303925
  claim_type: C
  target: fit_c1ratio_m0139
  grid_n: 32

defaults:
  kind: spinor
  backend: gpu
  interactions: {N_atoms: 35000, omega_ref: 691.1504}

scan:
  zip:
    pipeline.1.B.Bz.to: {from: -1.3e-4, to: 9.0e-5, step: 5.0e-6}   # Gauss; -13 … +9 nT, 0.5 nT step (45 pts)

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [16.0, 16.0, 16.0]}   # dx = 0.5 a_ho; R_TF ≈ 5.1 a_ho
      potential: {type: harmonic, omega: [1.0, 1.0, 1.181818]}
      interactions:
        N_atoms: 35000                       # their shipped Ntot
        omega_ref: 691.1504
        c1_ratio: -0.013888888888888888   # FIT ARM 1/5
      ddi:
        enabled: true
        secular: true            # spin frozen at m=-6 during their ITP (calcDD_3D_pol)
        padded: true
        pad_factor: 2
      lhy: {kind: none}          # their model has no beyond-mean-field term
      B:
        Bz: "0.0104 Gauss"       # 10.4 mG = 1.04 µT, their Bfield_ini
        theta: 0.0
        phi: 0.0
        q: 0.00909116            # 2π·1 Hz / ω_ref — their ZeemanQ = 1.0 Hz
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 4000
      tol: 1.0e-10

  - dynamics:
      duration: 3.4558           # 5 ms × 691.1504
      dt: 0.001                  # their time_step, in the same 1/ω_ref units
      B:
        Bz: {from: 0.0104, to: -2.0e-4, duration: 0.1037}  # 150 µs ≈ 3τ linear stand-in for their exp(-t/50 µs)
        theta: 0.0
        phi: 0.0
        q: 0.00909116
      ddi:
        enabled: true
        secular: false           # full MDDI: the off-diagonal INT1 is what drives EdH
        padded: true
        pad_factor: 2
      interactions:
        N_atoms: 35000                       # explicit, so defaults cannot inject 5e4
        omega_ref: 691.1504
        c1_ratio: -0.013888888888888888   # FIT ARM 1/5
      lhy: {kind: none}
      # NO loss block — their Fig. 2/4 theory curves are loss-free.
      seed_amplitude: 0.0        # their noise_amp is declared and never used; the
                                 # m=-6 → -5 transfer is DRIVEN by DDI, not seeded
      save:
        every: 108               # divides 3456 exactly, so the last sample IS the end
                                 # of the hold — point_001's saved psi cannot be trusted
        psi: false
        precision: f64

  - analyze:
      - energy_decomposition: {}
