pipeline:
  - ground_state:
      n_steps: 30
      dt: 0.01
      potential:
        omega:
          - 1.0
          - 1.0
          - 1.0
        type: "harmonic"
      B:
        theta: 0.0
        phi: 0.0
        q: 0.0
        p: 1.0
      gauge_fix: false
      grid:
        box:
          - 4.0
          - 4.0
          - 4.0
        n:
          - 8
          - 8
          - 8
      kind: "rotating_basis"
      init_m_idx: 1
      interactions:
        c1: 0.0
        gamma_lhy: 0.0
        c_dd: 0.0
        c0: 10.0
      init_sigma: 0.5
      F: 1
  - dynamics:
      duration: 0.05
      kind: "rotating_basis"
      B:
        theta: 0.3
        phi:
          rate: 1.0
      epsilon: 0.001
      save:
        every: 1
