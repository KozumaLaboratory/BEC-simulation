pipeline:
  - ground_state:
      init_sigma: 0.5
      dt: 0.01
      potential:
        omega:
          - 1.0
          - 1.0
          - 1.0
        type: "harmonic"
      gauge_fix: false
      grid:
        box:
          - 4.0
          - 4.0
          - 4.0
        n:
          - 8
          - 8
          - 8
      zeeman:
        q: 0.0
        p: 1.0
      kind: "rotating_basis"
      init_m_idx: 1
      B_hat:
        theta: 0.0
        phi: 0.0
      interactions:
        c1: 0.0
        gamma_lhy: 0.0
        c_dd: 0.0
        c0: 10.0
      F: 1
      n_steps: 30
  - dynamics:
      duration: 0.05
      kind: "rotating_basis"
      save_every: 1
      epsilon: 0.001
      B_hat:
        theta: 0.3
        phi:
          rate: 1.0
