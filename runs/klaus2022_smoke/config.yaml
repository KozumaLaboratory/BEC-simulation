pipeline:
  - ground_state:
      initial_state: "ferromagnetic_min"
      tol: 1.0e-6
      B:
        Bz: "1.0e-4 Gauss"
      dt: 0.005
      grid:
        box:
          - 16.0
          - 16.0
          - 6.0
        n:
          - 32
          - 32
          - 16
      atom: "Dy164"
      interactions:
        c1: 0.0
        omega_ref: 314.159
        c0: 300.0
      potential:
        omega:
          - 1.0
          - 1.0
          - 2.6
        type: "harmonic"
      n_steps: 2000
  - dynamics:
      duration: 6.28
      B:
        phi_deg: 0.0
        magnitude: "1.0e-4 Gauss"
        theta_deg:
          to: 35.0
          from: 0.0
      dt: 0.01
      interactions:
        omega_ref: 314.159
      save:
        every: 32
  - analyze:
      - column_density_movie:
          colorscale: "Viridis"
          axis: 3
          output_dir: "runs/klaus2022_smoke/frames"
      - summary_json:
          extras:
            test_kind: "smoke"
            expected_norm_drift_max: 0.001
          path: "runs/klaus2022_smoke/summary.json"
