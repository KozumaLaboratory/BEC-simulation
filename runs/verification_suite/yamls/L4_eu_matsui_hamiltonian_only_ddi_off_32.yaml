# L4 — Eu-151 Matsui Hamiltonian-only DDI OFF (control)
# Companion to L4_eu_matsui_hamiltonian_only_32.yaml.
# DDI off → no spin-to-orbital transfer mechanism → EdH signature should vanish.
# If EdH-like signal appears here, the mechanism is NOT DDI (e.g., spin-mixing
# c1 + initial seed could be producing it), which would invalidate Matsui-style
# claims regardless of K3.
#
# Pass criteria (anko ladder, Level 4 DDI-off control):
#   - Fz(t) ≈ -F throughout (no transfer)
#   - Lz(t) ≈ 0 throughout (no orbital AM generated)
#   - m=-F population stays ≈ 1
#   - peak_density stable (no collapse from DDI; contact + LHY=off only)
#   - Energy decomposition: E_ddi == 0
# This is the mechanism test that PRECEDES K3 discussion.

metadata:
  suite: spinorbec_physics_verification
  ladder_level: 4
  reference: Matsui_Science_2026_DDI_off_control
  expected: no_EdH_signature_without_DDI

defaults:
  kind: spinor
  backend: gpu
  interactions: {N_atoms: 30000, omega_ref: 628.3}

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.0]}
      interactions:
        N_atoms: 30000
        omega_ref: 628.3
        c1_ratio: -0.005
      ddi: {enabled: false}                 # ← ONLY DIFFERENCE FROM L4 DDI-on
      lhy: {kind: none}
      B: {Bz: "-0.01 Gauss", theta: 0.0, phi: 0.0}
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 1500
      tol: 1.0e-9

  - dynamics:
      duration: 6.28
      dt: 0.01
      B:
        Bz: {from: 0.01, to: 2.6e-5, duration: 0.0}
        theta: 0.0
        phi: 0.0
      ddi: {enabled: false}                 # ← ONLY DIFFERENCE
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save:
        every: 50
        psi: true
        precision: f64

  - analyze:
      - phase_classify: {}
      - winding_map: {}
      - energy_decomposition: {}
      - summary_json: {path: "runs/verification_suite/outputs/L4_eu_matsui_hamiltonian_only_ddi_off_32.json"}
