# L7clean — loss-only validation with ITP-skipped uniform IC.
# Variant of L7_loss_only_uniform_K3.yaml: drops the 20-step ITP that
# perturbed the uniform initial state. Uses n_steps=0 so the GS step
# returns the initial uniform state unchanged. K3 loss should then
# match analytic n(t) = n0 / sqrt(1 + 2 K3 n0² t) to high precision
# (limited by dt² Strang-split error + integration discretisation).

defaults:
  kind: spinor
  backend: cpu
  interactions: {N_atoms: 100000, omega_ref: 628.3}

pipeline:
  - ground_state:
      atom: Cr52
      grid: {n: [16, 16, 16], box: [4.0, 4.0, 4.0]}
      potential: {type: none}
      interactions: {N_atoms: 100000, omega_ref: 628.3, c0: 0.0, c1: 0.0}
      ddi: {enabled: false}
      lhy: {kind: none}
      B: {Bz: 0.0}
      gauge_fix: false
      initial_state: uniform
      init_sigma: 1.5
      dt: 0.001
      n_steps: 0                        # ← skip ITP entirely
      tol: 1.0e-12

  - dynamics:
      duration: 1.0
      dt: 0.0005
      B: {Bz: 0.0}
      ddi: {enabled: false}
      interactions: {N_atoms: 100000, omega_ref: 628.3, c0: 0.0, c1: 0.0}
      loss:
        K3_per_m_si: [
          "1.0e-41 m^6/s","1.0e-41 m^6/s","1.0e-41 m^6/s","1.0e-41 m^6/s",
          "1.0e-41 m^6/s","1.0e-41 m^6/s","1.0e-41 m^6/s"
        ]
      save: {every: 50, psi: false, precision: f64}

  - analyze:
      - energy_decomposition: {}
      - summary_json: {path: "runs/verification_suite/outputs/L7clean_loss_only_uniform_K3.json"}
