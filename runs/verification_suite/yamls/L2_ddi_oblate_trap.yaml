# L2 — DDI in oblate trap (pancake, B along symmetry axis = z)
# Companion to L2_ddi_prolate_trap.yaml.
# Oblate trap (ωz large, ωx=ωy small) creates pancake in x-y.
# With B along z (out-of-plane), dipoles are perpendicular to pancake →
# side-by-side configuration → REPULSIVE in plane → GS energy higher than DDI off.
# This is the standard DDI anisotropy test.

metadata:
  suite: spinorbec_physics_verification
  ladder_level: 2
  reference: DDI_anisotropy_oblate_repulsive
  expected: higher_energy_than_DDI_off_for_pancake_perp_to_B

defaults:
  kind: spinor
  backend: gpu

pipeline:
  - ground_state:
      atom: Cr52
      grid: {n: [48, 48, 24], box: [16.0, 16.0, 8.0]}   # pancake in x-y
      potential: {type: harmonic, omega: [0.5, 0.5, 2.0]}   # ωx=ωy=0.5, ωz=2 (oblate)
      interactions: {N_atoms: 10000, omega_ref: 628.3}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      B: {Bz: "0.1 Gauss", theta: 0.0, phi: 0.0}        # B along z (pancake normal)
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 3000
      tol: 1.0e-9

  - analyze:
      - phase_classify: {}
      - energy_decomposition: {}
      - summary_json: {path: "runs/verification_suite/outputs/L2_ddi_oblate_trap.json"}
