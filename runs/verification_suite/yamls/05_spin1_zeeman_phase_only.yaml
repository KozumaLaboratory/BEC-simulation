# 05 — Pure Zeeman phase benchmark
# Physics: with c0=c1=0, no trap and no DDI, diagonal Zeeman terms only rotate phases.
# Expected: populations and total magnetization are exactly constant; no spin transfer.

metadata:
  suite: spinorbec_physics_verification
  reference: diagonal_Zeeman_phase_evolution
  expected: population_invariant

defaults:
  kind: spinor
  backend: gpu

pipeline:
  - ground_state:
      atom: Na23
      grid: {n: [32], box: [16.0]}
      potential: {type: none}
      interactions: {c0: 0.0, c1: 0.0}
      ddi: {enabled: false}
      B: {p: 0.0, q: 0.0}
      initial_state: uniform
      method: itp
      dt: 0.001
      n_steps: 20
      tol: 1.0e-12

  - dynamics:
      duration: 2.0
      dt: 0.001
      B: {p: 2.0, q: 0.4}
      save: {every: 100, psi: true, precision: f64}

  - analyze:
      - phase_classify: {}
      - summary_json: {path: "verify_outputs/05_spin1_zeeman_phase_summary.json"}
