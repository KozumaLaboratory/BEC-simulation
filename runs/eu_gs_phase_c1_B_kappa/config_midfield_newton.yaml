# FINALIZE the mid-field soft/frustrated region with the confirmed convergence
# recipe: ITP → LBFGS → newton_polish (Newton-CG escapes the high-E metastable
# traps LBFGS+pin get stuck in; reaches |∇E|~2e-7). pin is the weak-field tool
# and does nothing here, so it is OFF. 3 seeds (canted-FM / polar / flower)
# compete; min-E = GS. Gate the ordering on the saved grad_norm, NOT conv (which
# false-negatives at |∇E|~2e-7).
#   5 (Bz) × 4 (κ) = 20 points × 3 seeds = 60 solves @ 64³.
metadata: {owner: anko, project: Eu151 GS — mid-field GS via Newton-CG recipe}

units: {B: Gauss}
defaults: {kind: spinor, backend: gpu}
dealias: {enabled: true, k_cut: 10.0, auto_dt: true, dt_safety: 10.0}

pipeline:
  - ground_state:
      atom: Eu151
      interactions: {N_atoms: 50000, omega_ref: 691.1504, c1_ratio: 0.0277777778}
      grid: {n: [64, 64, 64], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.0]}
      method: itp
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      B: {Bz: "0.0 Gauss", theta: 0.0, phi: 0.0}
      dt: 0.002
      n_steps: 6000
      tol: 1.0e-9
  - ground_state:
      method: lbfgs
      m_lbfgs: 20
      newton_polish: true         # escape the frustrated-saddle metastable traps
      n_steps: 2000
      tol: 1.0e-10
  - analyze:
      - phase_classify_distance: {}
      - multipole_order: {}
      - majorana_order: {}
      - energy_decomposition: {}

scan:
  product:
    pipeline.0.B.Bz:
      - "2.5e-5 Gauss"
      - "4.0e-5 Gauss"
      - "4.8e-5 Gauss"
      - "5.5e-5 Gauss"
      - "6.2e-5 Gauss"
    pipeline.0.potential.omega.2: [1.3, 1.6, 1.9, 2.2]
  comparison_runs:
    - {name: mminusF, override: {pipeline.0.initial_state: m_minus_F}}
    - {name: polar,   override: {pipeline.0.initial_state: polar}}
    - {name: flower,  override: {pipeline.0.initial_state: flower}}
