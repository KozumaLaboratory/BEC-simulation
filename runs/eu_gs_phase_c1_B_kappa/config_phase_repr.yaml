# DEEP-CONVERGED phase representatives at physical Eu: finalize the
# polar/flower/FM GS ordering AND produce clean states for the mass-current +
# spin-texture figures. 4 cells spanning the regions × 4 fresh seeds, min-E =
# GS. residual_polish breaks the √eps gradient floor so the near-degenerate
# ordering is trustworthy (gate on saved grad_norm).
#   4 cells × 4 seeds = 16 solves @ 64³.
metadata: {owner: anko, project: Eu151 GS — deep-converged phase representatives}

units: {B: Gauss}
defaults: {kind: spinor, backend: gpu}
dealias: {enabled: true, k_cut: 10.0, auto_dt: true, dt_safety: 10.0}

pipeline:
  - ground_state:
      atom: Eu151
      interactions: {N_atoms: 50000, omega_ref: 691.1504, c1_ratio: 0.0277777778}
      grid: {n: [64, 64, 64], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.0]}
      method: itp
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      B: {Bz: "0.0 Gauss", theta: 0.0, phi: 0.0}
      noise: {seed: 20260724, initial: {thermal: 0.40}}
      dt: 0.002
      n_steps: 6000
      tol: 1.0e-8
  - ground_state:
      method: lbfgs
      m_lbfgs: 20
      residual_polish: true       # break the √eps floor for the fine ordering
      pin: {kind: transverse, epsilon_ramp: [4.0e-3, 2.0e-3, 1.0e-3, 5.0e-4]}
      n_steps: 2000
      tol: 1.0e-9
  - analyze:
      - phase_classify_distance: {}
      - multipole_order: {}
      - majorana_order: {}
      - energy_decomposition: {}

scan:
  zip:
    pipeline.0.B.Bz: ["0.0 Gauss", "2.5e-5 Gauss", "4.8e-5 Gauss", "1.0e-4 Gauss"]
    pipeline.0.potential.omega.2: [1.0, 1.3, 1.6, 1.0]
  comparison_runs:
    - {name: flower, override: {pipeline.0.initial_state: flower}}
    - {name: polar,  override: {pipeline.0.initial_state: polar}}
    - {name: fm,     override: {pipeline.0.initial_state: m_plus_F}}
    - {name: vortex, override: {pipeline.0.initial_state: polar_core_vortex}}
