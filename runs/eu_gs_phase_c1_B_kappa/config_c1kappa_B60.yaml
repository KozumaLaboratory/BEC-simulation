# ─────────────────────────────────────────────────────────────────────
#  ¹⁵¹Eu (F=6) GS phase map — c1 × κ plane at B = 60 µG.
#
#  Same c1 (uncertain, FM→AFM) × κ (cigar→pancake) plane as the B=0/10µG
#  slices, but at a MID field near the known transition band (B_eq≈40–62µG).
#  Here the linear Zeeman already breaks the transverse symmetry, so NO pin
#  is needed — two physical seeds (m_plus_F, polar) + newton_polish suffice;
#  min-E = GS. Together the 3 slices show how the c1/geometry phase map
#  moves with field.
#
#  Axes:  c1_ratio ∈ [−0.024, +0.048]  (13 pts; stays > singularity −1/36)
#         κ = ω_z/ω_r ∈ [0.3, 2.2]     (15 pts; cigar → pancake)
#  Taller z-box [.,.,24] holds the cigar cloud at κ=0.3.
#  195 (c1×κ) tasks × 2 seeds. Post-process → eu_phase_fingerprint → contour.
# ─────────────────────────────────────────────────────────────────────
metadata: {owner: anko, project: Eu151 F=6 GS — c1×κ plane at B=60µG}

units: {B: Gauss}
defaults: {kind: spinor, backend: gpu}
dealias: {enabled: true, k_cut: 5.0, auto_dt: true, dt_safety: 10.0}

pipeline:
  - ground_state:
      atom: Eu151
      interactions: {N_atoms: 50000, omega_ref: 691.1504, c1_ratio: 0.0}
      grid: {n: [32, 32, 64], box: [12.0, 12.0, 24.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.0]}
      method: lbfgs
      m_lbfgs: 20
      newton_polish: true
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      B: {Bz: "6.0e-5 Gauss", theta: 0.0, phi: 0.0}
      n_steps: 1000
      tol: 1.0e-8

  - analyze:
      - phase_classify_distance: {}
      - majorana_order: {}
      - energy_decomposition: {}

scan:
  product:
    pipeline.0.interactions.c1_ratio: {from: -0.024, to: 0.048, n: 13}
    pipeline.0.potential.omega.2:     {from: 0.3,    to: 2.2,   n: 15}
  comparison_runs:
    - {name: stretched, override: {pipeline.0.initial_state: m_plus_F}}
    - {name: polar,     override: {pipeline.0.initial_state: polar}}
