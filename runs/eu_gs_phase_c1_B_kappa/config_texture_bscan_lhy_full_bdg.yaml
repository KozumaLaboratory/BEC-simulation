# ⚠️ DO NOT RUN AS-IS (2026-07-30). Its question cannot be answered in this
# regime: `full_bdg`'s own BdG check reports the mean field dynamically unstable
# at EVERY (Bz, c1, seed) cell here, seed and converged alike, which by the
# code's own statement makes ε_LHY scheme-dependent — and "the closed forms are
# no better". All three escape routes the warning names are closed: q is 15
# orders of magnitude too small at 50-80 µG, c₀/c₁ are Eu's scattering lengths
# rather than knobs, and converging buys only a factor 4-13 (the one genuinely
# converged seed has the LARGEST residual growth rate). Measurements and the
# reopening options: docs/validation/full_bdg_scheme_dependence_eu_f6.md
#
# Three plumbing bugs also had to be fixed before this could even be measured —
# #179 (lbfgs had no spinor_lhy kwarg at all), and both halves of #201 (the
# tabulated table could not reach a GPU kernel; the BdG table was always built
# at zero field). Any output from this config predating those is mean-field.
#
# The LHY-on twin of config_texture_bscan.yaml — same cells, same seeds, the
# ONLY difference is `lhy.kind`. Its job is the A/B: does "PCV wins at 50µG,
# uniform axial from 60µG" survive beyond mean field?
#
# It has to be asked, because the F=6 ground-state phases the competing seeds
# are meant to separate are mean-field DEGENERATE — g₂/g₄/g₈ vanish and it is
# the LHY term that picks one. Every earlier cell in this campaign ran
# `lhy: {kind: none}`, so its phase assignments are provisional by construction.
#
# `full_bdg` and not `scalar`: the scalar LHY is c·n^(3/2), spin-INDEPENDENT, so
# it cannot lift a degeneracy between spinors at all — it would change the
# density and leave the ordering exactly where mean field left it. full_bdg is
# the general-spinor path, gated against the closed forms to ~1e-4 since the UV
# counterterm fix.
#
# CAVEAT to quote with any result from this file: the LHY table is built ONCE in
# make_workspace from the SEED spinor and then held fixed, so the five competing
# seeds are compared under five slightly different functionals. Cross-check the
# winner by rebuilding the table from the CONVERGED state before believing a
# close call (dE ~ 1e-3 in the mean-field run).
metadata: {owner: anko, project: Eu151 texture B-scan — beyond mean field (full_bdg LHY)}
units: {B: Gauss}
defaults: {kind: spinor, backend: gpu}
dealias: {enabled: true, k_cut: 5.0, auto_dt: true, dt_safety: 10.0}
pipeline:
  - ground_state:
      atom: Eu151
      interactions: {N_atoms: 50000, omega_ref: 691.1504, c1_ratio: 0.0}
      grid: {n: [32, 32, 64], box: [12.0, 12.0, 24.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.0]}
      method: lbfgs
      m_lbfgs: 20
      newton_polish: true
      ddi: {enabled: true, secular: false}
      lhy: {kind: full_bdg}
      B: {Bz: "6.0e-5 Gauss", theta: 0.0, phi: 0.0}
      n_steps: 1500
      tol: 1.0e-8
  - analyze:
      - phase_classify_distance: {}
scan:
  product:
    pipeline.0.B.Bz: ["5.0e-5 Gauss", "6.0e-5 Gauss", "7.0e-5 Gauss", "8.0e-5 Gauss"]
    pipeline.0.interactions.c1_ratio: [0.0, 0.018]
  comparison_runs:
    - {name: flower, override: {pipeline.0.initial_state: flower}}
    - {name: csv,    override: {pipeline.0.initial_state: chiral_spin_vortex}}
    - {name: pcv,    override: {pipeline.0.initial_state: polar_core_vortex}}
    - {name: fm,     override: {pipeline.0.initial_state: m_plus_F}}
    - {name: polar,  override: {pipeline.0.initial_state: polar}}
