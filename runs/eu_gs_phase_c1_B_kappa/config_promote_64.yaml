# ─────────────────────────────────────────────────────────────────────
#  STAGE B — 64³ PROMOTION of the (c1 × Bz × κ) Eu F=6 GS phase diagram.
#  Design ladder step (docs/design/eu_phase_diagram_adaptive_mapping.md):
#  which-phase is resolution-robust, so the FULL map is drawn at 64³ (cheap,
#  converged), and only selected headline/boundary/texture cells are later
#  promoted to 128³ (config_promote.yaml). 64³ keeps the whole map ~13 GB,
#  well inside the /gs/fs group quota (128³-all would be ~104 GB).
#
#  Each cell warm-starts from its OWN 32³ recon winner (config_recon result),
#  spectrally upsampled 32³→64³, then a short L-BFGS polish. continuation is
#  OFF (default) ⇒ every cell seeds independently from seed_from — no
#  hysteresis; UGE-array-parallel over the 120 points.
#
#  Scan: 3 (c1) × 8 (Bz) × 5 (κ) = 120 points × 2 seeds = 240 polishes @ 64³.
# ─────────────────────────────────────────────────────────────────────

metadata:
  owner: anko
  project: Eu151 F=6 GS phase diagram — Stage B map (64³, seed+polish)

units: {B: Gauss}
defaults: {kind: spinor, backend: gpu}
dealias: {enabled: true, k_cut: 10.0, auto_dt: true, dt_safety: 10.0}

pipeline:
  - ground_state:
      atom: Eu151
      interactions: {N_atoms: 50000, omega_ref: 691.1504, c1_ratio: 0.0277777778}
      grid: {n: [64, 64, 64], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.0]}
      method: lbfgs
      m_lbfgs: 20
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      B: {Bz: "0.0 Gauss", theta: 0.0, phi: 0.0}
      seed_from: {run: runs/config_recon_335a2216, upsample: true}
      # Symmetry-breaking pin: lift the weak-field soft-manifold Goldstone floor
      # (un-pinned |∇E| floors ~0.05) so LBFGS reaches an isolated minimum, then
      # extrapolate ε→0 for the certified energy. FM (high-Bz) cells are
      # unaffected (ε→0 recovers the unique polarised GS). Both bx and trap pins
      # were validated to the same E0 in prior weak-field Eu work.
      pin:
        kind: transverse
        epsilon_ramp: [4.0e-3, 2.0e-3, 1.0e-3, 5.0e-4]
      n_steps: 800
      tol: 1.0e-7

  - analyze:
      - phase_classify_distance: {}
      - multipole_order: {}
      - majorana_order: {}
      - energy_decomposition: {}

scan:
  product:
    pipeline.0.interactions.c1_ratio:
      - -0.015
      -  0.0
      -  0.0277777778
    pipeline.0.B.Bz:
      - "0.0 Gauss"
      - "2.5e-5 Gauss"
      - "4.0e-5 Gauss"
      - "4.8e-5 Gauss"
      - "5.5e-5 Gauss"
      - "6.2e-5 Gauss"
      - "7.5e-5 Gauss"
      - "1.0e-4 Gauss"
    pipeline.0.potential.omega.2:
      from: 1.0
      to:   2.2
      n:    5
  comparison_runs:
    - name: stretched
      override: {pipeline.0.initial_state: m_plus_F}
    - name: polar
      override: {pipeline.0.initial_state: polar}
