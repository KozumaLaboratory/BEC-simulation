# COARSE local preview of the c1×κ plane at B=60µG (while TSUBAME drains).
# 5 c1 × 4 κ, small grid, single polar seed + pin. NOT the production map —
# a fast first picture of the FM/AFM × cigar/pancake phase structure.
metadata: {owner: anko, project: Eu151 GS — c1×κ B=60µG local preview}

units: {B: Gauss}
defaults: {kind: spinor, backend: gpu}
dealias: {enabled: true, k_cut: 5.0, auto_dt: true, dt_safety: 10.0}

pipeline:
  - ground_state:
      atom: Eu151
      interactions: {N_atoms: 50000, omega_ref: 691.1504, c1_ratio: 0.0}
      grid: {n: [24, 24, 40], box: [10.0, 10.0, 17.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.0]}
      method: lbfgs
      m_lbfgs: 20
      newton_polish: true
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      B: {Bz: "6.0e-5 Gauss", theta: 0.0, phi: 0.0}
      n_steps: 350
      tol: 1.0e-7

  - analyze:
      - phase_classify_distance: {}
      - majorana_order: {}
      - energy_decomposition: {}

scan:
  product:
    pipeline.0.interactions.c1_ratio: {from: -0.024, to: 0.048, n: 5}
    pipeline.0.potential.omega.2:     {from: 0.3,    to: 2.2,   n: 4}
  comparison_runs:
    - {name: stretched, override: {pipeline.0.initial_state: m_plus_F}}
    - {name: polar,     override: {pipeline.0.initial_state: polar}}
