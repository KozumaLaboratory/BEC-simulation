# single-cell stability probe: FM stretched seed, the failing corner.
units: {B: Gauss}
defaults: {kind: spinor, backend: gpu}
dealias: {enabled: true, k_cut: 5.0, auto_dt: true, dt_safety: 10.0}
pipeline:
  - ground_state:
      atom: Eu151
      interactions: {N_atoms: 50000, omega_ref: 691.1504, c1_ratio: -0.015}
      grid: {n: [32, 32, 32], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.0]}
      method: itp
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      B: {Bz: "0.0 Gauss", theta: 0.0, phi: 0.0}
      initial_state: m_plus_F
      dt: 0.002
      n_steps: 200
      tol: 1.0e-7
  - analyze:
      - phase_classify_distance: {}
      - multipole_order: {}
      - majorana_order: {}
      - energy_decomposition: {}
