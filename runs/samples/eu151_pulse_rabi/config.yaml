# Sample: Eu151 Rabi oscillation via pulse_sequence DSL.
# Demonstrates the timed pulse_sequence apply hook in dynamics.
pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [16, 16], box: [8.0, 8.0]}
      interactions: {c_total: 100.0, c1_ratio: 0.0}
      ddi: {enabled: false}
      zeeman: {p: 0.0, q: 0.0}
      potential: {type: harmonic, omega: [1.0, 1.0]}
      dt: 0.01
      n_steps: 2000
      tol: 1.0e-6
      initial_state: ferromagnetic_min        # m=−F start

  - dynamics:
      duration: 4.0
      dt: 0.01
      save_every: 50
      pulse_sequence:
        # 1 ω_ref^-1 Gaussian pulse of transverse Bx (Rabi flop a few sub-levels)
        - {t: 0.5, apply: zeeman, bx: {gaussian_pulse: {amplitude: 1.0, t_center: 1.0, sigma: 0.2}}}
        - {t: 2.0, apply: zeeman, bx: 0.0}    # turn off

  - analyze:
      - phase_classify: {}
      - synthetic_dim: {}                     # population shift across m sites
      - summary_json: {path: runs/samples/eu151_pulse_rabi/summary.json}
