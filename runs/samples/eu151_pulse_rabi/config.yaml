pipeline:
  - ground_state:
      n_steps: 2000
      B:
        q: 0.0
        p: 0.0
      tol: 1.0e-6
      ddi:
        enabled: false
      dt: 0.01
      atom: "Eu151"
      potential:
        omega:
          - 1.0
          - 1.0
        type: "harmonic"
      initial_state: "ferromagnetic_min"
      grid:
        box:
          - 8.0
          - 8.0
        n:
          - 16
          - 16
      interactions:
        c1_ratio: 0.0
        c_total: 100.0
  - dynamics:
      duration: 4.0
      pulse_sequence:
        - t: 0.5
          apply: "zeeman"
          bx:
            gaussian_pulse:
              sigma: 0.2
              t_center: 1.0
              amplitude: 1.0
        - t: 2.0
          apply: "zeeman"
          bx: 0.0
      dt: 0.01
      save:
        every: 50
  - analyze:
      - phase_classify: {}
      - synthetic_dim: {}
      - summary_json:
          path: "runs/samples/eu151_pulse_rabi/summary.json"
