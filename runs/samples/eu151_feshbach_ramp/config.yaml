# Sample: Eu151 a_s ramp via Feshbach resonance using time-dep c0.
# Demonstrates dynamics.interactions.c0 as a Dict (linear ramp form).
pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [12.0, 12.0, 12.0]}
      interactions: {N_atoms: 30000, omega_ref: 691.15, c1_ratio: 0.028}
      ddi: {enabled: true}
      zeeman: {p: 0.5, q: 0.1}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.1818]}
      dt: 0.005
      n_steps: 5000
      tol: 1.0e-7
      initial_state: polar
      backend: cuda

  # Feshbach ramp: c0 doubles over 10 ω_ref^-1 → expect cloud expand/oscillate
  - dynamics:
      duration: 10.0
      dt: 0.005
      save_every: 50
      interactions:
        omega_ref: 691.15
        c0: {from: 1500.0, to: 3000.0}
        c1: 70.0
      zeeman: {p: 0.5, q: 0.1}

  - analyze:
      - phase_classify: {}
      - droplet_profile: {}
      - summary_json: {path: runs/samples/eu151_feshbach_ramp/summary.json}
