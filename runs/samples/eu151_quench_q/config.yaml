pipeline:
  - ground_state:
      dt: 0.005
      atom: "Eu151"
      potential:
        omega:
          - 1.0
          - 1.0
          - 1.1818
        type: "harmonic"
      backend: "cuda"
      B:
        q: 1.5
        p: 0.5
      initial_state: "polar"
      tol: 1.0e-7
      ddi:
        enabled: true
      grid:
        box:
          - 12.0
          - 12.0
          - 8.0
        n:
          - 32
          - 32
          - 24
      interactions:
        omega_ref: 691.15
        c1_ratio: 0.028
        N_atoms: 30000
      n_steps: 4000
  - dynamics:
      duration: 30.0
      B:
        q:
          to: -0.5
          from: 1.5
        p: 0.5
      save_every: 100
      temperature_ratio: 0.05
      dt: 0.01
  - dynamics:
      duration: 5.0
      B:
        q: -0.5
        p: 0.5
      save_every: 100
      dt: 0.01
  - analyze:
      - phase_classify: {}
      - defect_density:
          defect_type: "vortex"
          threshold: 0.1
      - kibble_zurek_stats:
          threshold: 0.1
      - summary_json:
          path: "runs/samples/eu151_quench_q/summary.json"
