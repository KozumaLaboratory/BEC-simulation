# Eu151 ground-state phase diagram via LBFGS polish + 2D scan.
#
# Use case: find GS at each (c1_ratio, q_factor) point with high precision,
# then classify the phase (FM / AFM / polar / cyclic / nematic / ...).
# 11×11 = 121 points, ~30 sec each on GPU = ~1 hour.

units: {B: Gauss, t: ms}
auto_grid: true                              # TF radius pickup

defaults: {kind: spinor, backend: gpu}        # plain spinor (not rotating_basis)

mixins:
  eu151_phys:
    atom: Eu151
    N_atoms: 60000
    omega_ref: 314.159
    potential: {type: harmonic, omega: ["50 Hz", "50 Hz", "130 Hz"]}
    init_m_idx: 1
    gauge_fix: false

pipeline:
  - ground_state:
      use: [eu151_phys]
      B: {Bz: "0.1 Gauss"}                  # weak bias for symmetry breaking
      interactions: {c1_ratio: 0.0}          # ← scanned
      method: lbfgs                          # high-precision (twice the FLOPs of ITP)
      n_steps: 500                           # generous cap
      tol: 1.0e-9                            # tighter than ITP default (1e-7)
      m_lbfgs: 10                            # history length for L-BFGS

  - analyze:
      - phase_classify: {}                   # FM / AFM / polar / cyclic / nematic
      - bogoliubov: {k_max: 8.0, n_k: 32}    # excitation spectrum gap
      - summary_json: {path: "summary.json"}

# 2D scan: c1_ratio × q_factor (factor on the auto-derived q)
scan:
  product:
    pipeline.0.ground_state.interactions.c1_ratio:
      from: -0.05
      to:   0.05
      n:    11
    pipeline.0.ground_state.B.q_override:
      from: -50.0
      to:    50.0
      n:    11
  comparison_runs:
    - name: stretched
      override: {pipeline.0.ground_state.init_m_idx: 1}
    - name: polar
      override: {pipeline.0.ground_state.init_m_idx: 7}
