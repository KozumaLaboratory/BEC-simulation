# Two-component (binary) BEC YAML schema PROPOSAL.
#
# NOT YET wired into the pipeline runner. This file pins down the key
# layout that runs/samples/binary_immiscible/run.jl exercises via the
# Julia API. When `kind: binary` lands in pipeline_runner._run_step,
# this YAML should run unchanged.
#
# Status: scaffold (#51). See docs/two_component_gp_design.md.

pipeline:
  - ground_state:
      kind: binary
      species_A:
        atom: Rb87
        F: 0
      species_B:
        atom: Rb87
        F: 0
      grid: {n: [48, 48], box: [10.0, 10.0]}
      interactions:
        g_AA: 100.0
        g_BB: 100.0
        g_AB: 130.0           # immiscible (g_AB^2 > g_AA·g_BB)
        omega_coupling: 0.0
      potential: {type: harmonic, omega: [1.0, 1.0]}
      dt: 0.005
      n_steps: 1500
      tol: 1.0e-6
      backend: cpu

  - analyze:
      - binary_overlap: {}    # placeholder — needs binary-aware analyzer
      - summary_json: {path: runs/samples/binary_immiscible/summary.json}
