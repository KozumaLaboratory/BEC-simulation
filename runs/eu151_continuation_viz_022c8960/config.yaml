# Eu151 ground state: c_dd continuation (DDI ramp)
#
# Ramps c_dd from 0 → 7647 in discrete steps, using each converged state
# as the initial condition for the next step. This avoids ITP+DDI
# divergence that occurs when starting from a non-polarized state with
# full DDI strength.
#
# At c_dd=0, the base c1_ratio=-0.01 gives a spin-mixing ground state
# that serves as a warm start for finite DDI. auto_rotate_on_mz is off
# since target_Mz is not constrained here.

experiment:
  name: "Eu151 c_dd continuation (visualization)"
  type: phase_scan

  system:
    atom: Eu151
    grid:
      n_points: [32, 32, 32]
      box_size: [12.0, 12.0, 12.0]
    interactions:
      N_atoms: 50000
      omega_ref: 691.15
      c1_ratio: -0.01
    ddi:
      enabled: false          # overridden per point

  ground_state:
    dt: 0.001
    n_steps: 2000
    tol: 1.0e-8
    initial_state: antiferromagnetic
    zeeman:
      p: 0.39                 # B = 2.6 nT dimensionless
      q: 0.0
    potential:
      type: harmonic
      omega: [1.0, 1.0, 1.1818]
    backend: cpu

  scan:
    zip:
      system.ddi.c_dd:     [0.0,    4000.0, 7647.0]
      system.ddi.enabled:  [false,  true,   true]
      ground_state.dt:     [0.001,  0.0005, 0.0005]
    continuation: true

  observables:
    always: [norm, magnetization]
    on_save: [energy, energy_decomposition]
