# D-3: Faraday imaging of quantum vortices in quasi-2D Eu151
#
# Simulates what a vortex looks like under Faraday rotation imaging at
# -320 MHz detuning from the D1 line (~Γ=5MHz for Eu, so Δ/Γ ≈ -64).
#
# The Faraday rotation angle φ(x,y) ∝ ∫F_z n dz / Δ, so phase
# singularities (vortex cores) appear as zeros of φ surrounded by
# sign-changing regions.

pipeline:
  - ground_state:
      cache: runs/shared/eu151_128x2_box16_c1r-0.01_ddi7647_q2d_lz0.9206_fm.jld2
      atom: Eu151
      grid: {n: [128, 128], box: [16.0, 16.0]}
      interactions:
        N_atoms: 50000
        omega_ref: 691.15
        c1_ratio: -0.01
      ddi: {enabled: true, c_dd: 7647.0, quasi_2d: true, l_z: 0.9206}
      zeeman: {p: 0.0, q: 0.0}
      potential: {type: harmonic, omega: [1.0, 1.0]}
      dt: 0.0005
      n_steps: 100000
      tol: 1.0e-8
      initial_state: ferromagnetic
      backend: cuda

  - analyze:
      - faraday:
          probe_axis: 2           # propagation along y (vertical)
          detuning: -64.0         # Δ/Γ ≈ -320MHz / 5MHz
          polarization: linear_x
