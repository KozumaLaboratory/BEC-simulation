# LHY kind was `icosahedral` until 2026-07-30. `IcosahedralLHY`'s closed form
# is c0^(5/2) + 3|lambda_spin|^(5/2); the absolute value made it symmetric under
# c1 -> -c1 and returned a real energy where the spin-Goldstone branch is
# dynamically unstable. This config runs at c1_ratio < 0, i.e. OUTSIDE that
# domain -- `epsilon_LHY_F6_Ih` now returns NaN and the table build throws.
# `full_bdg` diagonalises the coupled problem with no ansatz and is valid here.
# Gated by test/oracles/test_lhy_config_validity_domain.jl.
# Long-time LHY stability ladder — auto-generated.
# Source: scripts/validation/eu_lhy_longtime_gen.jl
# LHY = full_bdg (was icosahedral), K3 = 0, duration = 62.83 ω_ref⁻¹ ≈ 100ms

metadata:
  suite: eu_lhy_longtime
  ladder_level: 12
  parent_regime: cigar_N30k_omz0p25
  K3_factor: 0
  LHY_kind: full_bdg
  target_ms: 100ms
  generator: scripts/validation/eu_lhy_longtime_gen.jl
  caveat: |
    Tests whether "polar/icosa LHY → stable_arrest with N=1.000"
    survives at simulated time well beyond the original 30 ms window.

defaults:
  kind: spinor
  backend: gpu
  interactions: {N_atoms: 30000, omega_ref: 628.3}

dealias:
  enabled: true
  k_cut: 16.0
  auto_dt: true
  dt_safety: 10.0

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [64, 64, 64], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 0.25]}
      interactions:
        N_atoms: 30000
        omega_ref: 628.3
        c1_ratio: -0.005
      ddi:
        enabled: true
        secular: false
      lhy: {kind: full_bdg}
      B: {Bz: "0.01 Gauss", theta: 0.0, phi: 0.0}
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 2000
      tol: 1.0e-9

  - dynamics:
      duration: 62.83
      dt: 0.005
      B:
        Bz: {from: 0.01, to: 2.6e-5, duration: 0.0}
        theta: 0.0
        phi: 0.0
      ddi:
        secular: false
      lhy: {kind: full_bdg}
      # NO loss block — K3 = 0
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save:
        every: 200
        psi: true
        precision: f64

  - analyze:
      - phase_classify: {}
      - winding_map: {}
      - energy_decomposition: {}
