# ─────────────────────────────────────────────────────────────────────
#  Eu151 Einstein-de Haas (EdH) protocol — Matsui et al. parameters.
#
#  Reference: Matsui et al., Science 391, 384–388 (2026), Fig. 2.
#
#  Field schedule, **as quoted in the paper** (we keep B in Gauss because
#  the YAML normalizer rejects unit-strings inside ramp dicts; numeric
#  Gauss is the codebase default and Bz-strings are accepted for
#  constants):
#
#    Phase 0  GS prep    Bz = 1.0 μT  = 0.01 Gauss   (m = −6 stretched)
#    Phase 1  quench     Bz : 1.0 μT → 2.6 nT        (≈ 0.20 ms, "momentary")
#    Phase 2  weak hold  Bz = 2.6 nT = 2.6e-5 Gauss  (≈ 40 ms, EdH-active)
#
#  Trap (110, 110, 130) Hz with z vertical → ω_ref = 2π · 110 Hz,
#  λ_z = 130/110 = 1.182. N ≈ 5·10⁴ Eu151 atoms, m = −6 initial polarization
#  set by the 1.0 μT bias. After the quench the MDDI dominates Zeeman
#  (Larmor freq ~ 45 Hz at 2.6 nT vs. dipole field ≲ 8 nT) and angular
#  momentum is transferred from the atomic spin (Δ⟨F_z⟩) to the orbital
#  sector (Δ⟨L_z⟩) coherently — total angular momentum is conserved.
# ─────────────────────────────────────────────────────────────────────

defaults:
  kind:         spinor
  backend:      gpu
  interactions: {omega_ref: 691.15}    # seed ω_ref for B→p conversion in every dynamics phase

mixins:
  eu151_edh_phys:
    atom:         Eu151
    grid:         {n: [64, 64, 64], box: [20, 20, 20]}
    potential:    {type: harmonic, omega: [1.0, 1.0, 1.182]}
    interactions: {N_atoms: 50000, omega_ref: 691.15, c1_ratio: 0.0}    # ω_ref = 2π·110 Hz; orbital-only

pipeline:
  # Phase 0: m = −6 stretched ground state in the Matsui prep field B = 1.0 μT.
  - ground_state:
      use:           [eu151_edh_phys]
      B:             {Bz: "0.01 Gauss"}                     # = 1.0 μT  (Matsui prep)
      initial_state: ferromagnetic_min
      n_steps:       100000
      tol:           1.0e-10
      dt:            0.005

  # Phase 1: rapid Zeeman quench  Bz : 1.0 μT → 2.6 nT  in 0.14 ω_ref⁻¹ ≈ 0.20 ms.
  # (Numeric Gauss values: 0.01 → 2.6e-5; ramp dicts cannot carry unit strings.)
  - dynamics:
      duration: 0.14
      dt:       0.0005
      B:        {Bz: {from: 0.01, to: 2.6e-5, duration: 0.14}}
      save:     {every: 280}

  # Phase 2: weak-field hold  Bz = 2.6 nT  for 27.6 ω_ref⁻¹ ≈ 40 ms (Matsui Fig. 2A).
  # TWA (Truncated Wigner) seeds the vacuum so the EdH instability grows
  # from genuine spinor zero-point fluctuations rather than ad-hoc low-k
  # coherent perturbations — matches Matsui et al.'s ensemble protocol.
  - dynamics:
      duration: 27.6
      dt:       0.0001
      B:        {Bz: "2.6e-5 Gauss"}                        # = 2.6 nT  (Matsui weak field)
      noise:
        twa: {n_trajectories: 1, seed_base: 42}    # bump to ~100 for ensemble
      save:     {every: 5000}
