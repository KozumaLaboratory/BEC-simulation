# ================================================================
# Eu151 2D phase map: linear × quadratic Zeeman — 64³ / 12×12
# ================================================================
#
# Higher-resolution replacement of runs/eu151_phase_pq (which was 32³ 5×5).
# Each point: 64³ ITP → LBFGS polish → phase_classify + bogoliubov analyze.
# Resumable: run_yaml writes per-point JLD2; rerun skips cached points.
#
# Target budget: ~10–12 h on one consumer GPU.
# Measured rate (64³, Eu151, DDI): ~40 ITP steps/s → 4 min per point
# (ITP 10000 + analyze) × 144 points ≈ 9.5 h. LBFGS polish was dropped —
# at 64³ it adds ≥5 min/point silently, blowing past the 12 h budget.
# phase_classify + bogoliubov accept ITP-level convergence (tol 1e-7) here.
#
# Physical parameters (same as the 32³ run):
#   N=50000, omega_ref=691.15 Hz → c_total≈4687, c_dd≈211
#   c1_ratio=0.028, c0≈2334, c1≈65.4
#   Pancake trap: (ωx, ωy, ωz) = (1, 1, 1.1818)
#
# p-axis (linear Zeeman): 0 → 300, log-ish from 0 through strong-field.
# q-axis (quadratic Zeeman): symmetric ±3 centred on q_c ~ 0.3.

pipeline:
  - ground_state:
      atom: Eu151
      method: itp
      grid: {n: [64, 64, 64], box: [20.0, 20.0, 20.0]}
      interactions:
        N_atoms: 50000
        omega_ref: 691.15
        c1_ratio: 0.028
      ddi: {enabled: true}
      zeeman: {p: 0.0, q: 0.0}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.1818]}
      dt: 0.005
      n_steps: 10000
      tol: 1.0e-7
      initial_state: polar
      backend: cuda

  - analyze:
      - phase_classify: {}
      - bogoliubov: {k_max: 8.0, n_k: 100, directions: auto, n_directions: 30}

scan:
  product:
    pipeline.0.zeeman.p:
      [0.0, 0.1, 0.3, 1.0, 2.0, 3.0, 5.0, 10.0, 30.0, 100.0, 200.0, 500.0]
    pipeline.0.zeeman.q:
      [-3.0, -1.5, -1.0, -0.5, -0.3, -0.1, 0.0, 0.3, 0.5, 1.0, 1.5, 3.0]
  continuation: false
