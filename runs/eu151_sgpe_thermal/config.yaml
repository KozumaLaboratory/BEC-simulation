scan:
  comparison_runs:
    - name: "seed_a"
      override:
        pipeline.1.noise_seed: 101
    - name: "seed_b"
      override:
        pipeline.1.noise_seed: 202
    - name: "seed_c"
      override:
        pipeline.1.noise_seed: 303
    - name: "seed_d"
      override:
        pipeline.1.noise_seed: 404
  product:
    pipeline.1.temperature_ratio:
      - 0.05
      - 0.1
      - 0.2
  continuation: false
pipeline:
  - ground_state:
      dt: 0.005
      atom: "Eu151"
      potential:
        omega:
          - 1.0
          - 1.0
          - 1.1818
        type: "harmonic"
      backend: gpu
      B:
        q: 0.1
        p: 1.0
      initial_state: "polar"
      tol: 1.0e-7
      ddi:
        enabled: true
      grid:
        box:
          - 16.0
          - 16.0
          - 16.0
        n:
          - 48
          - 48
          - 48
      interactions:
        omega_ref: 691.15
        c1_ratio: 0.028
        N_atoms: 30000
      n_steps: 8000
  - dynamics:
      duration: 10.0
      B:
        q: 0.1
        p: 1.0
      save_every: 200
      temperature_ratio: 0.1
      dt: 0.005
  - analyze:
      - phase_classify: {}
      - defect_density:
          defect_type: "domain_wall"
          threshold: 0.05
      - droplet_profile: {}
      - summary_json:
          extras:
            test_kind: "sgpe_thermal_ensemble"
          path: "runs/eu151_sgpe_thermal/summary.json"
