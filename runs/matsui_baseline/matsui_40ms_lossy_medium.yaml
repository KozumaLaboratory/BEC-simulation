# Matsui 2026 Eu-151 EdH — loss-on variant (medium K3)
# Source: hand-derived from matsui_40ms_dynamics_n64.yaml + eu_k3_sweep_gen.jl loss-block convention.
# Goal: bridge from loss-free EdH cascade to experimental ~40% population decay at 40 ms.
# Differs from matsui_40ms_dynamics_n64.yaml only in the dynamics loss block.
#
# K3 = 30 × Dy proxy = 3.0e-40 m^6/s. Intermediate value; K3 sweep
# (cigar regime) put factor 30 between "delay" and "sacrificial".
# Matsui geometry is near-isotropic so loss strength will be different
# from cigar — this is the medium probe; pair with _strong variant.

metadata:
  suite: matsui_baseline
  variant: loss_on_medium
  ladder_level: 12
  reference: Matsui_2026_Science_arxiv_2504_17357
  target: 40ms_dynamics_lossy_medium
  grid_n: 64
  K3_factor: 30.0
  K3_per_m_si_value: 3.0e-40
  caveat: |
    Phenomenological K3 only — no γ_dr, no LHY. Goal: bracket the
    experimental ~40% atom loss at 40 ms (Matsui Fig 2C population
    integral). Bridge between Matsui's simulation (loss-free) and
    Matsui's experiment (lossy).

defaults:
  kind: spinor
  backend: gpu
  interactions: {N_atoms: 50000, omega_ref: 691.1504}

dealias:
  enabled: true
  k_cut: 16.0
  auto_dt: true
  dt_safety: 10.0

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [64, 64, 64], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.181818]}
      interactions:
        N_atoms: 50000
        omega_ref: 691.1504
        c1_ratio: 0.0277777778
      ddi:
        enabled: true
        secular: true
      lhy: {kind: none}
      B: {Bz: "0.01 Gauss", theta: 0.0, phi: 0.0}
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 2000
      tol: 1.0e-9

  - dynamics:
      duration: 27.646
      dt: 0.005
      B:
        Bz: {from: 0.01, to: 2.6e-5, duration: 0.0}
        theta: 0.0
        phi: 0.0
      ddi:
        secular: false
      lhy: {kind: none}
      loss:
        K3_per_m_si:
          ["3.0e-40 m^6/s", "3.0e-40 m^6/s", "3.0e-40 m^6/s",
           "3.0e-40 m^6/s", "3.0e-40 m^6/s", "3.0e-40 m^6/s",
           "3.0e-40 m^6/s", "3.0e-40 m^6/s", "3.0e-40 m^6/s",
           "3.0e-40 m^6/s", "3.0e-40 m^6/s", "3.0e-40 m^6/s",
           "3.0e-40 m^6/s"]
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save:
        every: 200
        psi: true
        precision: f64

  - analyze:
      - phase_classify: {}
      - winding_map: {}
      - energy_decomposition: {}
