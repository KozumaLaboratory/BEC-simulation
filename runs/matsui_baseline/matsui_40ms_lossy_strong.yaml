# Matsui 2026 Eu-151 EdH — loss-on variant (strong K3)
# Source: hand-derived from matsui_40ms_dynamics_n64.yaml + eu_k3_sweep_gen.jl loss-block convention.
# Goal: upper bracket on the medium K3 probe (factor 100 vs 30).
# K3 = 100 × Dy proxy = 1.0e-39 m^6/s.

defaults:
  kind: spinor
  backend: gpu
  interactions: {N_atoms: 50000, omega_ref: 691.1504}

dealias:
  enabled: true
  k_cut: 16.0
  auto_dt: true
  dt_safety: 10.0

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [64, 64, 64], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.181818]}
      interactions:
        N_atoms: 50000
        omega_ref: 691.1504
        c1_ratio: 0.0277777778
      ddi:
        enabled: true
        secular: true
      lhy: {kind: none}
      B: {Bz: "0.01 Gauss", theta: 0.0, phi: 0.0}
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 2000
      tol: 1.0e-9

  - dynamics:
      duration: 27.646
      dt: 0.005
      B:
        Bz: {from: 0.01, to: 2.6e-5, duration: 0.0}
        theta: 0.0
        phi: 0.0
      ddi:
        secular: false
      lhy: {kind: none}
      loss:
        K3_per_m_si:
          ["1.0e-39 m^6/s", "1.0e-39 m^6/s", "1.0e-39 m^6/s",
           "1.0e-39 m^6/s", "1.0e-39 m^6/s", "1.0e-39 m^6/s",
           "1.0e-39 m^6/s", "1.0e-39 m^6/s", "1.0e-39 m^6/s",
           "1.0e-39 m^6/s", "1.0e-39 m^6/s", "1.0e-39 m^6/s",
           "1.0e-39 m^6/s"]
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save:
        every: 200
        psi: true
        precision: f64

  - analyze:
      - phase_classify: {}
      - winding_map: {}
      - energy_decomposition: {}
