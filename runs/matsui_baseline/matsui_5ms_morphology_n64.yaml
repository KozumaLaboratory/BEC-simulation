# Matsui 2026 Eu-151 EdH baseline — auto-generated.
# Source: scripts/validation/matsui_baseline_gen.jl
# Target: 5ms_morphology  (duration = 3.4558 ω_ref⁻¹)
# Conditions (Matsui simulation, loss-free):
#   N = 50000, m_F = -6, c1/c0 = 1/36
#   trap (ω_x, ω_y, ω_z)/ω_ref = (1, 1, 1.1818)
#   ω_ref = 2π · 110 Hz = 691.15 rad/s
#   B (ground state) = 1 µT;  B (dynamics) = 2.6 nT
#   DDI: secular for GS, full for dynamics

metadata:
  suite: matsui_baseline
  ladder_level: 12
  reference: Matsui_2026_Science_arxiv_2504_17357
  target: 5ms_morphology
  grid_n: 64
  generator: scripts/validation/matsui_baseline_gen.jl

defaults:
  kind: spinor
  backend: gpu
  interactions: {N_atoms: 50000, omega_ref: 691.1504}

dealias:
  enabled: true
  k_cut: 16.0
  auto_dt: true
  dt_safety: 10.0

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [64, 64, 64], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.181818]}
      interactions:
        N_atoms: 50000
        omega_ref: 691.1504
        c1_ratio: 0.0277777778
      ddi:
        enabled: true
        secular: true                            # Matsui: time-averaged for GS
      lhy: {kind: none}
      B: {Bz: "-0.01 Gauss", theta: 0.0, phi: 0.0}   # NEGATIVE → m=-F lowest energy
      gauge_fix: false
      initial_state: m_minus_F                   # Matsui: m_F = -6
      init_sigma: 1.5
      dt: 0.005
      n_steps: 2000
      tol: 1.0e-9

  - dynamics:
      duration: 3.4558
      dt: 0.005
      B:
        Bz: {from: -0.01, to: -2.6e-5, duration: 0.0}   # NEGATIVE throughout
        theta: 0.0
        phi: 0.0
      ddi:
        secular: false                           # Matsui: full MDDI for dynamics
      lhy: {kind: none}                          # Matsui simulation: no LHY
      # NO loss block — Matsui simulation is loss-free
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save:
        every: 50
        psi: true
        precision: f64

  - analyze:
      - phase_classify: {}
      - winding_map: {}
      - energy_decomposition: {}
