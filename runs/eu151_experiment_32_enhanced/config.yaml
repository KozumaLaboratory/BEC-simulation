# ================================================================
# Eu151 Experimental Scenario with Enhanced Monitoring
# ================================================================
# All新機能を有効化:
# - 進捗バー + ASCII plots
# - ログファイル出力
# - リソース監視
# - 異常検知 + 適応的アドバイス
# - 通知システム
# ================================================================

experiment:
  name: "Eu151 m=-6→m=-5 (Enhanced Monitoring)"
  type: dynamics

  system:
    atom: Eu151
    grid:
      n_points: [32, 32, 32]
      box_size: [12.0, 12.0, 12.0]
    interactions:
      c_total: 4689.0
      c1_ratio: 0.0
      c_lhy: 1135.0
    ddi:
      enabled: true
      c_dd: 7647.0

  ground_state:
    dt: 0.001
    n_steps: 3000
    tol: 1.0e-8
    initial_state: ferromagnetic_min
    zeeman:
      p: -100.0
      q: 0.0
    potential:
      type: harmonic
      omega: [1.0, 1.0, 1.182]
    enable_ddi: true

  sequence:
    - name: quench
      duration: 0.1
      dt: 0.0005
      save_every: 20
      zeeman:
        p:
          from: -100.0
          to: 0.0
        q: 0.0
      potential:
        type: harmonic
        omega: [1.0, 1.0, 1.182]

    - name: relaxation
      duration: 5.0
      dt: 0.001
      save_every: 50
      integrator:
        method: yoshida
      zeeman:
        p: 0.0
        q: 0.0
      potential:
        type: harmonic
        omega: [1.0, 1.0, 1.182]

  observables:
    always: [norm, magnetization]
    on_save: [energy, populations, energy_decomposition]
    spatial_sampling: 1.0

  output:
    dir: "output/eu151_experiment_32_enhanced"
    csv: true
    save_psi: true

  # 新機能設定 (将来の拡張用)
