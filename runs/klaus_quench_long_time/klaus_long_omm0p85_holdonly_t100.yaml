# Klaus long-time Ω large scan @ t=100 ω⊥⁻¹.
# Source: scripts/validation/klaus_long_omega_large_gen.jl
#   Ω/ω_⊥ = -0.85  (near centrifugal limit Ω/ω_⊥ = 1)

metadata:
  suite: klaus_long_time
  cell_name: klaus_long_omm0p85_holdonly_t100
  rotation_omega: -0.85
  t_hold_dim: 100.0
  protocol_kind: hold_only_long_time_large_omega
  generator: scripts/validation/klaus_long_omega_large_gen.jl

defaults:
  kind: spinor
  backend: cpu
  interactions: {N_atoms: 10000, omega_ref: 691.1504}

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.181818]}
      interactions:
        N_atoms: 10000
        omega_ref: 691.1504
        c1_ratio: 0.02778
      ddi: {enabled: true, secular: true}
      lhy: {kind: none}
      B: {Bz: "-0.01 Gauss", theta: 0.0, phi: 0.0}
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 3000
      tol: 1.0e-9

  - dynamics:   # rotation_prep (no rotation)
      duration: 6.9115
      dt: 0.005
      rotating_frame_omega: 0.0
      B: {Bz: "-0.01 Gauss", theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save: {every: 200, psi: true, precision: f64}

  - dynamics:   # B_quench
      duration: 0.69115
      dt: 0.001
      rotating_frame_omega: 0.0
      B: {Bz: {from: -0.01, to: -2.6e-5, duration: 0.6911504}, theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      save: {every: 50, psi: true, precision: f64}

  - dynamics:   # long weak-field hold with rotation
      duration: 100.0
      dt: 0.005
      rotating_frame_omega: -0.85
      B: {Bz: "-2.6e-5 Gauss", theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      save: {every: 1000, psi: true, precision: f64}

  - analyze:
      - phase_classify: {}
      - winding_map: {}
      - energy_decomposition: {}
