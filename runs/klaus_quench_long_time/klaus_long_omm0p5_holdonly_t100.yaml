# Klaus long-time branch — Prasad-timescale vortex-nucleation probe.
# Source: scripts/validation/klaus_long_time_vortex_gen.jl
# Reference: Prasad et al. arXiv:1906.08664.
#
# Cell : klaus_long_omm0p5_holdonly_t100
#   Ω/ω_⊥ during hold     : -0.5
#   hold duration         : 100.0 ω_ref⁻¹  ≈ 144.7 ms
#   Prasad references     : t=100 surface, t=350 vortex entry, t=5000 lattice

defaults:
  kind: spinor
  backend: cpu
  interactions: {N_atoms: 10000, omega_ref: 691.1504}

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.181818]}
      interactions:
        N_atoms: 10000
        omega_ref: 691.1504
        c1_ratio: 0.02778
      ddi: {enabled: true, secular: true}
      lhy: {kind: none}
      B: {Bz: "0.01 Gauss", theta: 0.0, phi: 0.0}
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 3000
      tol: 1.0e-9

  - dynamics:   # rotation_prep (no rotation; hold-only protocol)
      duration: 6.9115
      dt: 0.005
      rotating_frame_omega: 0.0
      B: {Bz: "0.01 Gauss", theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save:
        every: 200
        psi: true
        precision: f64

  - dynamics:   # B_quench
      duration: 0.69115
      dt: 0.001
      rotating_frame_omega: 0.0
      B: {Bz: {from: 0.01, to: 2.6e-5, duration: 0.6911504}, theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      save:
        every: 50
        psi: true
        precision: f64

  - dynamics:   # LONG weak-field hold with rotation
      duration: 100.0
      dt: 0.005
      rotating_frame_omega: -0.5
      B: {Bz: "2.6e-5 Gauss", theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      save:
        every: 1000
        psi: true
        precision: f64

  - analyze:
      - phase_classify: {}
      - winding_map: {}
      - energy_decomposition: {}
