# Klaus 2-phase quench — B × Ω 2D robustness map corner (batch 4 B).
# Source: scripts/validation/klaus_quench_batch4_gen.jl
#   Ω/ω_⊥ = -0.7
#   B_final = -5.2000000000000004e-5 G (5.2 nT)
#   keep_rot, m=+F init (anti-aligned), DDI on.
#
# anti-aligned-seed: the EdH cascade only runs from the Zeeman-HIGHEST stretched
#   state. Measured 2026-08-19 (#343): rotation contrast +16.5 % anti-aligned
#   against -0.45 % aligned, and peak P_adj 0.53 against 0.24. This is the
#   standard Einstein-de Haas preparation (Kawaguchi-Saito-Ueda PRL 96, 080405).
#   Authority: docs/campaign/edh_quench_polarisation_decision.md

defaults:
  kind: spinor
  backend: cpu
  interactions: {N_atoms: 10000, omega_ref: 691.1504}

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.181818]}
      interactions:
        N_atoms: 10000
        omega_ref: 691.1504
        c1_ratio: 0.02778
      ddi: {enabled: true, secular: true}
      lhy: {kind: none}
      B: {Bz: "0.01 Gauss", theta: 0.0, phi: 0.0}
      gauge_fix: false
      initial_state: m_plus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 3000
      tol: 1.0e-9

  - dynamics:   # rotation_prep
      duration: 6.9115
      dt: 0.005
      rotating_frame_omega: -0.7
      B: {Bz: "0.01 Gauss", theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save:
        every: 100
        psi: true
        precision: f64

  - dynamics:   # B_quench
      duration: 0.69115
      dt: 0.001
      rotating_frame_omega: -0.7
      B: {Bz: {from: 0.01, to: 5.2000000000000004e-5, duration: 0.6911504}, theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      save:
        every: 50
        psi: true
        precision: f64

  - dynamics:   # weak_field_hold
      duration: 6.9115
      dt: 0.005
      rotating_frame_omega: -0.7
      B: {Bz: "5.2000000000000004e-5 Gauss", theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      save:
        every: 100
        psi: true
        precision: f64

  - analyze:
      - phase_classify: {}
      - winding_map: {}
      - energy_decomposition: {}
