# Klaus Ω refinement around the parabolic-interpolation vertex (Ω*≈0.42).
# Source: scripts/validation/klaus_omega_refine_gen.jl
#   Ω/ω_⊥ = -0.5
#   B_hold = 2.6 nT, matched chirality (m=-F, Ω<0), hold-only,
#   rotation-start delay = 2 ms (the protocol-optimal delay).

metadata:
  suite: klaus_quench_refine
  cell_name: klaus_quench_omm0p5_holdonly_delay2ms_refine
  rotation_omega: -0.5
  protocol_kind: holdonly_delay2ms
  generator: scripts/validation/klaus_omega_refine_gen.jl

defaults:
  kind: spinor
  backend: cpu
  interactions: {N_atoms: 10000, omega_ref: 691.1504}

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.181818]}
      interactions:
        N_atoms: 10000
        omega_ref: 691.1504
        c1_ratio: 0.02778
      ddi: {enabled: true, secular: true}
      lhy: {kind: none}
      B: {Bz: "-0.01 Gauss", theta: 0.0, phi: 0.0}
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 3000
      tol: 1.0e-9

  - dynamics:   # rotation_prep (hold-only: no rotation here)
      duration: 6.9115
      dt: 0.005
      rotating_frame_omega: 0.0
      B: {Bz: "-0.01 Gauss", theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save:
        every: 100
        psi: true
        precision: f64

  - dynamics:   # B_quench
      duration: 0.69115
      dt: 0.001
      rotating_frame_omega: 0.0
      B: {Bz: {from: -0.01, to: -2.6e-5, duration: 0.6911504}, theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      save:
        every: 50
        psi: true
        precision: f64

  - dynamics:   # hold pre-delay (Ω=0, 2 ms)
      duration: 1.3823
      dt: 0.005
      rotating_frame_omega: 0.0
      B: {Bz: "-2.6e-5 Gauss", theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      save:
        every: 50
        psi: true
        precision: f64

  - dynamics:   # hold rotating (Ω = -0.5, 8 ms)
      duration: 5.5292
      dt: 0.005
      rotating_frame_omega: -0.5
      B: {Bz: "-2.6e-5 Gauss", theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      save:
        every: 100
        psi: true
        precision: f64

  - analyze:
      - phase_classify: {}
      - winding_map: {}
      - energy_decomposition: {}
