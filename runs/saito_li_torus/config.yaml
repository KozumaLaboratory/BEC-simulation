# ─────────────────────────────────────────────────────────────────────
#  Saito & Li, "Quantum droplets with magnetic vortices in spinor dipolar
#  Bose-Einstein condensates", arXiv:2402.18885 (2024).
#
#  Validation target: Fig. 1(d) F=6 N=15000 ε_dd=1.3 self-bound torus
#  droplet with magnetic vortex (z-axis symmetry axis).
#
#  Geometry: free space (no trap, B=0), with ω_ref = 2π·110 Hz only as a
#  unit choice (a_ho ≈ 0.78 μm). Box [3, 3, 3] a_ho ≈ 2.4 μm fits the
#  ~1 μm torus with buffer.
#
#  The simulator's default Eu151 has a_s=110 a_0 → ε_dd_phys = 0.54.
#  Saito-Li uses hypothetical smaller a_s for droplet formation; we
#  override c_total ∝ N·a_s to produce ε_dd_phys = 1.3 at N=15000:
#    c_total(N=15000, ε_dd=0.54) ≈ 1406    (natural)
#    c_total target              = 1406 × 0.54/1.3 ≈ 583
#
#  LHY: scalar Lima-Pelster Q5 (matches paper Eq. 1, χ(ε_dd) = Q5).
#  After validation, sister run with :polar_dipolar mode tests the
#  paper-#1 closed form on the same physical setup.
#
#  Initial state: polar_core_vortex (winding=1, axis=z) seeds the
#  magnetic-vortex topology so ITP relaxes to the torus (Fig. 1(d))
#  rather than the cigar (Fig. 3(a)) bistable partner.
# ─────────────────────────────────────────────────────────────────────

defaults:
  kind:    spinor
  backend: gpu

mixins:
  saito_li_droplet:
    atom:      Eu151
    grid:      {n: [64, 64, 64], box: [3, 3, 3]}
    potential: {type: harmonic, omega: [0.01, 0.01, 0.01]}     # ≈ free space, weak cage to keep cloud near origin
    interactions:
      N_atoms:   15000
      omega_ref: 691.15                                         # = 2π·110 Hz, defines a_ho ≈ 0.78 μm
      c1_ratio:  0.0
      c_total:   583                                            # ε_dd_phys ≈ 1.3 (vs 0.54 natural)

pipeline:
  - ground_state:
      use:           [saito_li_droplet]
      interactions:
        N_atoms:   15000
        omega_ref: 691.15
        c1_ratio:  0.0
      ddi:
        c_dd:      152                                          # 2.4× natural (63.3 × 1.3/0.54) → effective ε_dd ≈ 1.3
                                                                # (ε_dd is c_dd/c_total ratio in dimensionless units; the
                                                                # atom-level a_dd/a_s display in "Derived:" line stays at
                                                                # natural 0.54 but the simulation uses overridden c_dd)
      B:             {Bz: 0}
      initial_state: polar_core_vortex
      init_state_params: {init_vortex_charge: 1.0}              # winding=+1 around z (state_dispatch.jl arg name)
      lhy: {kind: scalar}                                       # paper Eq. 1: scalar Lima-Pelster Q5
      n_steps:       8000
      tol:           1.0e-9
      dt:            0.005
