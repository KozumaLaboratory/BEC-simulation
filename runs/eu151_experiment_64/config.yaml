# ================================================================
# Eu151 Experimental Scenario: m=-6 → m=-5 (64³ Balanced)
# ================================================================
# Balanced resolution and speed
#
# Grid: 64³ (dx ≈ 0.31 a_ho ≈ 2×ξ)
#       Vortex PARTIALLY resolved (ring visible, core marginally resolved)
#       ~30-60 min on CPU, ~5-10 min on GPU
# ================================================================

experiment:
  name: "Eu151 m=-6→m=-5 Experiment (64³ balanced)"
  type: dynamics

  system:
    atom: Eu151
    grid:
      n_points: [64, 64, 64]
      box_size: [16.0, 16.0, 16.0]
    interactions:
      c_total: 4689.0
      c1_ratio: 0.0
      c_lhy: 1135.0
    ddi:
      enabled: true
      c_dd: 7647.0

  ground_state:
    dt: 0.0005
    n_steps: 5000
    tol: 1.0e-9
    initial_state: ferromagnetic_min  # m=-6
    zeeman:
      p: -100.0
      q: 0.0
    potential:
      type: harmonic
      omega: [1.0, 1.0, 1.182]
    enable_ddi: true

  sequence:
    - name: quench
      duration: 0.15
      dt: 0.0003
      save_every: 50
      zeeman:
        p:
          from: -100.0
          to: 0.0
        q: 0.0
      potential:
        type: harmonic
        omega: [1.0, 1.0, 1.182]

    - name: relaxation
      duration: 8.0
      dt: 0.0008
      save_every: 100
      integrator:
        method: adaptive
        tol: 1.0e-5
        dt_min: 1.0e-4
        dt_max: 0.003
      zeeman:
        p: 0.0
        q: 0.0
      potential:
        type: harmonic
        omega: [1.0, 1.0, 1.182]

  observables:
    always: [norm, magnetization]
    on_save: [energy, populations, energy_decomposition]
    spatial_sampling: 0.5

  output:
    dir: "output/eu151_experiment_64"
    csv: true
    save_psi: true
    checkpoint:
      enabled: true
      interval: 1000
