# K3=0 LHY model control — auto-generated.
# Source: scripts/validation/eu_k3_lhy_control_gen.jl
# LHY = polar_contact, K3 = 0, γ_dr = 0.
# Compare to eu_k3_lhy/LHY_polar_contact.yaml (same LHY, K3=200) to isolate
# LHY-alone vs LHY+K3 effects.

metadata:
  suite: eu_k3_lhy_control
  ladder_level: 12
  parent_regime: cigar_N30k_omz0p25
  K3_factor: 0
  LHY_kind: polar_contact
  generator: scripts/validation/eu_k3_lhy_control_gen.jl

defaults:
  kind: spinor
  backend: cpu
  interactions: {N_atoms: 30000, omega_ref: 628.3}

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 0.25]}
      interactions:
        N_atoms: 30000
        omega_ref: 628.3
        c1_ratio: -0.005
      ddi:
        enabled: true
        secular: false
      lhy: {kind: polar_contact}
      B: {Bz: "0.01 Gauss", theta: 0.0, phi: 0.0}
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 2000
      tol: 1.0e-9

  - dynamics:
      duration: 20.0
      dt: 0.005
      B:
        Bz: {from: 0.01, to: 2.6e-5, duration: 0.0}
        theta: 0.0
        phi: 0.0
      ddi:
        secular: false
      lhy: {kind: polar_contact}
      # NO loss block — K3 = 0
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save:
        every: 50
        psi: true
        precision: f64

  - analyze:
      - phase_classify: {}
      - winding_map: {}
      - energy_decomposition: {}
