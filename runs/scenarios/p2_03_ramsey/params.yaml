# P2.3 — Ramsey interferometry: π/2 – free precession – π/2
#
# Detection of a small quadratic Zeeman shift via the differential phase
# accumulated between two identical π/2 pulses.

pipeline:
  - ground_state:
      atom: Dy164
      grid: {n: 16, box: 8.0}
      interactions: {c0: 30.0, c1: -0.1, omega_ref: 314.159}
      trap: [1.0, 1.0, 1.0]
      zeeman: {Bz: 1.0e-4}
      initial_state: ferromagnetic_min
      dt: 0.01
      n_steps: 10
      tol: 1.0e-3

  - dynamics:
      duration: 0.6
      dt: 0.002
      interactions: {omega_ref: 314.159}
      zeeman: {q: 0.5}              # static quadratic Zeeman during precession
      pulse_sequence:
        - {t: 0.00, duration: 0.05, apply: raman,
           Omega: 3.1416, delta: 0.0, k_eff: [0.0, 0.0, 0.0]}   # π/2 ≈ Ω·τ/2
        - {t: 0.55, duration: 0.05, apply: raman,
           Omega: 3.1416, delta: 0.0, k_eff: [0.0, 0.0, 0.0]}

  - analyze:
      - component_populations: {}
      - magnetization: {}
