# P3.2 — Polarization-resolved Faraday imaging
#
# Pipeline runs a short dynamics; post-process with
# `faraday_polarization_components(psi, grid, F; params)` in Julia to get
# σ±, linear_x, linear_y channels separately.

pipeline:
  - ground_state:
      atom: Dy164
      grid: {n: 32, box: 10.0}
      interactions: {c0: 40.0, c1: 0.2, omega_ref: 314.159}
      trap: [1.0, 1.0, 1.0]
      zeeman: {Bz: 1.0e-4}
      initial_state: polar
      dt: 0.01
      n_steps: 50
      tol: 1.0e-3

  - dynamics:
      duration: 0.1
      dt: 0.005
      interactions: {omega_ref: 314.159}

  - analyze:
      - faraday: {detuning: -10, axis: 3}
