# P5.5 — Kibble-Zurek defect formation in a quench through criticality
#
# Spin-1 BEC quenched from polar (q > 0) to ferromagnetic (q < 0) by
# linearly ramping q across q = 0. Defects (vortices in m_perp) appear
# at a rate set by the quench rate τ_Q via the Kibble-Zurek mechanism.
# The defect density should scale as τ_Q^(-1/3) for a 2D mean-field
# spin-1 BEC (Damski-Zurek 2006 prediction).

scan:
  product:
    pipeline.0.target_q: [-2.0, -1.0, -0.5, -0.2, -0.1]
    pipeline.0.quench_tau: [0.5, 1.0, 2.0, 5.0]

pipeline:
  - ground_state:
      atom: Rb87
      grid: {n: [64, 64], box: [16.0, 16.0]}
      interactions: {c0: 100.0, c1: -0.5}
      zeeman: {p: 0.0, q: 2.0}             # start polar
      initial_state: polar
      potential: {type: harmonic, omega: [1.0, 1.0]}
      dt: 0.005
      n_steps: 800
      tol: 1.0e-7

  - dynamics:
      duration: 5.0
      dt: 0.005
      save_every: 25
      save_psi_snapshots: true
      zeeman:
        p: 0.0
        q: {from: 2.0, to: 0.0, scale: log}  # linear quench through criticality

  - analyze:
      - vortex_detect: {component: 1, mask: 0.05}
      - defect_density: {component: 1}
      - synthetic_dim: {}
