# P5.1 — Synthetic-dimension ladder observables
#
# Spin-1 BEC under a transverse Zeeman field that Raman-couples adjacent
# m sites. The new `:synthetic_dim` analyzer emits:
#   * pop_per_m, m_mean, m_variance        (occupation profile)
#   * synthetic_currents (length D-1)       (bond flow J_m)
#   * localization_length (IPR)             (Wannier-Stark proxy)
#   * dispersion (k_real × k_synth heatmap) (set dispersion_axis: 1)
#
# The 2D dispersion heatmap is the diagnostic plot for synthetic-axis
# spin-orbit coupling in cold-atom papers (Lin et al. 2024, Stuhl et al. 2015).

pipeline:
  - ground_state:
      atom: Rb87
      grid: {n: [64, 32], box: [16.0, 8.0]}
      interactions:
        c0: 80.0
        c1: -0.4
        omega_ref: 314.159
      zeeman:
        Bx: {from: 0.0, to: 0.5}     # transverse ramp drives spin mixing
        Bz: 0.05
      initial_state: polar
      dt: 0.01
      n_steps: 400
      tol: 1.0e-4

  - analyze:
      - synthetic_dim: {dispersion_axis: 1}
      - column_density: {axis: 2}
      - phase_classify: {}
