# P2.12 — Multi-beam crossed FORT via CompositePotential
#
# Two crossed Gaussian beams (horizontal + vertical FORT in a lab setup)
# summed into a CompositePotential. YAML schema maps `composite:` to the
# builder already wired in helpers_parsers.jl.

pipeline:
  - ground_state:
      atom: Dy164
      grid: {n: 32, box: 12.0}
      interactions: {c0: 50.0, c1: 0.0, omega_ref: 314.159}
      potential:
        composite:
          - {harmonic: [1.0, 0.2, 1.0]}          # weak horizontal trap (y-weak)
          - {harmonic: [0.2, 1.0, 1.0]}          # crossed strong trap (x-weak)
      zeeman: {Bz: 1.0e-4}
      initial_state: polar
      dt: 0.01
      n_steps: 20
      tol: 1.0e-3

  - analyze:
      - magnetization: {}
      - component_populations: {}
