# P4.10 — Independent c_k (higher-rank tensor couplings) scan
#
# Eu151 has 7 pair-channel scattering lengths (S=0,2,4,6,8,10,12). The
# `c_extra` list below c_1 maps to c_2, c_3, c_4, ... exactly. For Eu151
# c_3 is skipped (odd rank); the tensor_cache picks up c_4, c_6, c_8.

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: 16, box: 8.0}
      interactions:
        c0: 0.0          # zeroed when tensor_cache is active
        c1: 0.0
        c_extra: [0.0, 0.0, 5.0, 0.0, 3.0, 0.0, 1.0]
        # index:           c_2   c_3   c_4   c_5   c_6   c_7   c_8
        omega_ref: 314.159
      trap: [1.0, 1.0, 1.0]
      zeeman: {Bz: 1.0e-4}
      initial_state: ferromagnetic_min
      dt: 0.01
      n_steps: 20
      tol: 1.0e-3

  - analyze:
      - component_populations: {}

scan:
  zip:
    pipeline.0.interactions.c_extra:
      - [0.0, 0.0, 1.0, 0.0, 0.5, 0.0, 0.2]
      - [0.0, 0.0, 5.0, 0.0, 3.0, 0.0, 1.0]
      - [0.0, 0.0, 10.0, 0.0, 5.0, 0.0, 2.0]
