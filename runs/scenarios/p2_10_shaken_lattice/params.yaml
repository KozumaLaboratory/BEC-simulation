# P2.10 — Floquet / shaken optical lattice
#
# Standard Floquet engineering: a 1D optical lattice modulated sinusoidally
# at frequency ≫ band gap. Produces renormalised tunneling (Bessel
# J_0 renormalisation). Smoke test only — the interesting physics comes from
# post-processing quasi-energy spectra, which needs a dedicated analyzer.

pipeline:
  - ground_state:
      atom: Dy164
      grid: {n: 32, box: 12.0}
      interactions: {c0: 40.0, c1: 0.0, omega_ref: 314.159}
      # Static lattice depth 8 E_r, recoil at k_lat = 2π/λ
      potential:
        optical_lattice:
          depth: [8.0, 0.0, 0.0]
          period: [0.628, 999.0, 999.0]   # ~10-photon recoils
      zeeman: {Bz: 1.0e-4}
      initial_state: polar
      dt: 0.01
      n_steps: 10
      tol: 1.0e-3

  - dynamics:
      duration: 0.5
      dt: 0.001
      interactions: {omega_ref: 314.159}
      # Note: the shaken-lattice ShakenLatticePotential requires a direct
      # Julia call — it's not yet a top-level YAML key. Smoke test is the
      # baseline static lattice dynamics; Floquet modulation is exercised in
      # test_potentials.jl directly.

  - analyze:
      - magnetization: {}
