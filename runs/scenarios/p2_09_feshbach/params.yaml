# P2.9 — Feshbach ramp through resonance: linear c0(t) ramp
#
# Classical Feshbach scenario: ramp the scattering length from stable
# repulsive (c0=80) to marginal (c0=20) using the YAML `interactions.c0`
# ramp-of-ramp syntax. The full a_s(B) formula (`feshbach_c0_wf(...)`) is
# available from Julia but not yet exposed to YAML — use the linear ramp
# here as the pipeline-native approximation.

pipeline:
  - ground_state:
      atom: Dy164
      grid: {n: 16, box: 8.0}
      interactions: {c0: 80.0, c1: -0.2, omega_ref: 314.159}
      trap: [1.0, 1.0, 1.0]
      zeeman: {Bz: 1.0e-4}
      initial_state: ferromagnetic_min
      dt: 0.01
      n_steps: 10
      tol: 1.0e-3

  - dynamics:
      duration: 0.5
      dt: 0.002
      interactions:
        c0: {from: 80.0, to: 20.0, scale: linear}
        c1: -0.2
        omega_ref: 314.159

  - analyze:
      - magnetization: {}
      - component_populations: {}
