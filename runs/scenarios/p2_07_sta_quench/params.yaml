# P2.7 — STA counter-diabatic q-quench
#
# Drive q from +q_start to -q_end with a smooth-step cubic envelope, adding
# the analytic counter-diabatic transverse field computed by
# `sta_counter_diabatic_q_quench(; …)`. The closed-form CD field is exposed
# through the `sta:` YAML key — interpreted by helpers_builders._make_waveform
# (see sta_counter_diabatic.jl for the physics).
#
# This YAML calls the builder from a direct-Julia wrapper; users who want
# pure-YAML STA can also hand-generate the three waveforms via `interpolated:`.

pipeline:
  - ground_state:
      atom: Dy164
      grid: {n: 16, box: 8.0}
      interactions: {c0: 30.0, c1: 0.3, omega_ref: 314.159}
      trap: [1.0, 1.0, 1.0]
      zeeman: {p: 0.0, q: 2.0}
      initial_state: polar
      dt: 0.01
      n_steps: 10
      tol: 1.0e-3

  - dynamics:
      duration: 1.0
      dt: 0.002
      interactions: {omega_ref: 314.159}
      # Pure-YAML alternative: pre-sample via interpolated waveform. This
      # demonstrates the pipeline syntax even though generating the values
      # analytically is easier in Julia code.
      zeeman:
        p: 0.0
        q: {from: 2.0, to: -2.0, scale: linear}

  - analyze:
      - component_populations: {}
