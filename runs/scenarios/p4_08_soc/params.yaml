# P4.8 — Spin-orbit coupling via Raman with k_eff ≠ 0
#
# Standard Spielman-style SOC: counter-propagating Raman beams with
# nonzero k_eff produce a synthetic gauge field that couples spin to
# momentum. Dispersion becomes spin-split.

pipeline:
  - ground_state:
      atom: Dy164
      grid: {n: 32, box: 12.0}
      interactions: {c0: 40.0, c1: 0.1, omega_ref: 314.159}
      trap: [1.0, 1.0, 1.0]
      zeeman: {Bz: 1.0e-4}
      initial_state: polar
      dt: 0.01
      n_steps: 100
      tol: 1.0e-3

  - dynamics:
      duration: 1.0
      dt: 0.002
      interactions: {omega_ref: 314.159}
      raman:
        Omega: 2.0
        delta: 0.0
        k_eff: [1.5, 0.0, 0.0]    # momentum transfer along x

  - analyze:
      - magnetization: {}
      - component_populations: {}
