# P4.1 — Self-bound dipolar droplet
#
# No external trap; LHY repulsion stabilises the attractive mean-field
# (negative c_0 balanced by +c_lhy). Uses the scalar LHY approximation
# (warns; physical scale is right).

pipeline:
  - ground_state:
      atom: Dy164
      grid: {n: 32, box: 12.0}
      interactions:
        c0: -200.0
        c1: 0.0
        c_lhy: 5.0         # positive LHY — stabilises the droplet
        omega_ref: 314.159
      zeeman: {Bz: 1.0e-4}
      initial_state: polar
      dt: 0.01
      n_steps: 200
      tol: 1.0e-3

  - analyze:
      - column_density: {axis: 3, component: 0}
      - energy_breakdown: {}
