# P2.2 — Rabi oscillation via Raman pulse
#
# Drive a single square Raman pulse to flop between m = +F and m = -F,
# then image the populations. Extracting the oscillation frequency from the
# post-pulse populations gives the effective Rabi coupling.

pipeline:
  - ground_state:
      atom: Dy164
      grid: {n: 16, box: 8.0}
      interactions: {c0: 30.0, c1: -0.1, omega_ref: 314.159}
      trap: [1.0, 1.0, 1.0]
      zeeman: {Bz: 1.0e-4}
      initial_state: ferromagnetic_min
      dt: 0.01
      n_steps: 10
      tol: 1.0e-3

  - dynamics:
      duration: 0.5
      dt: 0.002
      interactions: {omega_ref: 314.159}
      pulse_sequence:
        - {t: 0.05, duration: 0.4, apply: raman,
           Omega: 5.0, delta: 0.0, k_eff: [0.0, 0.0, 0.0]}

  - analyze:
      - component_populations: {}
