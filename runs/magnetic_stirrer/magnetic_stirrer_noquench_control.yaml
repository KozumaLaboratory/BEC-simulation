# Klaus-II magnetic-stirrer protocol — auto-generated.
# Source: scripts/validation/klaus_magnetic_stirrer_gen.jl
#
# Cell : magnetic_stirrer_noquench_control
#   phi rotation rate during hold : Ω/ω_⊥ = 0.5
#   DDI in dynamics               : true
#   B quench applied              : false
#   static B (no rotation)        : false
#   theta tilt during hold        : 0.7854 rad ≈ π/4
#   B magnitude during hold       : 0.01 G

defaults:
  kind: spinor
  backend: cpu
  interactions: {N_atoms: 10000, omega_ref: 691.1504}

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.181818]}
      interactions:
        N_atoms: 10000
        omega_ref: 691.1504
        c1_ratio: 0.02778
      ddi: {enabled: true, secular: true}
      lhy: {kind: none}
      B: {B_mag: "0.01 Gauss", theta: 0.0, phi: 0.0}
      gauge_fix: false
      initial_state: m_plus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 3000
      tol: 1.0e-9

  - dynamics:   # rotation_prep (z-aligned, no rotation)
      duration: 6.9115
      dt: 0.005
      B: {B_mag: "0.01 Gauss", theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save:
        every: 100
        psi: true
        precision: f64

  - dynamics:   # B_quench (magnitude drop, direction still z-aligned)
      duration: 0.69115
      dt: 0.001
      B: {B_mag: "0.01 Gauss", theta: 0.0, phi: 0.0}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      save:
        every: 50
        psi: true
        precision: f64

  - dynamics:   # weak_field_hold WITH rotating B direction (Klaus-II hallmark)
      duration: 6.9115
      dt: 0.005
      B: {B_mag: "0.01 Gauss", theta: 0.7854, phi: {rate: 0.5}}
      ddi: {enabled: true, secular: false}
      lhy: {kind: none}
      save:
        every: 100
        psi: true
        precision: f64

  - analyze:
      - phase_classify: {}
      - winding_map: {}
      - energy_decomposition: {}
