# ================================================================
# Eu151 (Mz, q) scan for constructing the (p, q) phase diagram
# ================================================================
#
# Strategy: E_total(Mz; p, q) = E(Mz; 0, q) - p*Mz is exact,
# so scanning (Mz, q) at p=0 gives the full p-dependence analytically.
#
# Parameters:
#   N=50000, omega_ref=691.15 Hz → c_total≈4687, c_dd≈211
#   c1_ratio=0.028 (Buchachenko et al. antiferromagnetic estimate)
#   Grid: 32³, box=16 (each side ±8 a_ho)
#   Solver: ITP 10000 steps → LBFGS 300 steps
#
# Mz range: 0 to 6 (by symmetry of p=0, Mz and -Mz are equivalent)
# q range: -2, -0.5, 0, 0.5, 2
#
# Expected: 35 points × ~90 sec ≈ 53 min
# ================================================================

pipeline:
  - ground_state:
      atom: Eu151
      method: itp
      grid: {n: [32, 32, 32], box: [16.0, 16.0, 16.0]}
      interactions:
        N_atoms: 50000
        omega_ref: 691.15
        c1_ratio: 0.028
      ddi: {enabled: true}
      zeeman: {p: 0.0, q: 0.0}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.1818]}
      dt: 0.005
      n_steps: 10000
      tol: 1.0e-7
      initial_state: ferromagnetic
      target_magnetization: 6.0

  - ground_state:
      method: lbfgs
      n_steps: 300
      tol: 1.0e-8

  - analyze:
      - phase_classify: {}

scan:
  product:
    pipeline.0.target_magnetization:
      [6.0, 5.0, 4.0, 3.0, 2.0, 1.0, 0.0]
    pipeline.0.zeeman.q:
      [-2.0, -0.5, 0.0, 0.5, 2.0]
  continuation: true
  auto_rotate_on_mz: true
