# Rotating-BASIS magnetostir (the CORRECT tool for a strong rotating field).
# Strong field (adiabatic): spin follows B-hat(t) -> DDI magnetostriction
# elongates the cloud along the magnetization; as B-hat precesses, the
# ELONGATED CLOUD ROTATES rigidly at Omega in the xy-plane, stirring ->
# vortices. Field tilted near in-plane (theta~80deg) so the spinning
# ellipse is clear in the (x,y) column density.
defaults:
  kind: rotating_basis
  backend: gpu
  interactions: {N_atoms: 30000, omega_ref: 628.3}

pipeline:
  # GS: strong field along z, spin polarised m=+F (elongated along z).
  - ground_state:
      atom: Eu151
      grid: {n: [48, 48, 24], box: [12.0, 12.0, 6.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 2.0]}
      interactions: {N_atoms: 30000, omega_ref: 628.3, c1_ratio: -0.005}
      ddi: {enabled: true, secular: true}
      lhy: {kind: none}
      B: {Bz: "0.3 Gauss"}
      init_m_idx: 1
      init_sigma: 1.5
      dt: 0.004
      n_steps: 1500
      tol: 1.0e-9

  # tilt B-hat from z into the plane (theta 0 -> ~80deg) over ~6 w^-1
  - dynamics:
      duration: 6.28
      integrator: yoshida4
      dt: 0.001
      epsilon: 1.0e-6
      B: {theta: {from: 0.0, to: 1.4, duration: 6.28}, phi: {rate: 0.0}}
      save: {every: 200}

  # spin up the precession 0 -> Omega=0.6 over ~8 w^-1
  - dynamics:
      duration: 7.85
      integrator: yoshida4
      dt: 0.001
      epsilon: 1.0e-6
      B: {theta: 1.4, phi: {rate: {from: 0.0, to: 0.6, duration: 7.85}}}
      save: {every: 200}

  # steady precession at Omega=0.6: spinning ellipse + magnetostir vortices
  - dynamics:
      duration: 20.0
      integrator: yoshida4
      dt: 0.001
      epsilon: 1.0e-6
      B: {theta: 1.4, phi: {rate: 0.6}}
      save: {every: 200, psi: true, precision: f32}
