# EdH quench baseline (Matsui-type) — reliable real-vortex test, NO rotation.
#
# m=-F polarized GS -> step-quench Bz strong->weak -> DDI (non-secular)
# drives spin relaxation -> EdH vortices nucleate by angular-momentum
# conservation. This is the KNOWN-WORKING vortex mechanism (Matsui et al.
# Science 2026 reproduced pop-growth here). Purpose: confirm we can make
# REAL vortices (winding = +-1, density holes) before adding rotation.

defaults:
  kind: spinor
  backend: gpu
  interactions: {N_atoms: 30000, omega_ref: 628.3}

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.0]}
      interactions: {N_atoms: 30000, omega_ref: 628.3, c1_ratio: -0.005}
      ddi: {enabled: true, secular: false}
      lhy: {kind: scalar}
      B: {Bz: "0.01 Gauss", theta: 0.0, phi: 0.0}
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 2000
      tol: 1.0e-9

  - dynamics:
      duration: 25.0
      dt: 0.005
      B: {Bz: {from: 0.01, to: 2.6e-5, duration: 0.0}, theta: 0.0, phi: 0.0}
      ddi: {secular: false}
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save: {every: 200, psi: true, precision: f32}
