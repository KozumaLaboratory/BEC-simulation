# Spinning magnetostriction ellipse (lab-frame spinor, moderate field).
# Bx ~ 1e-4 G (omega_L~2.6) >> Omega=0.5 => adiabatic: spin follows the
# rotating field, magnetostriction elongation rotates rigidly => stirring
# => vortices. GPU-fast (p.F.dt << pi). Transverse start.
defaults: {kind: spinor, backend: gpu, interactions: {N_atoms: 30000, omega_ref: 628.3}}
pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [48, 48, 24], box: [12.0, 12.0, 6.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 2.0]}
      interactions: {N_atoms: 30000, omega_ref: 628.3, c1_ratio: -0.005}
      ddi: {enabled: true, secular: false}
      lhy: {kind: scalar}
      B: {Bx: "1.0e-4 Gauss", By: 0.0, Bz: 0.0}
      gauge_fix: false
      initial_state: spin_coherent
      init_state_params: {init_theta: 1.5707963267948966, init_phi: 0.0}
      init_sigma: 1.5
      dt: 0.004
      n_steps: 2000
      tol: 1.0e-9
  - dynamics:
      duration: 25.0
      dt: 0.0006
      ddi: {secular: false}
      B:
        Bz: 0.0
        Bx: {sinusoidal: {amplitude: 1.0e-4, frequency: 0.0795775, phase: 1.5707963267948966}}
        By: {sinusoidal: {amplitude: 1.0e-4, frequency: 0.0795775, phase: 0.0}}
      save: {every: 200, psi: true, precision: f32}
