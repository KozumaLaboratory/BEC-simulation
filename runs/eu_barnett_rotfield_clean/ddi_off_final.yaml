# DDI-OFF control: transverse Jz=0 start + rotating field at Omega=+0.5,
# but DDI disabled. Isolates FORCED LARMOR PRECESSION (single-particle):
# expect <F_z> oscillates but |F| stays ~6, <L_z>=0, no vortices.
# Compare to the DDI-ON run (transv_O+0.50) where |F| shrinks + vortices.
defaults: {kind: spinor, backend: gpu, interactions: {N_atoms: 30000, omega_ref: 628.3}}
pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [18.0, 18.0, 18.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.0]}
      interactions: {N_atoms: 30000, omega_ref: 628.3, c1_ratio: -0.005}
      ddi: {enabled: false}
      lhy: {kind: none}
      B: {Bx: "-0.01 Gauss", By: 0.0, Bz: 0.0}
      gauge_fix: false
      initial_state: spin_coherent
      init_state_params: {init_theta: 1.5707963267948966, init_phi: 0.0}
      init_sigma: 1.5
      dt: 0.005
      n_steps: 5000
      tol: 1.0e-9
  - dynamics:
      duration: 0.20
      dt: 0.0005
      ddi: {enabled: false}
      B: {Bx: {from: 0.01, to: 2.13e-5, duration: 0.20}, By: 0.0, Bz: 0.0}
      save: {every: 400}
  - dynamics:
      duration: 25.0
      dt: 0.001
      ddi: {enabled: false}
      B:
        Bz: 0.0
        Bx: {sinusoidal: {amplitude: 2.13e-5, frequency: 0.0795775, phase: 1.5707963267948966}}
        By: {sinusoidal: {amplitude: 2.13e-5, frequency: 0.0795775, phase: 0.0}}
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save: {every: 500, psi: true, precision: f32}
