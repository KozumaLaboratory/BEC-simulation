# SMOKE test — pipeline validation only (tiny grid / few steps).
# Goal: confirm lab-frame spinor + full DDI + rotating Cartesian B runs,
# saves psi snapshots, and Lz/Fz are computable offline from snapshots.
# F=1 effective Eu (Eu151_f1_effective, 3 components) for speed.

defaults:
  kind:    spinor
  backend: cpu
  interactions: {N_atoms: 10000, omega_ref: 691.15}

mixins:
  eu_f1:
    atom: Eu151_f1_effective
    grid: {n: [16, 16, 8], box: [16, 16, 8]}
    potential: {type: harmonic, omega: [1.0, 1.0, 2.0]}
    interactions: {N_atoms: 10000, omega_ref: 691.15}

pipeline:
  # Phase 0: m=+F stretched GS at strong prep Bz.
  - ground_state:
      use:           [eu_f1]
      B:             {Bz: "0.01 Gauss", q: 0.0}
      ddi:           {enabled: true}
      lhy:           {kind: scalar}
      initial_state: m_plus_F
      n_steps:       60
      tol:           1.0e-7
      dt:            0.005

  # Phase 1: quench Bz strong -> weak (z-component of tilted weak field).
  - dynamics:
      duration: 0.14
      dt:       0.001
      ddi:      {enabled: true}
      lhy:      {kind: scalar}
      B:        {Bz: {from: 0.01, to: 2.13e-5, duration: 0.14}, q: 0.0}
      save:     {every: 70}

  # Phase 2: weak Bz + rotating transverse B (35 deg tilt), NO loss.
  #   Bx = amp cos(Omega t) ; By = amp sin(Omega t) ; Omega = 2*pi*freq
  - dynamics:
      duration: 1.0
      dt:       0.001
      ddi:      {enabled: true}
      lhy:      {kind: scalar}
      B:
        Bz: "2.13e-5 Gauss"
        Bx: {sinusoidal: {amplitude: 1.49e-5, frequency: 0.0795775, phase: 1.5707963267948966}}
        By: {sinusoidal: {amplitude: 1.49e-5, frequency: 0.0795775, phase: 0.0}}
        q: 0.0
      save:     {every: 100, psi: true, precision: f64}
