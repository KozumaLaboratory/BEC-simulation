pipeline:
  - ground_state:
      dt: 0.005
      atom: "Eu151"
      potential:
        omega:
          - 1.0
          - 1.0
        type: "harmonic"
      backend: "cuda"
      B:
        q: 0.0
        p: 100.0
      initial_state: "ferromagnetic_min"
      tol: 1.0e-9
      ddi:
        quasi_2d: true
        l_z: 0.4
        enabled: true
      grid:
        box:
          - 16.0
          - 16.0
        n:
          - 64
          - 64
      interactions:
        omega_ref: 691.15
        c1_ratio: 0.0
        N_atoms: 50000
        c_total: 4500
      n_steps: 30000
  - dynamics:
      duration: 5.0
      B:
        q: 0.0
        p: 100.0
      save_every: 500
      seed_k_cut: 2.0
      noise_seed: 7
      live_monitor:
        every: 200
      dt: 0.001
      seed_amplitude: 1.0e-5
      save_psi_snapshots: true
  - analyze:
      - rosensweig_pattern:
          n_radial_bins: 32
          n_angular: 64
      - phase_classify: {}
      - summary_json:
          path: "summary.json"
