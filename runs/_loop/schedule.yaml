# Loop scheduler config — anko's availability windows + per-window policy.
#
# 2026-05-16 update (anko): 22:00 hard rail was for yesterday only. Today
# (2026-05-16) onwards the loop is PROBE_DRIVEN — let the resource_probe
# decide based on real GPU/RAM/foreign-julia state. If anko starts a heavy
# julia job, probe degrades automatically and the next turn respects it.
#
# Policy enum: TEXT_ONLY / JULIA_CPU_LIGHT / JULIA_CPU_HEAVY / JULIA_GPU_OK
#              / PROBE_DRIVEN / HALT

# 2026-05-19 (Tuesday, anko 90% weekly quota incident): restrict-mode
# settings to stretch remaining ~10% quota across Wed-Fri. Hybrid plan:
# - inter_turn_sleep 5s → 1800s (30 min) — bursty → thin
# - daily_turn_cap 6 — hard limit per UTC day
# - auto_halt_at_quota 0.95 — automatic shutoff before 100%
# Resume normal (5s sleep, no day cap) once quota refreshes (Mon).

restrict_mode_2026_05_19:
  enabled: true
  inter_turn_sleep_sec: 1800       # 5 → 1800
  daily_turn_cap: 6                # New: limit per calendar day
  auto_halt_at_quota_fraction: 0.95
  weekly_quota_target_remaining: 0.10
  expires_after: "2026-05-26"      # next Monday
  rationale: |
    Tuesday 90% weekly quota → spread remaining 10% over Wed-Fri-Sat-Sun.
    1.5M tokens/turn × 6 turns/day × 5 days ≈ 45M tokens distributed.
    Bursty consumption fights against the 5-hr rolling window
    interactions with weekly cap; thin consumption is less likely to
    trip rate limits.

windows:
  # Historical window kept for trace (anko was using GPU Klaus-sweep then).
  - from: "2026-05-15T17:00:00+09:00"
    until: "2026-05-15T22:00:00+09:00"
    anko_state: "[HISTORICAL] using GPU+RAM during Klaus phi sweep"
    loop_policy: "TEXT_ONLY"
    max_concurrent_turns: 1
    notes: "Yesterday's hard rail. Sweep finished evening of 2026-05-15."

  # Open window from 2026-05-15 22:00 onward — probe-driven.
  - from: "2026-05-15T22:00:00+09:00"
    until: "2026-05-31T23:59:59+09:00"
    anko_state: "probe-authoritative; anko adds tighter windows as needed"
    loop_policy: "PROBE_DRIVEN"
    max_concurrent_turns: 1
    notes: |
      anko 2026-05-16 ("22時って昨日のだよ"): the 22:00 TEXT_ONLY clause
      was a one-time constraint, not recurring. Default this loop to
      PROBE_DRIVEN — if anko spawns julia, resource_probe.py picks up
      the foreign procs / VRAM pressure automatically and the next turn
      tightens. If anko wants to insert a tighter window mid-session,
      add an entry above this one with overlapping time range.
