    triggered_by: 'manual (anko-instigated grep hunt during loop refactor)'
    patterns_scanned: ['deprecated-name-leak']
    findings_count: 0  # after all-instance batch fix
    notes: |
      First reactive audit (not via this flow): bug 8 surfaced, grep found
      ~67 sibling instances, batch-fixed. Now in steady state.

  - run_at: '2026-05-18T05:00:00+09:00'
    triggered_by: 'T48 researcher normalization audit (yan-li-saito-2026-reproduction Research stage side-step)'
    patterns_scanned: ['paper-unit-system-wrong-param-in-spot-check']
    findings_count: 1  # T47 critic §D (the triggering instance)
    notes: |
      New class added (L1 reactive: surfaced via instance). Grep across
      `runs/_loop/judge/`, `runs/_loop/director/`, `runs/_loop/theorist/`,
      `runs/_loop/critic/` for `a_s = 110` or `a_s_bohr = 110` returned
