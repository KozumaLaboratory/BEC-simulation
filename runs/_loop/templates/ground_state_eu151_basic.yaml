# Canonical Eu-151 F=6 ground-state template
#
# Director Design stage: copy this file then patch only the deltas
# (grid size, B magnitude, c1 ratio, etc.). Always start from a
# template rather than writing configs from scratch.
#
# B-block schema:
# - Magnitude: Bz | B_mag | p (internal-normalized to dimless p)
# - Direction: theta, phi
# - q: auto-derived from |B|² unless explicit (rarely override)

defaults: {kind: rotating_basis, backend: gpu}

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.0]}
      interactions:
        N_atoms: 10000
        omega_ref: 691.15            # 2π·110 Hz reference (Eu trap)
        c1_ratio: -0.005             # spin-mixing, signed; magnitude small for Eu
      ddi: {enabled: true}           # Eu DDI auto-derived from atom + N + ω_ref
      lhy: {kind: scalar}            # Lima-Pelster scalar LHY
      B:
        Bz: 0.0                      # T₀ canonical: B=0 ground state
        theta: 0.0                   # quantization axis aligned +z (for B=0 this is a chosen gauge)
        phi: 0.0
      gauge_fix: false
      init_m_idx: 1                  # start in m=+F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 1500
      tol: 1.0e-9
