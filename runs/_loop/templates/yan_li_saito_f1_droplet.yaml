# Yan-Li-Saito 2026 PRL F=1 dipolar quantum droplet template (2026-05-18)
#
# Source: arXiv:2605.11670, Phys Rev Lett 136 186502 (2026)
#         "Barnett effect in rotating spinor dipolar quantum droplets"
# Goal: Tier-3 reproduction (free-space self-bound torus magnetic-vortex GS,
#       Fig 1c) + mechanical Larmor precession (Fig 2c).
#
# Paper params (verbatim from §2):
#   F = 1 hyperfine of Eu-151 (g_F·F = 9/2)
#   N = 15000
#   ε_dd = a_dd / a_s = 1.2  (DDI-dominant; spin-dep contact negligible)
#   Normalization: L₀ = a_s·N, T₀ = M·a_s²·N²/ℏ, D₀ = 1/(a_s³·N²), B₀ = ...
#     For Eu-151 F=1, N=15000, ε_dd=1.2: L₀=16.35 μm, T₀=0.64 s, B₀=0.2 μG
#   dx ≈ 10⁻³, dt ≈ 10⁻⁷ (in normalized units)
#   LHY: scalar Lima-Pelster χ(ε_dd) = Re ∫₀^π sinθ[1+ε_dd(3cos²θ-1)]^(5/2)/2 dθ
#   Free space (no harmonic trap; self-bound). Pseudospectral + ITP.
#
# T31-T38 (2026-05-17) attempted reproduction with this template; F=1 was
# FALSIFIED (loop's first external benchmark failure). Root cause currently
# under critic re-audit (b1opmbxbx, T40+). DO NOT modify this template
# without coordinating with the active investigation.

defaults: {kind: spinor, backend: gpu}   # F=1 spinor path; NOT rotating_basis

pipeline:
  - ground_state:
      atom: Eu151
      hyperfine_F: 1                # paper studies F=1, not Eu-151 ground-state F=6
      grid: {n: [64, 64, 64], box: [3.0, 3.0, 3.0]}  # box in L₀ units
      # NO harmonic potential — free-space droplet, self-bound by LHY balance
      potential: {type: none}
      interactions:
        N_atoms: 15000
        # a_s tuned so that ε_dd = a_dd/a_s = 1.2 with Eu-151 F=1 magnetic moment
        # (paper's spin-dep contact "negligible" condition: a_s ≲ a_dd, |a_sd| ≲ a_dd)
        scattering_length_a0: "<<a_s_for_eps_dd_1.2>>"   # patch at Design stage
        c1_ratio: 0.0                # paper: spin fully polarized, c1 negligible
      ddi: {enabled: true}
      lhy:
        kind: scalar                 # Lima-Pelster scalar single-component LHY with χ(ε_dd)
      B:
        Bz: 0.0                      # B = 0 paper baseline (Fig 1c)
        theta: 0.0
        phi: 0.0
      # Initial state: flux-closure torus shape — IF state_zoo lacks a builder,
      # use phase-imprinted torus density + circulating spin manually
      init: {state: flux_closure_torus, R0: 0.5, sigma_r: 0.3}
      dt: 0.001
      n_steps: 5000
      tol: 1.0e-10

