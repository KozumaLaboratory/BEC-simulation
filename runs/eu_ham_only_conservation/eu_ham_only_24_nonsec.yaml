# Step 5 v2 — 24³ × secular=false (stationary Bz baseline)
# See _template.yaml.md for full design rationale.

defaults:
  kind: spinor
  backend: cpu
  interactions: {N_atoms: 30000, omega_ref: 628.3}

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [24, 24, 24], box: [10.0, 10.0, 10.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.0]}
      interactions:
        N_atoms: 30000
        omega_ref: 628.3
        c1_ratio: -0.005
      ddi:
        enabled: true
        secular: false
      lhy: {kind: none}
      B: {Bz: "0.01 Gauss", theta: 0.0, phi: 0.0}
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 400
      tol: 1.0e-7

  - dynamics:
      duration: 0.5                           # 100 steps × dt=0.005
      dt: 0.005
      B: {Bz: "0.01 Gauss", theta: 0.0, phi: 0.0}   # SAME Bz as GS — no quench
      ddi: {secular: false}
      seed_amplitude: 0.0                     # NO noise — pure stationary test
      save:
        every: 10
        psi: true
        precision: f64

  - analyze:
      - energy_decomposition: {}
      - winding_map: {}
      - summary_json: {path: "runs/eu_ham_only_conservation/24_nonsec/summary.json"}
