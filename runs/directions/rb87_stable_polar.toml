# A pre-registered DIRECTION: certify that the polar ground state of this cell
# is a stable minimum. q>0 gaps the spin modes ⇒ a clean energetic minimum.
name = "rb87_stable_polar"

[physics]
atom = "Rb87"
dims = [32]
box  = [12.0]
c0 = 1.0
c1 = 0.1
q  = 0.5

[solve]
n_steps = 800
tol = 1.0e-10

[gate]
niter = 120
eps_stat = 1.0e-4
bdg_dim_cap = 4000
