# ================================================================
# Eu151 2D phase map:  c1_ratio  ×  DDI strength (c_dd scaling)
# ================================================================
#
# Goal:
#   Isolate the role of DDI by scanning pipeline.0.ddi.c_dd from
#   0 (pure contact) through physical value (~7647 for 50k atoms)
#   to 2× physical. Crossed with c1_ratio to catch FM↔polar and
#   FM↔FL-vortex transitions driven by DDI.
#
# This scan fixes zeeman=0 (no bias), so the Mz sector is free
# (ground state will pick whatever Mz minimises E).
#
# Use alongside eu151_phase_c1_q to see which transitions are
# contact-driven vs DDI-driven.
# ================================================================

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [16.0, 16.0, 16.0]}
      interactions:
        N_atoms: 50000
        omega_ref: 691.15
        c1_ratio: 0.0
      ddi: {enabled: true, c_dd: 7647.0}   # overridden per point
      zeeman: {p: 0.0, q: 0.0}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.1818]}
      dt: 0.002
      n_steps: 40000
      tol: 1.0e-7
      initial_state: polar
      backend: cuda

  - analyze:
      - phase_classify: {}
      - bogoliubov: {k_max: 8.0, n_k: 80, directions: auto}

scan:
  product:
    pipeline.0.interactions.c1_ratio:
      [-0.015, -0.005, 0.0, 0.005, 0.015]
    pipeline.0.ddi.c_dd:
      [0.0, 1500.0, 3800.0, 7647.0, 12000.0, 15294.0]
  continuation: false
