# Eu151 ground state: p-continuation (Zeeman field sweep)
#
# Adiabatic ramp: p goes from 100 (strongly polarized m=-F) to 0
# (weak field, spin texture develops) continuously during ITP.
# dt determines the ramp resolution. No discrete scan needed.

pipeline:
  - ground_state:
      atom: Eu151
      grid:
        n: [64, 64, 64]
        box: [20.0, 20.0, 20.0]
      interactions:
        N_atoms: 50000
        omega_ref: 691.15
        c1_ratio: 0.02778
      ddi:
        enabled: true
      zeeman:
        p: {from: 100, to: 0, scale: log}
        q: 0.0
      potential: {type: harmonic, omega: [1.0, 1.0, 1.1818]}
      dt: 0.0005
      n_steps: 200000
      tol: 1.0e-8
      initial_state: ferromagnetic
      backend: cuda

  - analyze:
      - phase_classify: {}
