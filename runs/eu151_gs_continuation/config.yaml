# Eu151 ground state: continuous c_dd ramp (0 → 7647)
#
# DDI strength is ramped continuously during ITP via on_step callback.
# This avoids discrete jumps and gives smoother convergence.
# c_dd is a material constant — ramp is purely numerical technique.

pipeline:
  - ground_state:
      atom: Eu151
      grid:
        n: [64, 64, 64]
        box: [20.0, 20.0, 20.0]
      interactions:
        N_atoms: 50000
        omega_ref: 691.15
        c1_ratio: -0.01
      ddi:
        enabled: true
        c_dd: {from: 0, to: 7647, scale: reverse_sqrt}
      zeeman: {p: 0.39, q: 0.0}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.1818]}
      dt: 0.0005
      n_steps: 200000
      tol: 1.0e-8
      initial_state: antiferromagnetic
      backend: cuda
