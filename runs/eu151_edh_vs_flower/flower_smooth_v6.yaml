# ─────────────────────────────────────────────────────────────────────────
#  Flower v6 (2026-07-02): HIGH-PRECISION, FULL-GRID sibling of edh_quench_v6.
#    SAME 96³ c1=1/36 ground state, SAME final field (26 µG), SAME weak-field
#    hold, SAME K3 = 2.1e-41 — the ONLY difference from EdH is dB/dt:
#      EdH    : 10 mG → 26 µG in 0.20 ms  (sudden quench, non-adiabatic)
#      Flower : 10 mG → 26 µG over ~274 ms (Goto smooth descent, adiabatic)
#    grid 96³, ψ snapshots f64, dt 0.002 (descent+hold). Total wall 288 internal
#    (417 ms) → TIME-MATCHED to edh_quench_v6.yaml so the pair is directly
#    comparable. Goto Ch.6 descent: linear (0–40 ms) → C¹ smooth corner →
#    parabola landing gently on 26 µG. Loads gs_10mG_c1_36_96.jld2.
# ─────────────────────────────────────────────────────────────────────────
