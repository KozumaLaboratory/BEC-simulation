# EdH v5 (2026-06-30): v4 + REALISTIC three-body loss K3 = 2.1e-41 m^6/s.
# EDH ONLY, c1_ratio=1/36. Loads GS gs_10mG_c1_36.jld2 (same as v4).
# quench 10mG->26uG(2.6nT) -> 40ms spin relaxation, WITH K3 loss (non-Hermitian, RTP only).
# K3 is 10x smaller than the Matsui 2.1e-40 used in earlier runs -> gentler, longer-lived cloud.
defaults:
  kind: spinor
  backend: gpu
  interactions:
    N_atoms: 50000
    omega_ref: 691.15
mixins:
  eu151_edh_phys:
    atom: Eu151
    grid:
      n:
      - 64
      - 64
      - 64
      box:
      - 18
      - 18
      - 18
    potential:
      type: harmonic
      omega:
      - 1.0
      - 1.0
      - 1.182
    interactions:
      N_atoms: 50000
      omega_ref: 691.15
      c1_ratio: 0.027777777777777776
pipeline:
- ground_state:
    use:
    - eu151_edh_phys
    method: lbfgs
    B:
      Bz: 0.01 Gauss
    n_steps: 1
    tol: 1.0e-09
    cache: runs/eu151_edh_vs_flower/cache/gs_10mG_c1_36.jld2
- dynamics:
    duration: 0.14
    dt: 0.0005
    B:
      Bz:
        from: 0.01
        to: 2.6e-05
        duration: 0.14
    loss:
      K3_per_m_si: ["2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s"]
    save:
      every: 10
      psi: true
      precision: f32
- dynamics:
    duration: 28.0
    dt: 0.001
    B:
      Bz: 2.6e-5 Gauss
    seed_amplitude: 1.0e-08
    seed_k_cut: 2.5
    noise_seed: 42
    loss:
      K3_per_m_si: ["2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s"]
    save:
      every: 250
      psi: true
      precision: f32
