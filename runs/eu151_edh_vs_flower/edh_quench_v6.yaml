# ─────────────────────────────────────────────────────────────────────────
#  EdH v6 (2026-07-02): HIGH-PRECISION, FULL-GRID rerun of the v5 physics.
#    - grid 96³ (was 64³)          → finer spatial resolution
#    - ψ snapshots stored as f64   → removes the ~1e-4 f32 tomography error
#    - finer dt (quench 0.0005, hold 0.002) → better time/amplitude accuracy
#    - c1_ratio = 1/36, K3 = 2.1e-41 m^6/s  (SAME physics as v5)
#    - total wall 288 internal (417 ms) → TIME-MATCHED to flower_smooth_v6.yaml
#  Internal time unit 1 = 1.447 ms. Loads the 96³ c1=1/36 GS (gs_10mG_c1_36_96).
#  The extraction that follows this run uses stride=1 (full 96³, no subsample).
# ─────────────────────────────────────────────────────────────────────────
defaults:
  kind: spinor
  backend: gpu
  interactions:
    N_atoms: 50000
    omega_ref: 691.15
mixins:
  eu151_edh_phys:
    atom: Eu151
    grid:
      n:
      - 96
      - 96
      - 96
      box:
      - 18
      - 18
      - 18
    potential:
      type: harmonic
      omega:
      - 1.0
      - 1.0
      - 1.182
    interactions:
      N_atoms: 50000
      omega_ref: 691.15
      c1_ratio: 0.027777777777777776
pipeline:
- ground_state:
    use:
    - eu151_edh_phys
    method: lbfgs
    B:
      Bz: 0.01 Gauss
    n_steps: 1
    tol: 1.0e-09
    cache: runs/eu151_edh_vs_flower/cache/gs_10mG_c1_36_96.jld2
- dynamics:
    duration: 0.14
    dt: 0.0005
    B:
      Bz:
        from: 0.01
        to: 2.6e-05
        duration: 0.14
    loss:
      K3_per_m_si: ["2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s"]
    save:
      every: 7
      psi: true
      precision: f64
- dynamics:
    duration: 287.86
    dt: 0.002
    B:
      Bz: 2.6e-5 Gauss
    seed_amplitude: 1.0e-08
    seed_k_cut: 2.5
    noise_seed: 42
    loss:
      K3_per_m_si: ["2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s","2.1e-41 m^6/s"]
    save:
      every: 1200
      psi: true
      precision: f64
