defaults:
  kind: spinor
  backend: gpu
  interactions: {N_atoms: 50000, omega_ref: 691.15}
mixins:
  eu151_edh_phys:
    atom: Eu151
    grid:
      n: [64, 64, 64]
      box: [18, 18, 18]
    potential:
      type: harmonic
      omega: [1.0, 1.0, 1.182]
    interactions: {N_atoms: 50000, omega_ref: 691.15, c1_ratio: 0.027777777777777776}
pipeline:
- ground_state:
    use: [eu151_edh_phys]
    method: lbfgs
    B: {Bz: 0.01 Gauss}
    n_steps: 1
    tol: 1.0e-09
    cache: runs/eu151_edh_vs_flower/cache/gs_10mG_c1_36_64.jld2
- dynamics:
    duration: 90.0
    dt: 0.002
    B:
      Bz: {from: 0.01, to: 2.6e-05, duration: 90.0}
    loss:
      K3_per_m_si: &id001 [2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s,
        2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s,
        2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s]
    save: {every: 1125, psi: true, precision: f32}
- dynamics:
    duration: 40.0
    dt: 0.002
    B: {Bz: 2.6e-5 Gauss}
    seed_amplitude: 1.0e-08
    seed_k_cut: 2.5
    noise_seed: 42
    loss:
      K3_per_m_si: *id001
    save: {every: 500, psi: true, precision: f32}
