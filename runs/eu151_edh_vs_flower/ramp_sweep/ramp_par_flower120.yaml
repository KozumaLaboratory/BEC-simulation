    dt: 0.002
    B:
      Bz:
        piecewise:
          times: [0, 5.625, 11.25, 16.875, 22.5, 28.125, 33.75, 39.375, 45, 50.625, 56.25, 61.875, 67.5, 73.125, 78.75, 84.375, 90]
