# Quench-then-parabolic EdH (2026-07-23). Motivated by the finding that the
# m=-6 -> -5 EdH cascade only switches on below ~571 μG (≈100 ms in the pure
# ramp_par_edh_mild run): the >500 μG stretch carries NO spin dynamics (m=-6 is
# a Zeeman eigenstate), so quench through it instantly, then spend the adiabatic
# care of a parabolic ramp only across the EdH-active window 500 μG -> 26 μG.
#
#   GS (m=-6, 10 mG, q=0)  ->  quench 10 mG->500 μG (5.8 ms)  ->
#   parabolic 500->26 μG (87 ms)  ->  hold 26 μG + seed (87 ms)
# GS is identical to ramp_par_edh_mild, so its cache is reused (instant load).
defaults:
  kind: spinor
  backend: gpu
  interactions: {N_atoms: 50000, omega_ref: 691.15}
mixins:
  eu151_edh_phys:
    atom: Eu151
    grid: {n: [64, 64, 64], box: [18, 18, 18]}
    potential: {type: harmonic, omega: [1.0, 1.0, 1.182]}
    interactions: {N_atoms: 50000, omega_ref: 691.15, c1_ratio: 0.027777777777777776}
pipeline:
- ground_state:
    use: [eu151_edh_phys]
    method: lbfgs
    initial_state: m_minus_F
    B: {Bz: 0.01 Gauss, q: 0.0}
    n_steps: 800
    tol: 1.0e-08
    cache: runs/eu151_edh_vs_flower/cache/gs_10mG_polm6_64.jld2
# --- phase A: fast quench 10 mG -> 500 μG (inert region; m=-6 unchanged) ---
- dynamics:
    duration: 4.0
    dt: 0.002
    B:
      Bz: {from: 0.01, to: 5.0e-4, duration: 4.0}
    loss:
      K3_per_m_si: &id001 [2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s,
        2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s,
        2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s, 2.1e-41 m^6/s]
    save: {every: 500, psi: true, precision: f32}
# --- phase B: parabolic 500 μG -> 26 μG over 19.62 ω⁻¹ (28.4 ms) ---
#     This is EXACTLY the tail of the pure-parabolic ramp (ramp_par_edh_mild):
#     that ramp crossed 500 μG at t0=70.4 ω⁻¹ and reached 26 μG at 90 ω⁻¹, so the
#     active-window traversal rate here is IDENTICAL — only the inert >500 μG part
#     is skipped (quenched). Same EdH dynamics, just faster overall.
- dynamics:
    duration: 19.62
    dt: 0.002
    B:
      Bz:
        piecewise:
          times: [0, 1.962, 3.924, 5.886, 7.848, 9.81, 11.772, 13.734, 15.696, 17.658, 19.62]
          values: [0.0005, 0.00040994, 0.00032936, 0.00025826, 0.00019664, 0.0001445,
            0.00010184, 6.866e-05, 4.496e-05, 3.074e-05, 2.6e-05]
    loss:
      K3_per_m_si: *id001
    save: {every: 500, psi: true, precision: f32}
# --- phase C: hold at 26 μG + symmetry-breaking seed ---
- dynamics:
    duration: 60.0
    dt: 0.002
    B: {Bz: 2.6e-5 Gauss}
    seed_amplitude: 1.0e-08
    seed_k_cut: 2.5
    noise_seed: 42
    loss:
      K3_per_m_si: *id001
    save: {every: 500, psi: true, precision: f32}
