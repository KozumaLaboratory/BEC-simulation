# EdH noloss diagnostic: K3=0, hold dt 0.005->0.001, seed 1e-6->1e-8.
# Tests whether EdH roughness is numerical (dt) vs physical (non-adiabatic).
# GS cache paths unchanged -> reuses gs_10mG_{itp,lbfgs}.jld2 (no GS recompute).
defaults:
  kind: spinor
  backend: gpu
  interactions:
    N_atoms: 50000
    omega_ref: 691.15
mixins:
  eu151_edh_phys:
    atom: Eu151
    grid:
      n:
      - 64
      - 64
      - 64
      box:
      - 18
      - 18
      - 18
    potential:
      type: harmonic
      omega:
      - 1.0
      - 1.0
      - 1.182
    interactions:
      N_atoms: 50000
      omega_ref: 691.15
      c1_ratio: 0.0
pipeline:
- ground_state:
    use:
    - eu151_edh_phys
    method: itp
    B:
      Bz: 0.01 Gauss
    initial_state: random
    n_steps: 100000
    tol: 1.0e-09
    dt: 0.005
    cache: runs/eu151_edh_vs_flower/cache/gs_10mG_itp.jld2
- ground_state:
    use:
    - eu151_edh_phys
    method: lbfgs
    B:
      Bz: 0.01 Gauss
    n_steps: 3000
    tol: 1.0e-07
    m_lbfgs: 10
    sobolev_alpha: 0.5
    checkpoint_every: 150
    cache: runs/eu151_edh_vs_flower/cache/gs_10mG_lbfgs.jld2
- dynamics:
    duration: 0.14
    dt: 0.0005
    B:
      Bz:
        from: 0.01
        to: 2.6e-05
        duration: 0.14
    save:
      every: 10
      psi: true
      precision: f32
- dynamics:
    duration: 287.86
    dt: 0.001
    B:
      Bz: 2.6e-5 Gauss
    seed_amplitude: 1.0e-08
    seed_k_cut: 2.5
    noise_seed: 42
    save:
      every: 1250
      psi: true
      precision: f32
