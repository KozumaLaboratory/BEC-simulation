# ERROR BUDGET, arm A' — their exponential ramp with the KNOTS REFINED tau/6 -> tau/24.
#
# budget_ramp_n35k_n32 encodes their B(t) = (B_ini - B_fin)exp(-t/tau) as a
# piecewise-linear waveform sampled at tau/6. Their Fortran evaluates the true
# exponential at every step, so the piecewise-linear panels are OUR artifact —
# and a chord across a convex decaying exponential lies ABOVE it everywhere, so
# the approximation runs the field systematically HIGH during the ramp.
#
# Measured (analytically, scripts scratch): at tau/6 the excess time-integrated
# field over the 5 ms hold is 0.0848 nT*t.u., equivalent to a **+0.0245 nT DC
# offset**. Peak instantaneous excess is 3.6 nT. At tau/24 both fall 12x, to
# 0.0068 nT*t.u. / +0.0020 nT.
#
# PREDICTION, recorded before the run. The tau/6 arm measured centre -2.5865
# against Matsui's -2.5495 — an overshoot of 0.037 nT past the target, in a
# campaign whose whole remaining residual is 0.0396 nT. If the overshoot is this
# quadrature artifact, refining the knots must move the centre by about +0.0245
# nT, to roughly -2.562, and leave ~0.012 nT unexplained. If the centre does NOT
# move by ~0.02 nT, the ramp discretisation is exonerated and the overshoot is
# physics or another convention.
#
# This is INDEPENDENT of the dt-locality result. dt_where_n35k_n32 refined the
# time STEP over the ramp segment 4x and moved the centre by 0.0000 nT — but a
# finer dt samples the same piecewise-linear waveform more densely, it does not
# move that waveform closer to the exponential. Knot spacing and step size are
# separate axes and only one of them has been measured.
#
# Everything else is bit-identical to budget_ramp_n35k_n32.

defaults:
  kind: spinor
  backend: gpu
  interactions: {N_atoms: 35000, omega_ref: 691.1504}

scan:
  zip:
    pipeline.1.B.Bz.sum.0: {from: -1.3e-4, to: 9.0e-5, step: 5.0e-6}   # Gauss; -13 … +9 nT (45 pts)

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [16.0, 16.0, 16.0]}   # dx = 0.5 a_ho; R_TF ≈ 5.1 a_ho
      potential: {type: harmonic, omega: [1.0, 1.0, 1.181818]}
      interactions:
        N_atoms: 35000                       # their shipped Ntot
        omega_ref: 691.1504
        c1_ratio: 0.027777777777777776       # 1/36
      ddi:
        enabled: true
        secular: true            # spin frozen at m=-6 during their ITP (calcDD_3D_pol)
        padded: true
        pad_factor: 2
      lhy: {kind: none}          # their model has no beyond-mean-field term
      B:
        Bz: "0.0104 Gauss"       # 10.4 mG = 1.04 µT, their Bfield_ini
        theta: 0.0
        phi: 0.0
        q: 0.00909116            # 2π·1 Hz / ω_ref — their ZeemanQ = 1.0 Hz
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 4000
      tol: 1.0e-10

  - dynamics:
      duration: 3.4558           # 5 ms × 691.1504
      dt: 0.001                  # their time_step, in the same 1/ω_ref units
