# Eu151 spontaneous magnetization via RTP
#
# Strategy: find m=0 polar GS with full DDI via c_dd continuation (DDI
# ramped from 0 → 7647 in a few steps). Then seed a small noise
# perturbation and let real-time propagation drive spontaneous
# magnetization and vortex formation.

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [12.0, 12.0, 12.0]}
      interactions:
        N_atoms: 50000
        omega_ref: 691.15
        c1_ratio: 0.0
      ddi: {enabled: false}       # DDI off during GS (stable ITP)
      zeeman: {p: 0.0, q: 0.0}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.1818]}
      dt: 0.001
      tol: 1.0e-8
      initial_state: polar        # m=0
      target_magnetization: 0.0
      backend: cuda

  - dynamics:
      duration: 0.5               # ~0.72 ms
      dt: 5.0e-5
      save_every: 500
      ddi: true                   # enable DDI for dynamics
      zeeman: {p: 0.0, q: 0.0}
      perturbation_amplitude: 1.0e-3
      noise_seed: 42

observables:
  always: [norm, magnetization]
  on_save: [energy, populations]
