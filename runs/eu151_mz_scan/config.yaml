# Eu151 Mz-constrained scan via YAML
#
# Sweeps target_magnetization from -6 → 0, computing the lowest-energy state
# in each Mz sector. Uses N_atoms + omega_ref to compute c_total and c_dd
# automatically from physical parameters.

pipeline:
  - ground_state:
      method: itp
      atom: Eu151
      grid:
        n: [64, 64, 64]
        box: [20.0, 20.0, 20.0]
      interactions:
        N_atoms: 50000
        omega_ref: 691.15        # 2π × 110 Hz
        c1_ratio: 0.0
        c_lhy: 1135.0            # Lima-Pelster ε_dd≈0.544
      ddi:
        enabled: true
        # c_dd computed automatically from N_atoms + omega_ref
      zeeman:
        p: 0.0
        q: 0.0
      potential: {type: harmonic, omega: [1.0, 1.0, 1.1818]}   # 130/110
      dt: 0.001
      tol: 1.0e-7
      initial_state: ferromagnetic_min
      target_magnetization: -6.0
      backend: cuda

  - ground_state:
      method: lbfgs              # polish ITP seed with L-BFGS
      n_steps: 500
      tol: 1.0e-8
      # atom/grid/interactions/ddi/potential/zeeman/target_magnetization
      # all inherited from the previous step

  - analyze:
      - phase_classify: {}

scan:
  zip:
    pipeline.0.target_magnetization: [-6.0, -5.5, -5.0, -4.5, -4.0, -3.5, -3.0, -2.5, -2.0, -1.5, -1.0, -0.5, 0.0]
  continuation: true
  auto_rotate_on_mz: true     # rotate prev_psi by Δα between Mz points
