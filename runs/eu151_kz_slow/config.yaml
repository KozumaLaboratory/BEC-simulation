# =================================================================
# Eu151 Kibble-Zurek slow-quench tail
# =================================================================
#
# Extends runs/eu151_kibble_zurek (τ_Q ∈ {5, 10, 20, 50, 100}) into the
# slow regime where defect density should follow the KZ scaling
# n_d ∝ τ_Q^(-ν). Each τ_Q × seed combination is one independent
# trajectory; the resulting n_d(τ_Q) spans 3.5 decades when joined with
# the prior batch's results.

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [48, 48, 32], box: [14.0, 14.0, 10.0]}
      interactions:
        N_atoms: 30000
        omega_ref: 691.15
        c1_ratio: 0.028
      ddi: {enabled: true}
      zeeman: {p: 0.5, q: 1.5}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.1818]}
      dt: 0.005
      n_steps: 6000
      tol: 1.0e-7
      initial_state: polar
      backend: cuda

  - dynamics:
      duration: 200.0                    # τ_Q overridden per scan point
      dt: 0.01
      save_every: 200
      temperature_ratio: 0.05
      zeeman:
        p: 0.5
        q: {from: 1.5, to: -0.5}

  - dynamics:
      duration: 5.0                      # short hold at final q
      dt: 0.01
      save_every: 100
      zeeman: {p: 0.5, q: -0.5}

  - analyze:
      - phase_classify: {}
      - defect_density: {defect_type: domain_wall, threshold: 0.05}
      - defect_density: {defect_type: vortex, threshold: 0.1}
      - kibble_zurek_stats: {threshold: 0.1}
      - summary_json:
          path: runs/eu151_kz_slow/summary.json
          extras: {test_kind: kibble_zurek_slow_tail}

scan:
  product:
    pipeline.1.duration: [200.0, 500.0, 1000.0]
  comparison_runs:
    - name: seed_a
      override: {pipeline.1.noise_seed: 11011}
    - name: seed_b
      override: {pipeline.1.noise_seed: 22022}
    - name: seed_c
      override: {pipeline.1.noise_seed: 33033}
  continuation: false
