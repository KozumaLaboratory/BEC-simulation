# Barnett ladder Week 1 — scalar rotation benchmark.
# Source: scripts/validation/barnett_week1_gen.jl
# Ω = 0.9  (rotating-frame angular velocity, in units of ω_ref).

defaults:
  kind: spinor
  backend: cpu
  interactions: {N_atoms: 5000, omega_ref: 100.0}

pipeline:
  - ground_state:
      atom: Rb87
      grid: {n: [32, 32, 32], box: [10.0, 10.0, 10.0]}
      # 2D-like anisotropic trap (pancake). The y/x slight anisotropy
      # breaks rotation symmetry → vortex formation possible at large Ω.
      potential: {type: harmonic, omega: [1.0, 1.05, 4.0]}
      interactions:
        N_atoms: 5000
        omega_ref: 100.0
        c1_ratio: 0.0                            # scalar regime
      ddi:
        enabled: false
      lhy: {kind: none}
      B: {Bz: 0.0}
      initial_state: m_plus_F
      init_sigma: 1.5
      dt: 0.01
      n_steps: 2000
      tol: 1.0e-9

  - dynamics:
      duration: 20.0
      dt: 0.005
      rotating_frame_omega: 0.9               # rotating-frame term
      ddi: {enabled: false}
      lhy: {kind: none}
      seed_amplitude: 1.0e-5
      seed_k_cut: 2.5
      save:
        every: 200
        psi: true
        precision: f64

  - analyze:
      - energy_decomposition: {}
