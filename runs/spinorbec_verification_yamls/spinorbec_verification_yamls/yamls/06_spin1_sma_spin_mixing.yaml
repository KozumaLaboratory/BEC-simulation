# 06 — Spin-1 coherent spin-mixing benchmark
# Physics: spin-exchange collision 2|m=0> <-> |m=+1>+|m=-1>.
# Expected: N and Mz conserved; component populations oscillate after a small seed.
# This is a qualitative/SMA-conservation test, not a strict period test unless post-fit to SMA ODE.

defaults:
  kind: spinor
  backend: cpu

pipeline:
  - ground_state:
      atom: Na23
      grid: {n: [24, 24, 24], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 1.0]}
      interactions: {c0: 80.0, c1: 1.0}
      ddi: {enabled: false}
      B: {p: 0.0, q: 0.05}
      initial_state: polar
      method: itp
      dt: 0.003
      n_steps: 2500
      tol: 1.0e-9

  - dynamics:
      duration: 8.0
      dt: 0.002
      interactions: {c0: 80.0, c1: 1.0}
      B: {p: 0.0, q: 0.05}
      seed_amplitude: 1.0e-4
      seed_k_cut: 1.0
      noise_seed: 1234
      save: {every: 50, psi: true, precision: f32}

  - analyze:
      - phase_classify: {}
      - summary_json: {path: "verify_outputs/06_spin1_sma_spinmix_summary.json"}
