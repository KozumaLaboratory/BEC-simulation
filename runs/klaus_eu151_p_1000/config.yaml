# =================================================================
# Eu151 p-sweep — p=1000 (intermediate Berry-vs-adiabatic regime).
# Same Klaus protocol, with reduced Larmor scale.
# Tests: does spin gap p=1000 (vs Berry |Â|≈4.5) leak out of m=+F?
# Expected: p/|Â| ≈ 222 → still adiabatic but more visible mixing.
# =================================================================

pipeline:
  - ground_state:
      kind: rotating_basis
      backend: cuda
      atom: Eu151
      N_atoms: 60000
      omega_ref: 314.159
      grid: {n: [24, 24, 12], box: [20.0, 20.0, 10.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 2.6]}
      interactions: {c1: 0.0}
      zeeman: {p: 1000.0, q: 0.0}                # 26.7× weaker B
      B_hat: {theta: 0.0, phi: 0.0}
      gauge_fix: false
      n_steps: 250
      dt: 0.005
      init_m_idx: 1
      init_sigma: 1.5

  - dynamics:
      kind: rotating_basis
      duration: 6.28
      epsilon: 1.0e-3
      save_every: 30
      B_hat: {theta_ramp: {from: 0.0, to: 0.611, duration: 6.28}, phi_omega: 0.0}

  - dynamics:
      kind: rotating_basis
      duration: 15.7
      epsilon: 1.0e-3
      save_every: 30
      B_hat: {theta_const: 0.611, phi_chirp: {from: 0.0, to: 4.524, duration: 15.7}}

  - dynamics:
      kind: rotating_basis
      duration: 62.83
      epsilon: 1.0e-3
      save_every: 50
      B_hat: {theta_const: 0.611, phi_omega: 4.524}
