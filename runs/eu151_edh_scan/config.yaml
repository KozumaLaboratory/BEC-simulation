# B-2: EdH holding-time × target-field systematic scan
#
# Fix the preparation sequence (3G → 10mG ramp), then scan:
#   - target magnetic field B_target: 50–300 μG (= p ≈ 0.008–0.048 dimless)
#   - holding time at B_target: 1–25 ms (= 0.69–17.3 ω⁻¹)
#
# Product scan gives a 2D map showing where EdH signal is strongest.
# Each point: GS at strong field → quench → hold → record populations.
#
# ⚠️ Run AFTER Bug-1 (Coriolis) is confirmed fixed.

experiment:
  name: "Eu151 EdH 2D scan (hold_time × B_target)"
  type: phase_scan

  system:
    atom: Eu151
    grid:
      n_points: [64, 64, 64]
      box_size: [20.0, 20.0, 20.0]
    interactions:
      N_atoms: 50000
      omega_ref: 691.15
      c1_ratio: 0.02778     # 1/36 Buchachenko
    ddi:
      enabled: true

  ground_state:
    dt: 0.005
    n_steps: 20000
    tol: 1.0e-10
    initial_state: ferromagnetic
    zeeman:
      p: 100.0              # strong field polarizes m=+F
      q: 0.0
    potential:
      type: harmonic
      omega: [1.0, 1.0, 1.182]
    backend: cuda

  scan:
    product:
      # target field: 50, 100, 150, 200, 250, 300 μG
      # p = μ_B g_F B / (ℏω) ≈ 0.00814 per 50μG
      ground_state.zeeman.p: [0.008, 0.016, 0.024, 0.033, 0.041, 0.049]
      # holding time: 1, 5, 10, 15, 20, 25 ms → ω⁻¹ units (×0.691)
      sequence.0.duration: [0.69, 3.46, 6.91, 10.37, 13.82, 17.28]
    continuation: false

  # Single dynamics phase: hold at B_target
  sequence:
    - name: hold
      duration: 6.91          # overridden by scan
      dt: 0.001
      save_every: 100
      override:
        system.ddi.enabled: true

  observables:
    always: [norm, magnetization]
    on_save: [energy, populations]
