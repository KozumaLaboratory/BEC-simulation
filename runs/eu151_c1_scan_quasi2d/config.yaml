# ================================================================
# Eu151 quasi-2D phase diagram
# ================================================================
#
# Reference:
#   Matsui et al., Science 391, 384-388 (2026)
#
# Physics:
#   Ground-state phase diagram of F=6 Eu151 BEC as a function of
#   spin interaction strength c₁/c₀. Uses z-integrated DDI kernel
#   (quasi-2D approximation) for pancake trap geometry.
#
#   Key phases:
#     c₁ < 0:  ferromagnetic (all atoms in m=+6)
#     c₁ = 0:  DDI-dominated (spin texture, EdH instability)
#     c₁ > 0:  antiferromagnetic / nematic ordering
#
# Units: dimensionless (ℏ = m = ω_ref = 1), ω_ref = 2π × 110 Hz
#   See eu151_edh.yaml for full conversion formulae.
# ================================================================

pipeline:
  - ground_state:
      atom: Eu151
      grid:
        n: [64, 64]
        box: [12.0, 12.0]
      interactions:
        N_atoms: 50000
        omega_ref: 691.15
        c1_ratio: 0.0
      ddi:
        enabled: true
        quasi_2d: true
        l_z: 0.9196  # sqrt(110/130)
      zeeman:
        p: 0.39
        q: 0.0
      potential: {type: harmonic, omega: [1.0, 1.0]}
      dt: 0.005
      n_steps: 100000
      tol: 1.0e-8
      initial_state: polar
      backend: cuda

scan:
  zip:
    pipeline.0.interactions.c1_ratio:
      [-0.01389, -0.010914, -0.0079371, -0.0049607, -0.0019843,
        0.00099214, 0.0039686, 0.006945, 0.0099214, 0.012898,
        0.015874, 0.018851, 0.021827, 0.024804, 0.02778]
  continuation: true
