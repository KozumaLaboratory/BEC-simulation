pipeline:
  - ground_state:
      dt: 0.001
      atom: "Dy164"
      potential:
        omega:
          - 1.0
          - 1.0
          - 2.6
        type: "harmonic"
      backend: "gpu"
      B:
        Bz: "1.0 Gauss"
      initial_state: "ferromagnetic_min"
      tol: 1.0e-7
      ddi:
        enabled: true
      grid:
        box:
          - 20.0
          - 20.0
          - 8.0
        n:
          - 64
          - 64
          - 32
      interactions:
        omega_ref: 314.159
        N_atoms: 60000
      n_steps: 30000
  - dynamics:
      duration: 6.28
      B:
        phi_deg: 0.0
        magnitude: "1.0 Gauss"
        theta_deg:
          to: 35.0
          from: 0.0
      dt: 0.002
      interactions:
        omega_ref: 314.159
      save:
        psi: true
        every: 100
        precision: "f32"
  - dynamics:
      duration: 15.7
      B:
        By:
          chirped_sinusoidal:
            duration: 15.7
            freq_end: 0.72
            freq_start: 0.0
            phase: -1.5708
            amplitude: 0.574
        Bx:
          chirped_sinusoidal:
            duration: 15.7
            freq_end: 0.72
            freq_start: 0.0
            amplitude: 0.574
        Bz: "0.819 Gauss"
      dt: 0.002
      interactions:
        omega_ref: 314.159
      save:
        psi: true
        every: 250
        precision: "f32"
  - dynamics:
      duration: 314
      B:
        By:
          sinusoidal:
            phase: -1.5708
            frequency: 0.72
            amplitude: 0.574
        Bx:
          sinusoidal:
            frequency: 0.72
            amplitude: 0.574
        Bz: "0.819 Gauss"
      dt: 0.002
      interactions:
        omega_ref: 314.159
      save:
        psi: true
        every: 1000
        precision: "f32"
  - analyze:
      - column_density_movie:
          colorscale: "Viridis"
          height: 600
          axis: 3
          multi_step: true
          output_dir: "runs/klaus2022_full/frames"
          width: 700
      - vortex_detect:
          threshold: 0.1
          component: 1
      - winding_field:
          threshold: 1.0e-6
          component: 1
      - summary_json:
          extras:
            test_kind: "klaus2022_full"
            target: "vortex_stripe_formation"
          path: "runs/klaus2022_full/summary.json"
