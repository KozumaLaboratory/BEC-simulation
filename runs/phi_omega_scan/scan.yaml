name: phi_omega_scan
description: |
  Klaus magnetostir frequency scan on Eu151. Steady-stir phi_dot varies
  from 1.0 to 18.0 dimless (= 50 Hz to 900 Hz at ω_ref = 2π·50 Hz).
  The phase-2 spinup endpoint slaves to the steady value.
parameter:
  key: phi_dot
  values: [1.0, 2.0, 3.0, 4.524, 6.0, 8.0, 12.0, 18.0]
  unit: "(2π·50 Hz)"
  display_unit: "Hz"
  display_factor: 50.0
  yaml_path: pipeline.3.dynamics.B_hat.phi_dot
template: eu151_phi4_524_500ms/config.yaml
override_path: pipeline.3.dynamics.B_hat.phi_dot
extra_overrides:
  pipeline.2.dynamics.B_hat.phi_dot.to: ${value}
point_dir_pattern: eu151_phi${value}_500ms
