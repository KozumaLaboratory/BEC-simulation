pipeline:
  - ground_state:
      atom: Eu151
      grid:
        n: [96, 96]
        box: [48, 48]
      interactions:
        c0: 1.0
        c1: 0.001
      ddi:
        enabled: true
        c_dd: 7647.0
        quasi_2d: true
        l_z: 0.847
      zeeman:
        p: 0.0
        q: 0.0
      potential: {type: harmonic, omega: [0.5, 0.5]}           # Weaker trap to make the BEC larger
      dt: 0.001
      tol: 1.0e-6
      initial_state: polar

observables:
  final_only: [psi, energy]
