# ================================================================
# Eu151 pancake-trap FL phase scan
# ================================================================
#
# Goal: determine if FL (flux-closure) vortex becomes the ground state
# in a pancake geometry where the kinetic energy cost of spin texture
# is reduced.
#
# Strategy:
#   At each (trap_ratio, c1_ratio, init_theta) point, compare two
#   initial conditions:
#     - uniform_polarized: ferromagnetic m=-6 (target_Mz=-6)
#     - fl_vortex: spin-coherent Ry(θ)|m=+6⟩ with winding ℓ=1 (Mz=0)
#
# Physics:
#   FL wins when DDI flux-closure energy gain > texture kinetic cost.
#   Pancake trap (ω_z/ω_⊥ >> 1) confines the condensate to a disk,
#   reducing kinetic cost of in-plane spin texture.
#
#   θ = π/2: spin lies in xy-plane (maximal FL, Mz=0)
#   θ < π/2: spin tilted toward z (partial FL, |Mz|>0)
#
# Grid: 3D anisotropic (128×128×16) with tight z-box.
#   z extent = L_perp / trap_ratio × scale_factor
#   For trap_ratio=10: box_z = 20/10 × 1.5 = 3.0
#   For trap_ratio=30: box_z = 20/30 × 1.5 = 1.0
#
# Units: dimensionless (ℏ = m = ω_ref = 1), ω_ref = 2π × 110 Hz
# ================================================================

pipeline:
  - ground_state:
      atom: Eu151
      grid:
        n: [128, 128, 16]
        box: [20.0, 20.0, 3.0]
      interactions:
        N_atoms: 50000
        omega_ref: 691.15
        c1_ratio: 0.0
        c_lhy: 1135.0
      ddi:
        enabled: true
      zeeman:
        p: 0.0
        q: 0.0
      potential: {type: harmonic, omega: [1.0, 1.0, 10.0]}
      dt: 0.0001
      n_steps: 100000
      tol: 1.0e-7
      initial_state: ferromagnetic_min
      backend: cuda

  - analyze:
      - phase_classify: {}

scan:
  product:
    pipeline.0.interactions.c1_ratio: [-0.02, -0.01, 0.0]
    pipeline.0.init_state_params.init_theta: [0.5, 0.8, 1.0, 1.2, 1.5707963]

  comparison_runs:
    - name: uniform_polarized
      override:
        pipeline.0.initial_state: ferromagnetic_min
        pipeline.0.target_magnetization: -6.0

    - name: fl_vortex
      override:
        pipeline.0.initial_state: spin_coherent
        pipeline.0.target_magnetization: 0.0
        pipeline.0.init_state_params:
          init_vortex_charge: 1
