          ["3.0e-41 m^6/s", "3.0e-41 m^6/s", "3.0e-41 m^6/s", "3.0e-41 m^6/s", "3.0e-41 m^6/s", "3.0e-41 m^6/s", "3.0e-41 m^6/s", "3.0e-41 m^6/s", "3.0e-41 m^6/s", "3.0e-41 m^6/s", "3.0e-41 m^6/s", "3.0e-41 m^6/s", "3.0e-41 m^6/s"]
      seed_amplitude: 1.0e-6
      seed_k_cut: 2.5
      save:
        every: 50
        psi: true
        precision: f64

  - analyze:
      - phase_classify: {}
      - winding_map: {}
      - energy_decomposition: {}
