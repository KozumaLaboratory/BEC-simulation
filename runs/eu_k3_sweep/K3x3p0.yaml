# K3 arrest threshold sweep — auto-generated.
# Source: scripts/validation/eu_k3_sweep_gen.jl
# Regime: N=30000, ω_z=0.25 (cigar collapse regime).
# K3_factor = 3.0 × Dy proxy = 3.0e-41 m⁶/s
# LHY off, γ_dr off — isolating pure K3 response.

metadata:
  suite: eu_k3_sweep
  ladder_level: 12
  parent_regime: cigar_N30k_omz0p25
  K3_factor: 3.0
  K3_per_m_si_value: 3.0e-41
  generator: scripts/validation/eu_k3_sweep_gen.jl

defaults:
  kind: spinor
  backend: cpu
  interactions: {N_atoms: 30000, omega_ref: 628.3}

pipeline:
  - ground_state:
      atom: Eu151
      grid: {n: [32, 32, 32], box: [12.0, 12.0, 12.0]}
      potential: {type: harmonic, omega: [1.0, 1.0, 0.25]}
      interactions:
        N_atoms: 30000
        omega_ref: 628.3
        c1_ratio: -0.005
      ddi:
        enabled: true
        secular: false
      lhy: {kind: none}
      B: {Bz: "-0.01 Gauss", theta: 0.0, phi: 0.0}
      gauge_fix: false
      initial_state: m_minus_F
      init_sigma: 1.5
      dt: 0.005
      n_steps: 2000
      tol: 1.0e-9

  - dynamics:
      duration: 20.0
      dt: 0.005
      B:
        Bz: {from: 0.01, to: 2.6e-5, duration: 0.0}
        theta: 0.0
        phi: 0.0
