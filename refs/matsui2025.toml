# Matsui et al. (2025) — the published numbers this repository quotes.
#
# `docs/design/research_spec_and_provenance_architecture.md` §2.5. Read by
# `ref(:matsui2025, :<quantity>)` (`src/model/ref.jl`); gated by
# `test/validation/test_matsui2025_ref.jl`.
#
# THE RULE THIS FILE EXISTS TO ENFORCE. A number taken from a paper is a number
# that can drift from the paper. So no target here is hand-typed as an authority:
# a `provenance = "measured"` row names the committed fixture, the metric, and
# the window, and `ref` RE-RUNS that measurement on every call and refuses the
# row if the stored `value` disagrees. The stored value is a cross-check, not the
# source. The other two provenances cannot be re-measured, so they carry their
# argument instead: `read_off` names the line of the authors' published source it
# came from, and `reconstructed` — a value the shipped source does NOT contain —
# additionally names the alternative it was chosen over and what choosing wrong
# costs, in units and by a stated method.
#
# A value without its argument is what this file exists to prevent, so the schema
# is closed on both sides: an unknown key is an error, and a missing required key
# is an error. `provenance` decides which keys are required.
#
# WHAT IS NOT HERE. Only quantities that are numbers. A convention that is not a
# number (m ordering, the sign of the Zeeman operator, which Laplacian) is a
# contract row, not a reference value, and lives in
# `docs/validation/parameter_contract_with_Ueda.md`. Only ONE paper: this is not
# a bibliography, and generalising it to a registry before there is a second
# paper would be inventing the requirement.

format = 1

[paper]
citation = "K. Matsui, M. Eto, T. Hirano et al., Observation of the Einstein-de Haas effect in a Bose-Einstein condensate"
journal = "Science"
year = 2025
doi = "10.1126/science.adx2872"
arxiv = "2504.17357"
# The data and code record. CC-BY-4.0, which is what licenses the CSV extracts
# under test/fixtures/matsui2025/ being committed here at all.
data_doi = "10.5281/zenodo.17303925"
licence = "CC-BY-4.0"
# Their Fortran (`time.f90`, `initial.f90`, `readme.txt` inside the record's
# `code.zip`) is the locus of every `read_off` row below. It is NOT committed
# here — only the CSV data extracts are — so the loci are pinned by content
# hash. A `read_off` row is re-checkable by `sha256sum` on a fresh download plus
# one `sed -n '<line>p'`; a `measured` row is re-checkable by running the suite.
source_sha256_time_f90 = "f39ada8cc20b42f7ef7e136a90b708720d5065c9799c52c41853f474713dec72"
source_sha256_initial_f90 = "6511f34572a5889ab25b5a301b1ea052c48d83fe181bf8be4435c84be1ce2c77"
source_sha256_readme_txt = "1c0013e03b6e47fd24bf13defbe9d90c9b26785353ffd1220b1f1fcd82093a6f"

# ---------------------------------------------------------------------------
# datasets — the bytes a measured quantity is measured off
# ---------------------------------------------------------------------------
#
# `column` is 1-indexed into the CSV: column 1 is the abscissa, columns 2..14 are
# N_{m} for m = -6 .. +6 ASCENDING in m. That is the mirror of our own layout
# (`c = 1` is `m = +F`), which is contract row 1.2 — so column 2 is `m = -6`, the
# source component Fig. 4B plots, and it is column 2 rather than column 14
# BECAUSE of that relabelling.

[dataset.fig4_theo]
path = "test/fixtures/matsui2025/dataset_fig4_theo.csv"
sha256 = "5cd28028a215024ee7785ce07c1cff5bab0894ec9d6d076f2e958611e8df4d41"
column = 2
preprocess = ["sort"]
abscissa = "Magnetic field, B (nT)"
note = """
Their SIMULATION, 61 points over [-20, +20] nT, totalling 49999.9 atoms at every \
field. The grid is NOT uniform: measured step histogram is {0.5 nT: 40 steps, \
1.0 nT: 20 steps} — 0.5 nT inside [-10, +10] and 1 nT outside. Loss-free \
(`L3loss = 0` on the Eu branch and `L3loss_eff = 0` globally), so it must not be \
overlaid on the experimental sheet as though one model produced both."""

