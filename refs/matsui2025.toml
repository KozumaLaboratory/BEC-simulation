path = "test/fixtures/matsui2025/dataset_fig4_exp.csv"
sha256 = "ab1c4fdc9ed7c725e0aea98d8ae76a190a7e47f993d91d890b9098043d28b141"
column = 2
preprocess = ["mean_over_repeats"]
abscissa = "Magnetic field, B (nT)"
note = """
Their MEASUREMENT: 227 rows over 61 unique fields spanning [-17.4979, +17.4979] \
nT, plotted as the per-field mean. The repeat structure is measured, not assumed: \
{3 repeats: 30 fields, 4: 20 fields, 5: 10 fields, 7: 1 field}. The ten 5-shot \
