[quantity.zeeman_q_Hz]
provenance = "read_off"
value = 1.0
units = "Hz"
locus = "time.f90:1692 (setup_parameters), branch at time.f90:248-253"
note = """
A LITERAL Hz input, not derived from |B|^2. Their code has two branches: \
`ZeemanQ /= 0` is taken as Hz and merely rescaled to trap units \
(`ZeemanQ = 2*pi*ZeemanQ/omegaX`, line 251); only `ZeemanQ == 0` computes \
`q = (gF*muB)^2 (B*1e-7)^2 / (2*pi*hbar^2*Ehf*omegaX)`. The Fig. 2 and Fig. 4 \
runs set it to 1.0, so the |B|^2 branch is never taken and the `Ehf = 1.772e9` \
sitting on their Eu branch — 23-Na's hyperfine splitting, reused — is dead code \
for these figures. Ours always derives q from |B|^2 and gets 9.6e-7 Hz at 2.6 nT: \
six orders down, and the gap is worth more than that, hence the cost below."""
alternative = 0.0
alternative_locus = "time.f90:253 — the derived |B|^2 branch, which is what SpinorBEC always does"
cost = 0.675880
cost_units = "nT of dip centre"
cost_kind = "analytic"

[quantity.c1_over_c0]
provenance = "read_off"
value = 0.027777777778
units = "dimensionless"
locus = "time.f90:283-284 with the `_eff` knobs at time.f90:25, applied at 322 and 326"
note = """
`cc0 = 8*pi*Ntot*a0/aHO`, `cc1 = cc0*1e-2/36`, then `cc0 *= cc0_eff = 0.5` and \
`cc1 *= cc1_eff = 50` — so c1/c0 = (1e-2/36)(50/0.5) = 1/36 exactly, which is our \
`c1_ratio` default. This is NOT a fit: `readme.txt` line 3 states the design rule \
the pair encodes — "cc0_eff + cc1_eff/100 = 1 and Esp/E0 = cc1_eff/100" — so \
their spin-dependent energy is half the polarised contact energy BY \
CONSTRUCTION, and 1/36 is a consequence of that choice at F = 6, not an \
independent parameter. Their F = 6 model is c0 + c1 only: a2 = a4 = a6 = 0 and \
cc2 = cc3 = 0 on the Eu branch (time.f90:219-228), so this dataset cannot \
constrain the six unmeasured Eu scattering channels."""

[quantity.a_contact_bohr]
provenance = "read_off"
value = 110.0
units = "Bohr radii"
locus = "time.f90:226 (variable `a0`)"
note = """
The one measured Eu scattering length in their model. Ours stores the same 110 \
a_B. Naming drift worth knowing: their variable is `a0`, our `AtomSpecies` field \
is `a0` exported as `a_s`, and `docs/validation/matsui_reproduction_status.md` \
calls the same quantity `a_12`. Numerically harmless — with a2 = a4 = a6 = 0 only \
the combination c0 + 36 c1 uses it — but three names for one number. A separate \
determination exists (135 a_B, Miyazawa 2021 thesis); this row is THEIR 110."""

[quantity.g_F]
provenance = "read_off"
value = 1.1628
units = "dimensionless"
locus = "time.f90:228"
note = """
A 5-digit literal. Ours derives 1.1628166667 from `lande_g_factor(6, 5/2, 7/2; \
g_J = 1.9934)`. The difference is 1.43e-5 relative and enters linearly in p, so \
it is equivalent to a 1.43e-5 relative error in B: 3.7e-5 nT at the 2.6 nT \
working point, four orders below the 0.41 nT gap being investigated."""
alternative = 1.1628166667
alternative_locus = "ours: lande_g_factor(6, 5/2, 7/2; g_J = 1.9934) in foundation/"
cost = 0.0000372
cost_units = "nT of dip centre"
cost_kind = "analytic"

[quantity.mass_kg]
provenance = "read_off"
value = 2.50741e-25
units = "kg"
locus = "time.f90:221"
note = """
Their mass is A = 151 u; ours is the isotopic 150.919857 u = 2.506083e-25 kg. The \
difference is 5.30e-4 relative. It enters c0 + 36 c1 = 4*pi*N*a_s/a_ho with \
a_ho ∝ m^(-1/2), so the coupling moves by half of that, 2.65e-4 relative — below \
every effect in §0.7 and recorded so it does not have to be re-derived."""
alternative = 2.506083e-25
alternative_locus = "ours: ATOM_REGISTRY[:Eu151], isotopic mass 150.919857 u"
cost = 0.000265
cost_units = "relative in c_0 + 36 c_1"
cost_kind = "analytic"

[quantity.omega_x_Hz]
provenance = "read_off"
value = 110.0
units = "Hz"
locus = "time.f90:1668, with omegaY = omegaX at time.f90:1684"
note = """
The reference frequency: omega_ref = 2*pi*110 = 691.1503838 rad/s. Their trap is \
`V = (1/4)(x^2 + y^2/aratio_y^4 + z^2/aratio_z^4)` (time.f90:1870); the 1/4 is \
their aHO = sqrt(hbar/2*m*omega) length unit, not a different trap. Their \
`time_step = 1e-3` transfers to our `dt` unchanged, because 1/omega_x is the time \
unit on both sides."""

[quantity.omega_z_Hz]
provenance = "read_off"
value = 130.0
units = "Hz"
locus = "time.f90:1669"
note = "omega_z/omega_x = 1.1818181818, which is our `omega: [1, 1, 1.181818]`. Mildly oblate."

[quantity.length_unit_ratio]
provenance = "read_off"
value = 1.4142135624
units = "dimensionless (a_ho / aHO)"
locus = "time.f90:245"
note = """
`aHO = sqrt(hbar/(2*m*omegaX))` — the factor 2 is INSIDE — against our usual \
`a_ho = sqrt(hbar/(m*omegaX))`. Every length, density and dimensionless coupling \
differs by a power of sqrt(2), and this is the first transformation to apply \
before any number crosses between the two codes (contract row 8.1). It is also \
why their kinetic prefactor is 1 rather than 1/2 and why their trap carries a \
1/4. `docs/validation/parameter_contract_with_Ueda.md` cites line 244 for this; \
the assignment is on 245."""

[quantity.b_field_initial_mG]
provenance = "read_off"
value = 10.4
units = "mG"
locus = "time.f90:1686"
note = """
The field the ramp starts from, 1.04 uT. Cross-check on the whole B -> p chain: \
`Units.bfield_to_p` returns p = -153.87336 here and their `ZeemanP` (time.f90:258, \
taken because `ZeemanP = -10` is negative, line 1691) is +153.87. The operators \
agree — ours is `H = -p F_z`, theirs `H = +ZeemanP F_z` — and the intermediate p \
differs in sign only because we route through Kawaguchi-Ueda's p and they do not. \
`docs/validation/matsui_reproduction_status.md` line 47 states 1 uT for this; the \
shipped value is 1.04 uT."""

[quantity.b_field_tau_us]
provenance = "read_off"
value = 50.0
units = "us"
locus = "time.f90:1688, converted to trap units at time.f90:1740"
note = """
Their ramp is EXPONENTIAL and re-evaluated every step: \
`B(t) = (B_ini - B_fin) exp(-t/tau) + B_fin` (time.f90:1898). Ours uses a 150 us \
LINEAR stand-in. That substitution is priced by a run, not by argument: \
`runs/matsui_fig4b/fig4b_theirramp_n32.yaml` puts it at 0.07 nT of centre and \
0.05 nT of width, against a 0.41 nT gap."""

[quantity.b_field_final_nT]
provenance = "read_off"
value = 2.6
units = "nT"
locus = "time.f90:1687 (26e-3 mG)"
note = """
The Fig. 2C working point, and the knob Fig. 4B scans: `readme.txt` line 4 names \
line 1687 as the scanned variable in so many words. p/h = 42.315 Hz here at \
g_F = 1.16282, which is the scale every Zeeman cost above is quoted against."""

[quantity.grid_points]
provenance = "read_off"
value = 128.0
units = "points per axis"
locus = "time.f90:1671"
note = "Cubic. Ours ran 32^3 and 64^3; the 64^3 arm agrees with 32^3 to 0.48 % worst-case."

[quantity.dx_aHO]
provenance = "read_off"
value = 0.4
units = "aHO (their length unit — see length_unit_ratio)"
locus = "time.f90:1672, with dy = dx at 1682"
note = """
0.4 aHO = 0.283 a_ho, against a healing length xi = 1/sqrt(mu) ~ 0.28 a_ho — about \
0.7 points per healing length, where their 3-point finite-difference Laplacian \
(time.f90:491-500) has a dispersion error that is not small. That is one of the \
two surviving candidates for the §0.7 gap. UNPRICED AND WORTH RECORDING: 128 x \
0.4 aHO is a 51.2 aHO = 36.2 a_ho box, and ours is 16 a_ho — 2.26x smaller. The \
64^3 convergence arm varied dx at FIXED box, so it cannot see a box effect, and \
the contract discusses dx at length without ever mentioning the box."""

[quantity.pad_factor]
provenance = "read_off"
value = 2.0
units = "dimensionless"
locus = "time.f90:1679 (`sn = 2`); initial.f90 uses sn = 1"
note = """
DDI zero-padding for the dynamics, matching our `pad_factor: 2`. Their GROUND \
STATE is unpadded, which is a real difference from ours and the only surviving \
item of contract §0.3.5's second point. They apply no real-space truncation of \
the kernel and no dealiasing; their k = 0 bin keeps `DD0(0) = -4*pi/3` where ours \
sets Q(0) = 0, worth an analytically-bounded 5e-3 nT here."""

[quantity.time_step_trap_units]
provenance = "read_off"
value = 0.001
units = "1/omega_x"
locus = "time.f90:1685"
note = """
Their integrator is Crank-Nicolson iterated to self-consistency (`zure <= 1e-10`, \
time.f90:526), not split-step. Second order either way; the contract's acceptance \
criteria already allow the method to differ for the energy and H-psi rows."""

[quantity.L3_loss]
provenance = "read_off"
value = 0.0
units = "trap units"
locus = "time.f90:222 (Eu branch) and time.f90:25 (`L3loss_eff = 0` globally)"
note = """
Zero twice over, so the published THEORY curves are strictly loss-free and must \
not be compared against the experimental sheet as if loss were in both. Their loss \
term has our `K3_per_m_cubic` shape when enabled. Our own 10x-K3 arm is worth \
