# ---------------------------------------------------------------------------
# MEASURED — Fig. 4B targets. `ref` re-runs `resonance_dip` and refuses a
# disagreement; `value` below is the cross-check, not the authority.
# ---------------------------------------------------------------------------
#
# THE WINDOW IS PART OF THE METRIC, NOT A DETAIL. `resonance_dip`'s `center` is a
# parabolic vertex through three samples and is invariant to the window (measured:
# identical to all 12 digits over [-20,20], [-13,9], [-12.5,9], [-13,9.5] and
# [-12,9]). Its `width` is a half-depth crossing against a per-side ENDPOINT
# baseline and is therefore defined BY the window: the same simulated curve gives
# 15.0224 nT over the full published range, 13.0734 over [-13, +9] and 12.7524
# over [-12.5, +9]. Those are three correct measurements of three different
# things. A row storing a bare width would be under-determined by 2.3 nT (18 %),
# which is twice the gap it is used to arbitrate — hence `window` and
# `window_from` are required, and `quotable_digits` records that the arbitrating
# widths are good to two significant figures, not four.
#
# WHICH ROWS DECIDE, AND WHO GETS TO SAY. `arbitrates` is NOT a key here. It is
# derived — `isempty(disqualified_by)` — and `disqualified_by` draws from a closed
# vocabulary (`REF_DISQUALIFIERS` in `src/model/ref.jl`) in which every entry is a
# property of the REFERENCE: their axis, the window, the metric. A free Bool would
# be set by whoever can also see how our number compares, which is the approval-
# testing failure mode — golden tests fail by BLESSING a wrong value — and the
# shape is visible right here: `dip_minimum_sim_atoms`, the quantity we disagree
# with MOST, is non-arbitrating. Its grounds are real, but under a free Bool
# "their counting systematic swamps it" and "we do not like the number" were the
# same three characters. Naming the systematic separates them.

[quantity.dip_centre_sim_nT]
provenance = "measured"
value = -2.549460769257
units = "nT"
dataset = "fig4_theo"
metric = "resonance_dip"
metric_field = "center"
endpoint_baseline = true
window = "full"
window_from = "the published range of their own simulated curve"
disqualified_by = []
quotable_digits = 3
note = """
The number a second implementation of the same model has to reproduce. The paper \
contrasts an analytic -1.5 nT with an observed -3.5 nT and attributes the gap to \
the gas's dipole field; their own simulation, which contains that field, lands at \
-2.55 nT, so -2.55 is the code-vs-code target and neither -1.5 nor -3.5 is. \
Nothing disqualifies it, for the CODE-vs-CODE comparison: the centre is \
window-invariant (measured identical to 12 digits over five windows, so \
`window_not_covered` cannot apply) and no experiment enters it, so neither can \
`axis_offset`."""

[quantity.dip_centre_exp_nT]
provenance = "measured"
value = -3.204834206752
units = "nT"
dataset = "fig4_exp"
metric = "resonance_dip"
metric_field = "center"
endpoint_baseline = true
window = "full"
window_from = "the published range of their own measured scan"
disqualified_by = ["axis_offset"]
quotable_digits = 3
note = """
`axis_offset`, and that is the point of this row: it exists to be quotable and \
to be REFUSED as a target. The Fig. 4 caption states the field axis "may contain \
an offset error of up to 10 nT" — three times the centre itself — so -2.14, \
-2.55, the measured -3.20 and even the paper's own -1.5 nT analytic estimate are \
all consistent with this measurement. Any claim that a simulated centre "agrees \
with experiment" claims more than this axis supports. The disqualifier is a \
property of THEIR axis, stated in THEIR caption; it does not depend on what our \
code produces."""

