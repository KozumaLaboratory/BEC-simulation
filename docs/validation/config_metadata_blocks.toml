# Every `metadata:` block that cutover step 6 deletes, verbatim.
#
# `docs/design/unified_spec_architecture.md` cutover step 6. Gated by
# `test/validation/test_config_prose_harvest.jl`. Judgement lives in the
# companion `config_prose_harvest.toml`; this file is the mechanical record.
#
# WHY BOTH FILES. The harvest is a SAMPLE -- 300 items read by hand out of 429
# configs -- and a sample is not a licence to delete 302 blocks. Everything
# removed from a config in this step is reproduced here byte-for-byte, so the
# deletion is safe by construction rather than by how well the reading went.
# `git show` would also recover it, but only for someone who already knows the
# commit; a committed file is recoverable by someone who does not.
#
# WHAT WAS DELETED, MEASURED. 302 of 429 configs carried the block, 2,107
# physical lines of block content (2,395 counting the trailing blank lines the
# deletion also reclaims), 59 distinct keys. Not the 45 the plan estimated --
# and five of the 59 are not keys at all but the wreckage of an unquoted comma
# inside a YAML flow mapping (`project: Eu151 GS - precision c1* (first-order
# FM/polar, B0 k1)` parses as a truncated `project` plus a null key named
# `B0 k1)`). Those five have sat in the tree undetected precisely because
# `metadata:` had no readers, which is the argument for the step in one line.
#
# WHY IT COULD GO. Three sites mention the key and none of them READS it:
# `schema/schema.jl:402` lists it in `TOP_LEVEL_KEYS` so it does not warn,
# `runfactory.jl:237` lets the DSL write one, and `inspect_checks.jl:48`
# permits it to be dropped. Nothing in `src/`, `ext/`, `scripts/` or `test/`
# ever looks a key up. So the block could not be wrong in a way anything would
# notice -- and it was. Measured across this dump: `generator:` names a `.jl`
# path in 154 configs, 23 distinct paths, and every one of the 23 is absent
# from the tree -- each config under a header reading "auto-generated, do not
# hand-edit", an instruction no longer possible to obey. (The remaining 2 of
# the 156 say "hand-written", which is the only accurate value the key ever
# held.)
#
# FOUR MORE SITES, OUTSIDE `runs/`, NOT ROWS BELOW. The `[[block]]` rows cover
# `runs/**` only, which is where a config lives; the key also appeared in YAML
# embedded in three test files and in one document. They were found by the
# `fast` tier going red, not by the sweep that wrote this file -- a `grep` over
# `runs/` cannot see a YAML string inside a `.jl`. Recorded here because "what
# was deleted" is the claim this file makes, and it would otherwise be four
# short:
#
#   test/workflow/test_spinor_gs_from_jld2.jl  (x2)  decorative, removed
#   test/workflow/test_run_root_env.jl               decorative, removed
#   test/workflow/test_schema_validation_edge_cases.jl
#       NOT decorative: `metadata:` was the filler key in the config that
#       asserts a MISSING `pipeline:` throws. With the key gone the throw came
#       from "unknown top-level key" instead and the assertion kept passing
#       while testing nothing. Replaced with `name:`, which the schema still
#       recognises. A deletion can weaken a gate without reddening it.
#   docs/validation/step6_ueda_reference_state/reference_state.yaml
#       Four real provenance values (suite, ladder_level, reference, origin).
#       Converted to comments IN THAT FILE rather than dropped -- they are the
#       only statement of what that reference state is.
#
# WHAT IS NOT HERE. The comment prose. That is the larger body (4,673 lines)
# and it is NOT deleted by this step; see `config_prose_harvest.toml` for what
# it contains and what each item is waiting on.
#

