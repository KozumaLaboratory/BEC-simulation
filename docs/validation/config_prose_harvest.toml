# The knowledge that lived in run-config prose, and where each piece went.
#
# `docs/design/unified_spec_architecture.md` cutover step 6. Gated by
# `test/validation/test_config_prose_harvest.jl`. Companion file:
# `config_metadata_blocks.toml`, the verbatim dump of the `metadata:` blocks
# this step deletes.
#
# WHY THIS FILE EXISTS AT ALL. Step 6 deletes `metadata:` -- 59 ad-hoc keys that
# nothing reads. That is the small half. The large half is that this repository
# has been landing read literature, experimental aims and reconstructions as
# PROSE: 4,673 comment lines across 429 YAML configs under `runs/`. The
# mechanism is disposable and the knowledge is not, and the failure mode is
# already demonstrated in-tree -- `matsui_edh_baseline_TWIN_OFF.yaml:6` says, of
# itself, "Comments from the original YAML are lost on the round-trip". A twin
# control, the arm that makes an A/B mean anything, is generated by a path that
# discards every reason the original config had.
#
# WHY A GATED TOML AND NOT A MARKDOWN NOTE. The requirement is not readability,
# it is that an item cannot VANISH. A prose inventory is checkable only by
# someone re-reading it; this file is checkable as a SET -- the gate pins 300
# ids, six suites and the five bucket counts as literals and asserts set
# equality, so deleting a row, renaming one, or quietly widening a bucket turns
# it red. TOML because the parser is stdlib (no dependency for a gate), because
# `refs/matsui2025.toml` already establishes machine-read provenance data in
# this shape, and because multi-line LITERAL strings process no escapes, which
# is what verbatim prose full of backslashes and quotes requires.
#
# WHY NOT UNDER `refs/`. `_known_sources()` (`src/model/ref.jl:195`) treats
# every `refs/*.toml` as a paper, so a file here would be offered as
# `ref(:config_prose_harvest, ...)` and then fail the closed `_PAPER_KEYS`
# schema. `docs/validation/` is where this repository already keeps
# provenance records that are read by people and gated by tests
# (`parameter_contract_with_Ueda.md`, `stored_results_vintage_audit.md`).
#
# WHAT A ROW MEANS. `bucket` is what the knowledge IS. `disposition` is where it
# went TODAY, which is a different question and mostly a less flattering answer:
#
#   landed                   already in a committed artifact; the prose is a copy
#   refs_extended            added to refs/matsui2025.toml in this pass
#   open_needs_code          destination is a gate / schema check / analyzer
#   open_needs_measurement   a measured row is a recipe ref() re-runs; no fixture yet
#   open_no_pinnable_source  refs/ needs a content-pinned locus; the source is not here
#   open_ledger_caveat       design (F): attaches to the value and travels -- Ledger
#   open_ledger_retracted    design :retracted, keyed on name id -- Ledger
#   discard                  dropped, with the reason in `destination`
#
# THE FIVE `open_*` DISPOSITIONS ARE NOT A PLAN, THEY ARE A DEBT. 252 of 300
# items are open. Every one names its destination and what blocks it. Nothing
# here is deleted from the configs on the strength of a `destination` field: the
# prose stays until the destination exists, and this file is what makes "until"
# checkable instead of remembered.
#
# `locus` IS `file:line` AS OF f758d7d3, THE COMMIT THIS HARVEST WAS READ AT.
# The same pass that wrote this file deleted 302 `metadata:` blocks, which moved
# every line below one: measured, 49 of the 249 `runs/<config>.yaml:<line>` loci
# here now point one block too low. They were NOT rewritten, because a line
# number chased through an edit is a number that has been changed without being
# re-read. The durable anchor is `verbatim`, which is the text itself and does
# not move; `locus` names the revision, exactly as a `read_off` row in
# `refs/matsui2025.toml` names `time.f90:1692` against a pinned sha256 rather
# than against whatever that file says today.
#
# THE TWO LEDGER DISPOSITIONS ARE THE HONEST ANSWER, NOT A PLACEHOLDER. The
# unified design already fixes where a caveat and a retraction go, and it is not
# a second registry: a caveat is (F), "served under a weaker rule ... attached to
# the value, and it travels", carried in `Held.caveats`; a retraction is the
# `:retracted` tag, "keyed on name id so an entry becomes inadmissible without
# changing any name or deleting bytes", and `held` walks `from` and `evidence`
# so it reaches every citer. Neither is LANDED -- there is no `Ledger` module,
# no `held`, no `why` in `src/` today; `refs/` + `ref()` and `src/model/claim.jl`
# are what step 5 shipped. So 131 caveats and retractions have a designed home
# and no built one. Building a lookalike here would be the parallel registry the
# design exists to prevent, so they stay in prose and this file is their holding
# pen -- with the row that will consume them named per item.
#

format = 1

