# Claim ledger — one row per physics claim, with its status as a FIELD, not as prose.
#
# WHY THIS FILE EXISTS
#
# `docs/campaign/edh_quench_polarisation_decision.md` is an excellent change log and
# a bad place to look up what is currently true. It records, in order, that
# `|Ω|/ω_⊥ = 0.468 ± 0.003` was the prescription, then that it is not re-derivable,
# then that `0.68 ± 0.04` replaces it. Reading it front to back gives the right
# answer. Reading any one section does not, and nothing in the tree says which
# section is the live one.
#
# The measured consequence is in `docs/manuscript/klaus_protocol_sheet.md`. That
# file carries a correct, detailed retraction at lines 17-70 — and then states the
# retracted numbers bare at lines 105, 125, 227, 232-234, 255 and 293, including
# inside the numbered lab protocol an experimentalist would actually follow. The
# retraction is 160 lines above the point of use. Both PR #401 and PR #403 updated
# the retraction block and left the protocol steps alone. Nothing was careless:
# the status of a claim was not a thing the tree could hold, so it lived in
# whichever paragraph someone last remembered to edit.
#
# So: status is a field. `superseded` and `refuted` are different values, `refuted
# with no replacement` is representable, and `uncertainty` is REQUIRED — a row that
# cannot state what bounds it is a row nobody has bounded, and that is information
# rather than an omission to be defaulted away.
#
# WHAT A ROW IS
#
#   id                  stable kebab identifier; referenced by supersedes/superseded_by
#   claim               the assertion, one sentence, in the form it should be quoted
#   status              live | scoped | superseded | refuted | suggested | open | closed
#                       `closed` = an `open` gap shut by doing the work; it keeps the
#                       row rather than deleting it, because "this was looked at" is
#                       the part a reader needs, and it requires a `note` saying what
#                       shut it.
#   type                A (code correctness) | B (physics agreement) | C (model fidelity)
#                       — the taxonomy in CAMPAIGN.md §5, unchanged
#   scope               what the claim is true OF: grid, seed count, closure, field,
#                       preparation, duration. A claim with no scope is a claim
#                       nobody has bounded.
#   uncertainty         REQUIRED, non-empty. If nothing bounds it, say so in those
#                       words — `unbounded: <why>` — do not leave it out.
#   uncertainty_basis   fit | grid | dt | seed | control | none — how the number above
#                       was obtained. `none` and a filled `uncertainty` is a
#                       contradiction the gate rejects.
#   evidence            run configs / arm sets the claim rests on
#   evidence_status     in_tree | partial | absent — whether `evidence` resolves in
#                       this repo. `absent` is common and is not a defect by itself;
#                       it is the L1 hook, and it is what makes a re-derivation
#                       cost visible before someone promises one.
#   commit              producing commit
#   doc, section        where the claim is written out (the L3 anchor)
#   pr                  the PR that last moved this row
#
# Optional:
#   supersedes / superseded_by   ids. Both directions are declared; the gate checks
#                                they agree, so a half-migrated retraction is red.
#   retired_literal              REQUIRED on superseded/refuted rows. String or
#                                array — a retracted claim usually survives in
#                                more than one wording, and the lab instruction
#                                and the mechanism sentence are different points
#                                of use. This is what the gates scan for.
#   replacement_literal          String or array. What must appear instead.
#                                DELIBERATELY ABSENT on a row refuted with no
#                                replacement — `edh-window-1p3nt-0p3` is the case:
#                                at 1.3 nT there is no operating window to
#                                relocate the number to, and an empty field says
#                                that where a placeholder value would hide it.
#   prediction                   a statement fixed BEFORE the measurement
#   prediction_registered        before | after — `after` is not a prediction and the
#                                gate refuses to count it as one
#   prediction_outcome           hit | miss | pending
#   note
#
# THE FIRST DOCUMENT POURED IN is the rotation-assisted EdH quench decision doc
# (#343 → #392 → #401 → #403). It was chosen because it contains every shape a
# claim can have: a number with a fit uncertainty, the number it replaced, a
# prescription refuted with no replacement, a claim whose replacement is a SHAPE
# rather than a number, a hypothesis with a registered test, a gate that failed,
# and a scope restriction that applies to all of them at once.

