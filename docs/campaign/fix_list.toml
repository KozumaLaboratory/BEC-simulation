note = """
The only entry here that corrects CONFIGS rather than code, so read the gate \
carefully: descending from this ref does not by itself mean a run used a repaired \
config — it means the repaired config was available. A run whose YAML is not one \
of the 211 (or is not committed at all) is not addressed by this row either way. \
Nothing errored: m=-F is a Zeeman eigenstate, so ITP holds it and the run completes \
with a plausible result for the opposite polarisation. Largest affected groups: \
57 verification_suite, 52 klaus_quench, 16 barnett_eu_window, 12 l4_k3_ladder. \
Class gate: test/workflow/test_config_zeeman_seed_agreement.jl. \
Still open, and deliberately not repaired here: configs pinning m_plus_F under a \
POSITIVE B_z, where flipping the field and flipping the seed are both consistent \
and are physical mirror images, so the intent is not recoverable from the file."""

