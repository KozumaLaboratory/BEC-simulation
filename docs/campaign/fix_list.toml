# Campaign ancestor gate — the ref list read by guard 1 of docs/campaign/CAMPAIGN.md §4.
#
# A run is campaign evidence only if its producing commit descends from EVERY ref below:
#
#     git merge-base --is-ancestor <ref> <producing_commit>
#
# The check is mechanical. "The run looks recent" is not the check — one re-derivation
# was nearly published against a fix that merged 22 minutes after the run.
#
# This file is the only place the SHAs are declared. The table in CAMPAIGN.md §2 carries
# the human-readable context and deliberately carries no SHAs, so the two cannot drift.
#
# Adding a row disqualifies past runs by construction. That is the intended behaviour.
#
# Every ref was verified an ancestor of main at 2a0075e6 (2026-07-30); the
# eu-config-field-sign row was added later and verified at b2d746cc (2026-08-19).
# The verification is not a one-off: `test/test_campaign_fix_list_gate.jl`
# re-runs `git merge-base --is-ancestor <ref> HEAD` over every row on every ci run,
# so a row naming a ref that is not in this history reddens the suite.

schema_version = 1

[[fix]]
id = "ddi-cdd-f-squared"
ref = "c6b1ed0b"
merged = 2026-04-28
summary = "c_dd carried an unnecessary F^2 = 36 factor"
effect = "effective DDI 7,647 -> 275,292; every DDI-dependent result before this ref is void"
note = """
THE OLDEST ROW HERE AND THE LAST ONE ADDED, which is the finding. Until 2026-08-25 the \
only record of this defect anywhere in the tree was a CODE COMMENT — \
`src/hamiltonian/coefficients.jl:95`, "DO NOT MULTIPLY BY F^2 <- this docstring exists \
because Bug-3 was an F^2/36x". The value-level SSoT held perfectly and nothing that the \
gate reads said the fix existed, so guard 1 could not disqualify a single pre-2026-04-28 \
DDI run. Same shape as eu-config-field-sign and eu-edh-corpus-anti-aligned-retarget: the \
prose leant on a correction the machine-readable list had never been told about.

Diagnosed twice wrong before it was found — the ITP energy oscillation was read as \
Yoshida w0 < 0 back-diffusion, then as a failure of DDI self-consistency, and only then \
as c_dd. That history is why the guard comment at the coefficient is phrased as an \
imperative rather than a description.

CATEGORY, stated because it has been miscategorised: this was caught by INTERNAL \
diagnosis, not by comparison against a published result. It is a coefficient/scaling \
defect (numbers ran before the analytic limit was checked) compounded by the same \
physics living in more than one place and drifting. The second half is already digested \
into the HamTerm protocol and day-0 gated redundancy; this row records the first.

Provenance is OUTSIDE the repo — project chat conv 606ac7ca (2026-04-22) found it, conv \
41595d89 (2026-06-11) audited it and drafted a ledger row that never landed. Recorded \
here because a fix whose only witness is a chat log is a fix the gate cannot see.
"""

