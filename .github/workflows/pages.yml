name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "examples/configs/output/*.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir _site
          if ls examples/configs/output/*.html 1>/dev/null 2>&1; then
            first=$(ls examples/configs/output/*.html | head -1)
            cp "$first" _site/index.html
            for f in examples/configs/output/*.html; do
              cp "$f" "_site/$(basename "$f")"
            done
          else
            echo "<h1>No dashboards built yet</h1>" > _site/index.html
          fi

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
