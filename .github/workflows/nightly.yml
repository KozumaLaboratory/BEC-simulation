name: Nightly heavy YAML

# Runs the `full` tier with `SPINORBEC_RUN_HEAVY_YAML=true`, picking up
# (a) every test the per-push `ci` tier defers — heavy pipeline /
# continuation / GPU / TWA / rotating-basis — and (b) the YAML pipeline
# integration tests guarded by `_SKIP_HEAVY_YAML_INFRA` /
# `_SKIP_HEAVY_YAML_ZEEMAN`. Each guarded block drives `run_pipeline`
# through a multi-minute JIT cascade (CLAUDE.md > "Type stability
# boundaries"), which is why this is gated to nightly.

on:
  schedule:
    # 02:00 UTC every day = 11:00 JST. Skips weekends to save runner
    # minutes — failures on Mon-Fri are usually enough to catch drift.
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

concurrency:
  group: nightly-heavy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  heavy:
    name: Heavy YAML (Julia 1.12, tier=full)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SPINORBEC_TEST_TIER: full
      SPINORBEC_RUN_HEAVY_YAML: "true"
      # Parallel test execution (see test/runtests.jl), LPT-balanced. Measured
      # full-tier peak is ~2.7 GB per process, so 4 concurrent chunks (~11 GB)
      # stay clear of the 16 GB runner ceiling while cutting wall-time the most:
      # the two long poles (BO ~161 s, triple-point ~127 s) and the cold F32
      # JIT land on separate chunks. Total serial ~14 min → makespan ~4-5 min.
      SPINORBEC_TEST_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false   # see .github/workflows/ci.yml for rationale
