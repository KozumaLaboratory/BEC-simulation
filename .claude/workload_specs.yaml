# Workload metadata for the loop scheduler.
#
# Each workload class declares its typical resource fingerprint so the
# scheduler can decide whether it fits in a given time window with a
# given resource probe.
#
# Numbers are TYPICAL (medians from observed loop history), not hard
# guarantees. Scheduler uses them for bin-packing decisions; the judge
# enforces hard cost caps at the end.

theorist:
  typical_duration_sec: 900       # 15 min — derivation + sympy check
  typical_cost_eff: 1500000       # ~1.5M effective tokens
  requires_julia: false
  requires_gpu: false
  min_ram_gb: 1                   # text only
  notes: "Pure derivation. T7 = 0.96M, T10 = ~1.7M solo (T10 retry inflated to 2.1M)."

researcher:
  typical_duration_sec: 720       # 12 min — WebSearch / WebFetch
  typical_cost_eff: 1000000
  requires_julia: false
  requires_gpu: false
  min_ram_gb: 1
  notes: "shallow tier. WebFetch + abstract-level citation chain construction."

researcher_deep:
  typical_duration_sec: 1800      # 30 min — 30+ parallel queries + 10 full-PDF reads + 2 iteration rounds
  typical_cost_eff: 4500000
  requires_julia: false
  requires_gpu: false
  min_ram_gb: 2
  notes: |
    Anthropic/OpenAI-Deep-Research-grade single-context researcher per
    `researcher.md` §B6+B7. Mandatory full-PDF fetches for load-bearing
    citations, page-level grounding, contradiction surfacing,
    confidence-per-claim calibration. Use when investigation has
    tier_target=3 OR a prior shallow research turn produced contradictions
    OR the question involves unit-system / hyperfine-state /
    normalization choices.

researcher_exhaustive:
  typical_duration_sec: 3600      # 60 min single turn; multi-context spans multiple turns
  typical_cost_eff: 10000000
  requires_julia: false
  requires_gpu: false
  min_ram_gb: 2
  notes: |
    Paradigm-level research (refuting an established result, exploring a
    new physical regime). 100+ queries, full PDFs + cross-citation graph,
    3+ iteration rounds. May require multi-researcher dispatch per
    `researcher.md` §B8 (parallel_researcher_count > 1) to escape single
    context budget. Director must justify exhaustive tier in §6.rationale
    against deep alternative.

critic:
  typical_duration_sec: 600       # 10 min — independent audit
  typical_cost_eff: 1300000
  requires_julia: false
  requires_gpu: false
  min_ram_gb: 1
  notes: "T6 (FAIL) = 1.26M; T9 (WEAK_PASS, retry) = 1.91M. Critic is Read-only; needs orchestrator to materialize git objects."

implementer_text:
  typical_duration_sec: 600       # 10 min — text-only edit
  typical_cost_eff: 1500000
  requires_julia: false
  requires_gpu: false
  min_ram_gb: 1
  notes: "T8 = 1.55M baseline. Docstring / manuscript edit class."

implementer_sympy:
  typical_duration_sec: 720
  typical_cost_eff: 1200000
  requires_julia: false
  requires_gpu: false
  min_ram_gb: 1
  notes: "compute_sympy class. uv ephemeral, ~100 MB python."

implementer_julia_cpu_light:
  typical_duration_sec: 600       # 10 min
  typical_cost_eff: 1500000
  requires_julia: true
  requires_gpu: false
  min_ram_gb: 3
  notes: "Single test file Pkg.test, smoke test 16³ grid, jld2 reader script."

implementer_julia_cpu_heavy:
  typical_duration_sec: 1500      # 25 min
  typical_cost_eff: 1800000
  requires_julia: true
  requires_gpu: false
  min_ram_gb: 8
  notes: "32³ CPU GS, full Pkg.test subset, multi-config sweep on CPU backend."

implementer_julia_gpu:
  typical_duration_sec: 2400      # 40 min (incl. JIT)
  typical_cost_eff: 2000000
  requires_julia: true
  requires_gpu: true
  min_ram_gb: 6
  min_vram_mb: 12000
  notes: "Full Eu 32³ GS+RTP on CUDABackend. JIT ~10 min first call (cached after)."

noop:
  typical_duration_sec: 60
  typical_cost_eff: 100000
  requires_julia: false
  requires_gpu: false
  min_ram_gb: 0
  notes: "Director-noop: emit a noop dispatch + halt or sleep until next window."
